const isMoney = v => /^R\$/i.test(String(v == null ? '' : v).trim());
const toBR = v => {
  const t = String(v || '').trim().split(' ')[0].split('T')[0];
  if (/^\d{4}-\d{2}-\d{2}$/.test(t)) { const [y,m,d] = t.split('-'); return `${d}/${m}/${y}`; }
  return /^\d{2}\/\d{2}\/\d{4}$/.test(t) ? t : '';
};
const stTxt = v => String(v == null ? '' : v).trim().toUpperCase();

function normPre(p){
  const novo = ('ocorrencia' in p) || ('carimboDataHora' in p);
  const antigoDesloc = !novo && isMoney(p.statusCd) && isMoney(p.statusLoja) && !(+p.valorTotal);
  let r;
  if (novo) {
    const qtd = parseNum(p.qtd), vu = parseNum(p.valorUnitario);
    let vt = parseNum(p.valorTotal);
    if (!vt && qtd && vu) vt = qtd * vu;
    const t = stTxt(p.ocorrencia);
    r = { data: toBR(p.carimboDataHora), dias: +p.diasSemRetorno || 0, loja: String(p.loja || '').trim(), pedido: String(p.pedido || '').trim(), dataEmissao: toBR(p.dataEmissao), nf: String(p.nf || '').trim(), codProd: String(p.codProd || '').trim(), prod: String(p.prod || '').trim(), qtd, un: String(p.um || '').trim(), tipo: (t === 'SOBRA' || t === 'FALTA') ? t : '', valorUnit: vu, valor: vt, origem: String(p.origem || '').trim(), statusCd: stTxt(p.statusCd), statusLoja: stTxt(p.statusLoja), obs: String(p.observacao || '').trim() };
  } else if (antigoDesloc) {
    r = {data:'', dias:0, loja:String(p.pedido || '').trim(), pedido:String(p.dataRegistro || '').trim(), dataEmissao:'', nf:String(p.nf || '').trim(), codProd:String(p.qtd || '').trim(), prod:String(p.um || '').trim(), qtd:parseNum(p.tipo), un:'', tipo:'', valorUnit:parseNum(p.statusCd), valor:parseNum(p.statusLoja), origem:'', statusCd:'', statusLoja:'', obs:String(p.prod || '').trim()};
  } else {
    const t = stTxt(p.tipo), rawLoja = String(p.loja || '').trim();
    r = {data:toBR(p.dataRegistro), dias:0, loja:/^\d+$/.test(rawLoja) ? getNomeLoja(rawLoja) : rawLoja, pedido:String(p.pedido || '').trim(), dataEmissao:'', nf:String(p.nf || '').trim(), codProd:String(p.codProd || '').trim(), prod:String(p.prod || '').trim(), qtd:parseNum(p.qtd), un:String(p.um || '').trim(), tipo:(t === 'SOBRA' || t === 'FALTA') ? t : '', valorUnit:0, valor:parseNum(p.valorTotal), origem:'', statusCd:stTxt(p.statusCd), statusLoja:stTxt(p.statusLoja), obs:''};
  }
  r.loja = r.loja || 'Sem loja'; r.mes = r.data ? nfMes(r.data) : 'Sem data';
  const txt = `${r.nf} ${r.pedido} ${antigoDesloc ? r.obs : ''}`.toUpperCase();
  if (txt.includes('SEM NOTA')) r.situacao = 'Sem nota fiscal';
  else if (txt.includes('SEM PEDIDO')) r.situacao = 'Sem pedido';
  else if (!r.nf || r.nf === '*') r.situacao = 'NF não informada';
  else r.situacao = 'Com NF informada';
  return r;
}

function preTodas(){ return ((AdminD && AdminD.pre_alerta) || []).map(normPre); }
function preFiltradas(){
  const f = preFiltro;
  return preTodas().filter(r => hasArr(f.loja, r.loja) && hasArr(f.situacao, r.situacao) && hasArr(f.tipo, r.tipo) && hasArr(f.mes, r.mes) && hasArr(f.stCd, r.statusCd) && hasArr(f.stLoja, r.statusLoja));
}

function secPreAlerta(){
  const el = $('#s-prealerta');
  if (!el) return;
  if (!AdminD) { el.innerHTML = `<h2>Pré-Alerta (Sobra e Falta)</h2><p class="sub">Carregando dados do administrativo.json...</p>`; return; }

  const todas = preTodas();
  const hasTipo = todas.some(r => r.tipo);
  const rows = preFiltradas();
  const tot = rows.reduce((s,r) => s + r.valor, 0), unid = rows.reduce((s,r) => s + r.qtd, 0);
  const sobraVal = rows.filter(r => r.tipo === 'SOBRA').reduce((s,r) => s + r.valor, 0);
  const faltaVal = rows.filter(r => r.tipo === 'FALTA').reduce((s,r) => s + r.valor, 0);
  const semDoc = rows.filter(r => r.situacao === 'Sem nota fiscal' || r.situacao === 'Sem pedido');
  const semDocVal = semDoc.reduce((s,r) => s + r.valor, 0);
  const pend = rows.filter(r => (r.statusCd && r.statusCd !== 'FINALIZADO') || (r.statusLoja && r.statusLoja !== 'FINALIZADO'));
  const pendVal = pend.reduce((s,r) => s + r.valor, 0);
  const lojasSet = new Set(rows.map(r => r.loja));

  const agrup = (keyFn) => {
    const m = {};
    rows.forEach(r => { const k = keyFn(r); const o = (m[k] = m[k] || {n:0, qtd:0, valor:0, lojas:new Set()}); o.n++; o.qtd += r.qtd; o.valor += r.valor; o.lojas.add(r.loja); });
    return Object.entries(m);
  };
  const porLoja = agrup(r => r.loja).sort((a,b) => b[1].valor - a[1].valor);
  const porSit = agrup(r => r.situacao).sort((a,b) => b[1].valor - a[1].valor);
  const porMes = agrup(r => r.mes).sort((a,b) => mesOrdem(a[0]).localeCompare(mesOrdem(b[0])));
  const porSt = agrup(r => r.statusCd || 'SEM STATUS').sort((a,b) => b[1].valor - a[1].valor);
  const SIT_COR = {'Sem nota fiscal':'var(--crit)', 'Sem pedido':'var(--warn)', 'NF não informada':'var(--mute)', 'Com NF informada':'var(--ok)'};
  const stCor = k => k === 'FINALIZADO' ? 'var(--ok)' : (k === 'SEM STATUS' ? 'var(--mute)' : 'var(--warn)');

let RecebD = null;
let searchRecNotas = '';
let searchRecVerba = '';
let searchSemVerba = '';
let recFiltro = {mes:[], loja:[], tipoCarga:[], statusNota:[], tipoOp:[], fornecedor:[], pagaVerba:'todos'};

let verbaLimite = 150;
let semVerbaOrdem = 'valor';
let semVerbaLimite = 150;

async function loadRecebimentoData(){
  try {
    const timestamp = new Date().getTime();
    const res = await fetch(`${CONFIG.RECEBIMENTO_URL}?v=${timestamp}`);
    if (res.ok) RecebD = await res.json();
  } catch(e) {
    console.error("Erro ao carregar recebimento.json:", e);
  }
}

function recNotasTodas(){
  const raw = (RecebD && (RecebD.notas_recebimento || RecebD.notas || RecebD.data)) || [];
  return raw.map(n => {
    const dtRec = String(n.dataRecebimento || n['Data de Recebimento/Saída'] || n.dataEmissao || n['Data de Emissão'] || '').trim();
    const dtEmi = String(n.dataEmissao || n['Data de Emissão'] || '').trim();
    const mesRef = nfMes(dtRec || dtEmi);
    const lojaRaw = String(n.loja || n.Loja || '').trim();
    const lojaClean = lojaRaw.replace(/\.0$/, '');
    const lojaNome = lojaClean === '205' ? 'CD 205 - ROLDÃO' : (/^\d+$/.test(lojaClean) ? getNomeLoja(lojaClean) : (lojaClean || 'Sem Loja'));
    const valNf = parseNum(n.valorNf != null ? n.valorNf : n['Valor NF']);
    const valRec = parseNum(n.valorRecebido != null ? n.valorRecebido : n['Valor Recebido']) || valNf;
    let vPct = parseNum(n.verbaPct != null ? n.verbaPct : n['Verba logistica']);
    const vVal = n.verbaValor != null ? parseNum(n.verbaValor) : (valRec * (vPct / 100));
    const temVerba = (vVal > 0.005 || vPct > 0);
    return {
      dataEmissao: dtEmi, dataRecebimento: dtRec, mes: mesRef, loja: lojaNome,
      tipoNota: String(n.tipoNota || n['Tipo de Nota Fiscal'] || '').trim(),
      tipoOperacao: String(n.tipoOperacao || n['Tipo de Operação'] || '').trim() || 'Não informado',
      cfop: String(n.cfop || n.CFOP || '').trim(),
      fornecedor: String(n.fornecedor || n['Fornecedor/Loja'] || n['Emitente/Destinatário'] || 'NÃO INFORMADO').trim(),
      cnpj: String(n.cnpj || n.CNPJ || '').trim(),
      nf: String(n.nf || n.NF || '').replace(/\.0$/, '').trim(),
      serie: String(n.serie || n['Série'] || '').replace(/\.0$/, '').trim(),
      statusNfe: String(n.statusNfe || n['Status NF-e'] || '').trim(),
      statusNota: String(n.statusNota || n['Status da Nota Fiscal'] || '').trim() || 'Não informado',
      valorNf: valNf, valorLiquido: parseNum(n.valorLiquido != null ? n.valorLiquido : n['Valor Liquido']),
      valorCompra: parseNum(n.valorCompra != null ? n.valorCompra : n['Valor NF Compra']),
      valorBonificada: parseNum(n.valorBonificada != null ? n.valorBonificada : n['Valor NF Bonificada']),
      usuario: String(n.usuario || n['Usuário'] || '').trim(),
      usuarioConfirmacao: String(n.usuarioConfirmacao || n['Usuário Confirmação'] || '').trim(),
      tipoCarga: String(n.tipoCarga || n['Tipo de Carga'] || 'FORNECEDOR').trim().toUpperCase(),
      valorRecebido: valRec, verbaPct: vPct, verbaValor: vVal, temVerba: temVerba,
      qtdFaturado: parseNum(n.qtdFaturado != null ? n.qtdFaturado : n['Qtd Faturado'])
    };
  });
}

function recNotasFiltradas(){
  return recNotasTodas().filter(n => {
    if (recFiltro.mes.length > 0 && !hasArr(recFiltro.mes, n.mes)) return false;
    if (recFiltro.loja.length > 0 && !hasArr(recFiltro.loja, n.loja)) return false;
    if (recFiltro.tipoCarga.length > 0 && !hasArr(recFiltro.tipoCarga, n.tipoCarga)) return false;
    if (recFiltro.statusNota.length > 0 && !hasArr(recFiltro.statusNota, n.statusNota)) return false;
    if (recFiltro.tipoOp.length > 0 && !hasArr(recFiltro.tipoOp, n.tipoOperacao)) return false;
    if (recFiltro.fornecedor.length > 0 && !hasArr(recFiltro.fornecedor, n.fornecedor)) return false;
    if (recFiltro.pagaVerba === 'sim' && !n.temVerba) return false;
    if (recFiltro.pagaVerba === 'nao' && n.temVerba) return false;
    return true;
  });
}

function recAtualizadoTxt(){
  const t = RecebD && RecebD.ultimaAtualizacao;
  if (!t) return '';
  const d = new Date(t);
  return isNaN(d) ? '' : ` Base atualizada em ${d.toLocaleString('pt-BR', {day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit'})}.`;
}

/* ================= SETOR SEPARAÇÃO (FRACIONADO + FULL) ================= */
let SepD = null;
let sepFiltro = {
  mes: [],
  dia: [],
  fluxo: 'todos', // 'todos' | 'Fracionado' | 'Full'
  turno: [],
  operador: []
};
let sepOrdemOp = 'caixas';
let sepSearchOp = '';
let sepLimiteOp = 150;

// Controles da aba dedicada Hora a Hora
let hhDiaModo = 'atual';   // 'atual' | 'anterior'
let hhFluxoModo = 'todos'; // 'todos' | 'Fracionado' | 'Full'

function normDataSep(raw) {
  if (!raw) return '';
  let s = String(raw).trim();
  if (s.includes('T')) s = s.split('T')[0];
  if (s.includes(' ')) s = s.split(' ')[0];
  if (/^\d{4}-\d{2}-\d{2}$/.test(s)) {
    const [y, m, d] = s.split('-');
    return `${d}/${m}/${y}`;
  }
  if (/^\d{2}\/\d{2}\/\d{4}$/.test(s)) return s;
  return s;
}

function extrairHoraSep(obj) {
  const candidates = [
    obj.hora, obj.Hora, obj.HORA,
    obj.dataHora, obj['Data/Hora'], obj['Data Hora'], obj['Hora Separação'],
    obj['Hora Separacao'], obj['Data Separação'], obj['Data Separacao'],
    obj.fim, obj.Fim, obj.inicio, obj.Inicio, obj.timestamp
  ];
  for (let c of candidates) {
    if (c === undefined || c === null || c === '') continue;
    const str = String(c).trim();
    if (/^\d{1,2}$/.test(str)) {
      const h = parseInt(str, 10);
      if (h >= 0 && h <= 23) return h;
    }
    const m = /(?:^|\s|T)(\d{1,2}):\d{2}/.exec(str);
    if (m) {
      const h = parseInt(m[1], 10);
      if (h >= 0 && h <= 23) return h;
    }
  }
  return null;
}

function getTurnoPorHora(h) {
  if (h === null || h === undefined || isNaN(h)) return 'Não Inf.';
  if (h >= 6 && h <= 13) return '1º Turno';
  if (h >= 14 && h <= 21) return '2º Turno';
  return '3º Turno';
}

function normTurnoSep(rawTurno, hora) {
  const t = String(rawTurno || '').trim().toUpperCase();
  if (t.includes('1') || t.includes('MANH') || t.includes('T1')) return '1º Turno';
  if (t.includes('2') || t.includes('TARD') || t.includes('T2')) return '2º Turno';
  if (t.includes('3') || t.includes('NOIT') || t.includes('MADR') || t.includes('T3')) return '3º Turno';
  return getTurnoPorHora(hora);
}

// Regra de negócio: Unifica Picking e Cross Docking/Blocado em "Fracionado", mantendo "Full" para Pulmão/Full
function mapFluxoSep(rawTipo) {
  const t = String(rawTipo || '').toLowerCase();
  if (t.includes('pulm') || t.includes('full')) return 'Full';
  return 'Fracionado';
}

function parseRowsSeparacao(list, tipoOrigem) {
  if (!Array.isArray(list)) return [];
  const fluxoPadrao = mapFluxoSep(tipoOrigem);
  return list.map(o => {
    const dt = normDataSep(getProp(o, [
      'Data', 'data', 'Data Separação', 'Data Separacao', 'Data/Hora', 'Data Hora',
      'Dt. Separação', 'Dt Separacao', 'Data Movimentação', 'Data Movimentacao', 'Emissão', 'Emissao'
    ]));
    const mes = dt ? nfMes(dt) : 'Sem data';
    const hora = extrairHoraSep(o);
    const turno = normTurnoSep(getProp(o, ['Turno', 'turno', 'TURNO', 'Período', 'Periodo']), hora);
    const operador = getProp(o, [
      'Operador', 'operador', 'OPERADOR', 'Usuário', 'Usuario', 'USUARIO',
      'Separador', 'separador', 'Colaborador', 'colaborador', 'Nome'
    ]) || 'NÃO INFORMADO';
    const caixas = parseNum(getProp(o, [
      'Caixas', 'caixas', 'CAIXAS', 'Qtd Caixas', 'Qtd. Caixas', 'Qtd Separada',
      'Qtd. Separada', 'Quantidade', 'Qtd', 'QTD', 'Volumes', 'VOLUMES', 'Unidades'
    ]));
    const linhas = parseNum(getProp(o, [
      'Linhas', 'linhas', 'LINHAS', 'Itens', 'Qtd Linhas', 'Tarefas', 'Paletes', 'Palete', 'Qtd Paletes'
    ])) || 1;
    const peso = parseNum(getProp(o, ['Peso', 'peso', 'PESO', 'Peso Bruto', 'Peso Total', 'Kg']));
    const rawTipo = getProp(o, ['Tipo', 'Tipo Separação', 'Tipo Separacao', 'Modalidade', 'Fluxo']) || tipoOrigem;
    const fluxo = mapFluxoSep(rawTipo || fluxoPadrao);

    return {
      data: dt || 'Sem data',
      mes,
      hora,
      turno,
      operador: operador.toUpperCase(),
      fluxo, // 'Fracionado' ou 'Full'
      caixas,
      linhas,
      peso
    };
  }).filter(r => r.caixas > 0 || r.linhas > 0);
}

async function loadSeparacaoData() {
  const ts = new Date().getTime();
  const opts = { cache: 'no-store' };
  const safeFetch = async (url) => {
    try {
      const r = await fetch(`${url}?v=${ts}`, opts);
      return r.ok ? await r.json() : null;
    } catch (e) {
      return null;
    }
  };

  const [jMan, jPick, jPulm, jBloc] = await Promise.all([
    safeFetch(CONFIG.SEP_MANIFESTO_URL),
    safeFetch(CONFIG.SEP_PICKING_URL),
    safeFetch(CONFIG.SEP_PULMAO_URL),
    safeFetch(CONFIG.SEP_BLOCADO_URL)
  ]);

  let registros = [];
  let atualizacao = '';

  if (jPick) {
    registros.push(...parseRowsSeparacao(extractList(jPick), 'Fracionado'));
    if (jPick.ultimaAtualizacao) atualizacao = jPick.ultimaAtualizacao;
  }
  if (jPulm) {
    registros.push(...parseRowsSeparacao(extractList(jPulm), 'Full'));
    if (!atualizacao && jPulm.ultimaAtualizacao) atualizacao = jPulm.ultimaAtualizacao;
  }
  if (jBloc) {
    // Blocado / Cross Docking agora entra unificado no fluxo Fracionado
    registros.push(...parseRowsSeparacao(extractList(jBloc), 'Fracionado'));
    if (!atualizacao && jBloc.ultimaAtualizacao) atualizacao = jBloc.ultimaAtualizacao;
  }

  if (!registros.length && jMan) {
    const listaMan = extractList(jMan);
    if (listaMan.length && (listaMan[0].operador || listaMan[0].Operador || listaMan[0].caixas || listaMan[0].Caixas || listaMan[0].qtdSeparada)) {
      registros.push(...parseRowsSeparacao(listaMan, 'Fracionado'));
    } else if (Array.isArray(jMan.arquivos)) {
      const extraidos = await Promise.all(jMan.arquivos.map(async arq => {
        const path = arq.startsWith('.') || arq.startsWith('/') ? arq : `./dados/${arq}`;
        const jItem = await safeFetch(path);
        const tipoInfer = arq.toLowerCase().includes('pulm') || arq.toLowerCase().includes('full') ? 'Full' : 'Fracionado';
        return jItem ? parseRowsSeparacao(extractList(jItem), tipoInfer) : [];
      }));
      extraidos.forEach(arr => registros.push(...arr));
    }
    if (!atualizacao && jMan.ultimaAtualizacao) atualizacao = jMan.ultimaAtualizacao;
  }

  SepD = {
    registros,
    ultimaAtualizacao: atualizacao
  };
}

function sepRegistrosTodos() {
  return (SepD && SepD.registros) || [];
}

function sepRegistrosFiltrados(ignorarDia = false) {
  return sepRegistrosTodos().filter(r => {
    if (sepFiltro.mes.length > 0 && !hasArr(sepFiltro.mes, r.mes)) return false;
    if (!ignorarDia && sepFiltro.dia.length > 0 && !hasArr(sepFiltro.dia, r.data)) return false;
    if (sepFiltro.fluxo !== 'todos' && r.fluxo !== sepFiltro.fluxo) return false;
    if (sepFiltro.turno.length > 0 && !hasArr(sepFiltro.turno, r.turno)) return false;
    if (sepFiltro.operador.length > 0 && !hasArr(sepFiltro.operador, r.operador)) return false;
    return true;
  });
}

function sepAtualizadoTxt() {
  const t = SepD && SepD.ultimaAtualizacao;
  if (!t) return '';
  const d = new Date(t);
  return isNaN(d) ? '' : ` Base atualizada em ${d.toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' })}.`;
}

function sortDataBR(a, b) {
  const pa = String(a).split('/').reverse().join('');
  const pb = String(b).split('/').reverse().join('');
  return pa.localeCompare(pb);
}

/* TELA INICIAL DA SEPARAÇÃO: VISÃO GERAL EXECUTIVA (SEM METAS, FRACIONADO + FULL) */
function secSepGeral() {
  const el = $('#s-sepgeral');
  if (!el) return;

    el.innerHTML = `<h2>Separação · Produtividade & Visão Geral</h2><p class="sub">Carregando dados de separação...</p>`;

  }

    el.innerHTML = `
      <h2>Separação · Produtividade & Visão Geral</h2>

      <div class="alert-banner">

        <div class="alert-banner-content">
          <h4>Aguardando Carga de Separação</h4>
          <p>Assim que os arquivos JSON de separação forem atualizados na pasta do painel, os indicadores de <b>Fracionado</b> e <b>Full</b> aparecerão automaticamente.</p>
        </div>
      </div>`;
    return;
  }

  const rows = sepRegistrosFiltrados();
  const totCaixas = rows.reduce((s, r) => s + r.caixas, 0);
  const totLinhas = rows.reduce((s, r) => s + r.linhas, 0);
  const totFrac = rows.filter(r => r.fluxo === 'Fracionado').reduce((s, r) => s + r.caixas, 0);
  const totFull = rows.filter(r => r.fluxo === 'Full').reduce((s, r) => s + r.caixas, 0);

  const diasSet = new Set(rows.map(r => r.data).filter(d => d && d !== 'Sem data'));
  const qtdDias = diasSet.size || 1;
  const mediaDia = totCaixas / qtdDias;

  const horasAtivasSet = new Set(rows.filter(r => r.hora !== null && r.data !== 'Sem data').map(r => `${r.data}_${r.hora}`));
  const prodMediaHora = horasAtivasSet.size ? (totCaixas / horasAtivasSet.size) : (totCaixas / (qtdDias * 8));

  const pctFrac = totCaixas ? (totFrac / totCaixas) * 100 : 0;
  const pctFull = totCaixas ? (totFull / totCaixas) * 100 : 0;

  // Agrupamento Dia a Dia para Tabela Executiva e Gráfico com Média Móvel (ignorando filtro de dia específico no gráfico para ver curva completa do mês/período)
  const rowsPeriodo = sepRegistrosFiltrados(true);
  const porDiaMap = {};
  rowsPeriodo.forEach(r => {
    const k = r.data || 'Sem data';
    if (k === 'Sem data') return;
    if (!porDiaMap[k]) {
      porDiaMap[k] = {
        data: k,
        t1: 0,
        t2: 0,
        t3: 0,
        frac: 0,
        full: 0,
        total: 0,
        linhas: 0,
        ops: new Set()
      };
    }
    const d = porDiaMap[k];
    if (r.turno === '1º Turno') d.t1 += r.caixas;
    else if (r.turno === '2º Turno') d.t2 += r.caixas;
    else d.t3 += r.caixas;

    if (r.fluxo === 'Fracionado') d.frac += r.caixas;
    else d.full += r.caixas;

    d.total += r.caixas;
    d.linhas += r.linhas;
    d.ops.add(r.operador);
  });

  const diasOrdenados = Object.values(porDiaMap).sort((a, b) => sortDataBR(a.data, b.data));
  // Cálculo da Média Móvel (janela de 3 dias) para a curva sobreposta no gráfico
  const diasComMediaMovel = diasOrdenados.map((d, idx) => {
    const slice = diasOrdenados.slice(Math.max(0, idx - 2), idx + 1);
    const mm = slice.reduce((s, x) => s + x.total, 0) / (slice.length || 1);
    return { ...d, mediaMovel: mm };
  });

  const maxDiaTotal = diasComMediaMovel.length ? Math.max(...diasComMediaMovel.map(d => Math.max(d.total, d.mediaMovel))) * 1.18 : 1;

  // SVG da curva de média móvel

    const n = diasComMediaMovel.length;
    const pts = diasComMediaMovel.map((d, idx) => {
      const xPct = ((idx + 0.5) / n) * 100;
      const yPct = 100 - ((d.mediaMovel / maxDiaTotal) * 100);
      return { x: xPct, y: Math.max(4, Math.min(96, yPct)), val: d.mediaMovel, dt: d.data };
    });
    const pathD = pts.map((p, i) => `${i === 0 ? 'M' : 'L'} ${p.x.toFixed(2)} ${p.y.toFixed(2)}`).join(' ');
    const circles = pts.map(p => `<circle cx="${p.x.toFixed(2)}" cy="${p.y.toFixed(2)}" r="1.4" fill="#ffc400" stroke="#0b192c" stroke-width="0.45" />`).join('');
    trendSvg = `
      <svg class="sep-trend-svg" viewBox="0 0 100 100" preserveAspectRatio="none">
        <path d="${pathD}" fill="none" stroke="#ffc400" stroke-width="0.9" stroke-linecap="round" stroke-linejoin="round" />
        ${circles}
      </svg>`;
  }

  // Ranking Top 8 Operadores
  const porOpMap = {};
  rows.forEach(r => {
    const k = r.operador;
    porOpMap[k] = porOpMap[k] || { op: k, frac: 0, full: 0, caixas: 0, linhas: 0 };
    if (r.fluxo === 'Fracionado') porOpMap[k].frac += r.caixas;
    else porOpMap[k].full += r.caixas;
    porOpMap[k].caixas += r.caixas;
    porOpMap[k].linhas += r.linhas;

  const topOps = Object.values(porOpMap).sort((a, b) => b.caixas - a.caixas).slice(0, 8);

                <div class="dept-hbar-name">${idx + 1}. ${esc(op.op)}</div>
                <div class="dept-hbar-track"><div class="dept-hbar-fill" style="width:${Math.max(wPct, 3)}%;background:${isSel ? 'var(--accent)' : (idx < 3 ? 'var(--ok)' : 'var(--blue)')}"></div></div>
                <div class="dept-hbar-val">
                  <span style="color:var(--text-strong)">${fmtN.format(op.caixas)}</span>
                  <span style="color:var(--mute);font-size:12px;margin-left:5px">(Frac: ${fmtN.format(op.frac)} | Full: ${fmtN.format(op.full)})</span>
                </div>
              </div>`;
          }).join('')}
        </div>
      </div>
    </div>`;

  document.querySelectorAll('[data-sep-fluxo]').forEach(btn => btn.addEventListener('click', () => {
    sepFiltro.fluxo = btn.getAttribute('data-sep-fluxo');
    render();
  }));
  document.querySelectorAll('[data-sep-dia]').forEach(el => el.addEventListener('click', () => {
    toggleArr(sepFiltro.dia, el.getAttribute('data-sep-dia'));
    render();
  }));
  document.querySelectorAll('[data-sep-op]').forEach(el => el.addEventListener('click', () => {
    toggleArr(sepFiltro.operador, el.getAttribute('data-sep-op'));
    render();
  }));
  attachTooltipEvents();
}

/* NOVA PÁGINA EXCLUSIVA: PRODUÇÃO HORA A HORA (DIA ATUAL E DIA ANTERIOR · FRACIONADO E FULL) */
function secSepHoraHora() {
  const el = $('#s-sephorahora');
  if (!el) return;
  if (!SepD) {
    el.innerHTML = `<h2>Produção Hora a Hora</h2><p class="sub">Carregando acompanhamento horário...</p>`;
    return;
  }

  const todos = sepRegistrosTodos();
  if (!todos.length) {
    el.innerHTML = `<h2>Produção Hora a Hora</h2><p class="sub">Nenhum registro horário disponível na base atual.</p>`;
    return;
  }

  // Identifica as datas ordenadas para determinar Dia Atual (mais recente) e Dia Anterior
  const datasUnicas = Array.from(new Set(todos.map(r => r.data).filter(d => d && d !== 'Sem data'))).sort(sortDataBR);
  const dataAtual = datasUnicas.length ? datasUnicas[datasUnicas.length - 1] : '';
  const dataAnterior = datasUnicas.length >= 2 ? datasUnicas[datasUnicas.length - 2] : '';

  const dataAlvo = hhDiaModo === 'anterior' ? (dataAnterior || dataAtual) : dataAtual;
  const dataComparacao = hhDiaModo === 'anterior' ? '' : dataAnterior;

  // Filtra registros respeitando turno/operador da barra global, mas fixando no dia selecionado (Atual ou Anterior)
  const baseFiltroGeral = todos.filter(r => {
    if (sepFiltro.turno.length > 0 && !hasArr(sepFiltro.turno, r.turno)) return false;
    if (sepFiltro.operador.length > 0 && !hasArr(sepFiltro.operador, r.operador)) return false;
    return true;
  });

  const rowsDia = baseFiltroGeral.filter(r => r.data === dataAlvo);
  const rowsComp = dataComparacao ? baseFiltroGeral.filter(r => r.data === dataComparacao) : [];

  // Filtra por modalidade escolhida na página (Todos, Fracionado, Full) para o gráfico principal
  const rowsGrafico = hhFluxoModo === 'todos' ? rowsDia : rowsDia.filter(r => r.fluxo === hhFluxoModo);
  const rowsCompGrafico = hhFluxoModo === 'todos' ? rowsComp : rowsComp.filter(r => r.fluxo === hhFluxoModo);

  // Totais do Dia Selecionado separados por Fracionado e Full
  const totDiaGeral = rowsDia.reduce((s, r) => s + r.caixas, 0);
  const totDiaFrac = rowsDia.filter(r => r.fluxo === 'Fracionado').reduce((s, r) => s + r.caixas, 0);
  const totDiaFull = rowsDia.filter(r => r.fluxo === 'Full').reduce((s, r) => s + r.caixas, 0);

  const totCompGeral = rowsComp.reduce((s, r) => s + r.caixas, 0);
  const diffVsAnterior = (dataComparacao && totCompGeral > 0) ? ((totDiaGeral - totCompGeral) / totCompGeral) * 100 : null;

  // Monta grade de 24 horas (00h a 23h) ou faixas com movimento
  const gradeHoras = Array.from({ length: 24 }, (_, h) => ({
    hora: h,
    label: `${String(h).padStart(2, '0')}h`,
    turno: getTurnoPorHora(h),
    frac: 0,
    full: 0,
    total: 0,
    compTotal: 0,
    opsSet: new Set()
  }));

  rowsDia.forEach(r => {
    if (r.hora !== null && r.hora >= 0 && r.hora <= 23) {
      const slot = gradeHoras[r.hora];
      if (r.fluxo === 'Fracionado') slot.frac += r.caixas;
      else slot.full += r.caixas;
      slot.total += r.caixas;
      slot.opsSet.add(r.operador);
    }
  });

  rowsCompGrafico.forEach(r => {
    if (r.hora !== null && r.hora >= 0 && r.hora <= 23) {
      gradeHoras[r.hora].compTotal += r.caixas;
    }
  });

  // Exibe das 05h às 23h por padrão, ou todas as horas que tiverem volume
  const horasVisiveis = gradeHoras.filter(g => (g.hora >= 5 && g.hora <= 23) || g.total > 0 || g.compTotal > 0);
  const horasComProd = horasVisiveis.filter(g => (hhFluxoModo === 'Fracionado' ? g.frac : (hhFluxoModo === 'Full' ? g.full : g.total)) > 0);

  const picoHora = horasVisiveis.slice().sort((a, b) => {
    const va = hhFluxoModo === 'Fracionado' ? a.frac : (hhFluxoModo === 'Full' ? a.full : a.total);
    const vb = hhFluxoModo === 'Fracionado' ? b.frac : (hhFluxoModo === 'Full' ? b.full : b.total);
    return vb - va;
  })[0];

  const valPico = picoHora ? (hhFluxoModo === 'Fracionado' ? picoHora.frac : (hhFluxoModo === 'Full' ? picoHora.full : picoHora.total)) : 0;
  const maxHoraVal = Math.max(1, ...horasVisiveis.map(g => {
    const v = hhFluxoModo === 'Fracionado' ? g.frac : (hhFluxoModo === 'Full' ? g.full : g.total);
    return Math.max(v, g.compTotal);
  })) * 1.22;

  const tituloDiaBadge = hhDiaModo === 'anterior' ? `DIA ANTERIOR (${dataAlvo || '-'})` : `DIA ATUAL (${dataAlvo || '-'})`;

  el.innerHTML = `
    <h2>Produção Hora a Hora · Fracionado & Full</h2>
    <p class="sub">Acompanhamento horário detalhado do <b>Dia Atual</b> e <b>Dia Anterior</b> separado entre <b>Separação Fracionado</b> e <b>Separação Full</b>.${esc(sepAtualizadoTxt())}</p>

    <div class="hh-tabs-bar">
      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
        <span style="font-size:13px;font-weight:800;color:var(--accent-text);text-transform:uppercase">${ICONS.calendar} Período:</span>
        <div class="hh-pill-group">
          <button class="hh-pill-btn ${hhDiaModo === 'atual' ? 'active' : ''}" data-hh-dia="atual">
            Dia Atual ${dataAtual ? `(${esc(dataAtual)})` : ''}
          </button>
          <button class="hh-pill-btn ${hhDiaModo === 'anterior' ? 'active' : ''}" data-hh-dia="anterior" ${!dataAnterior ? 'disabled style="opacity:0.45;cursor:not-allowed"' : ''}>
            Dia Anterior ${dataAnterior ? `(${esc(dataAnterior)})` : '(Indisponível)'}
          </button>
        </div>
      </div>

      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
        <span style="font-size:13px;font-weight:800;color:var(--blue);text-transform:uppercase">${ICONS.layers} Modalidade:</span>
        <div class="hh-pill-group">
          <button class="hh-pill-btn ${hhFluxoModo === 'todos' ? 'active' : ''}" data-hh-fluxo="todos">Consolidado (Frac + Full)</button>
          <button class="hh-pill-btn ${hhFluxoModo === 'Fracionado' ? 'active' : ''}" data-hh-fluxo="Fracionado">Somente Fracionado</button>
          <button class="hh-pill-btn ${hhFluxoModo === 'Full' ? 'active' : ''}" data-hh-fluxo="Full">Somente Full</button>
        </div>
      </div>
    </div>

    <div class="sep-pill-grid">
      <div class="sep-pill-card accent-top">
        <div class="sep-pill-title">Total ${tituloDiaBadge}</div>
        <div class="sep-pill-val">${fmtN.format(totDiaGeral)}</div>
        <div class="sep-pill-sub">
          ${diffVsAnterior !== null
            ? `vs Dia Anterior (${fmtN.format(totCompGeral)}): <b style="color:${diffVsAnterior >= 0 ? 'var(--ok)' : 'var(--crit)'}">${diffVsAnterior >= 0 ? '+' : ''}${fmtP(diffVsAnterior, 1)}</b>`
            : `${horasComProd.length} horas com movimentação`}
        </div>
      </div>
      <div class="sep-pill-card blue-top">
        <div class="sep-pill-title">Separação Fracionado</div>
        <div class="sep-pill-val" style="color:var(--blue)">${fmtN.format(totDiaFrac)}</div>
        <div class="sep-pill-sub">${fmtP(totDiaGeral ? (totDiaFrac / totDiaGeral) * 100 : 0, 1)} do dia</div>
      </div>
      <div class="sep-pill-card purple-top">
        <div class="sep-pill-title">Separação Full</div>
        <div class="sep-pill-val" style="color:#c084fc">${fmtN.format(totDiaFull)}</div>
        <div class="sep-pill-sub">${fmtP(totDiaGeral ? (totDiaFull / totDiaGeral) * 100 : 0, 1)} do dia</div>
      </div>
      <div class="sep-pill-card">
        <div class="sep-pill-title">Hora Pico (${hhFluxoModo === 'todos' ? 'Geral' : hhFluxoModo})</div>
        <div class="sep-pill-val" style="color:var(--ok)">${valPico > 0 ? picoHora.label : '--'}</div>
        <div class="sep-pill-sub">${valPico > 0 ? `${fmtN.format(valPico)} caixas separadas` : 'Sem registros horários'}</div>
      </div>
    </div>

    <div class="card">
      <div class="card-header-action">
        <h3>${ICONS.clock} CURVA HORÁRIA DE SEPARAÇÃO · ${esc(tituloDiaBadge)} · ${hhFluxoModo === 'todos' ? 'CONSOLIDADO (FRACIONADO + FULL)' : esc(hhFluxoModo.toUpperCase())}</h3>
        <div style="display:flex;gap:14px;font-size:13px;font-weight:700;flex-wrap:wrap">
          ${hhFluxoModo === 'todos' ? `
            <span style="color:var(--blue)">■ Fracionado</span>
            <span style="color:#c084fc">■ Full</span>
          ` : `<span style="color:${hhFluxoModo === 'Fracionado' ? 'var(--blue)' : '#c084fc'}">■ ${esc(hhFluxoModo)}</span>`}
          ${dataComparacao ? `<span style="color:var(--mute)">| Linha tracejada = Dia Anterior (${esc(dataComparacao)})</span>` : ''}
        </div>
      </div>

      <div class="bar-chart-container" style="height:320px;padding-top:58px">
        <div class="bar-chart-wrapper">
          ${horasVisiveis.map(g => {
            const valAtual = hhFluxoModo === 'Fracionado' ? g.frac : (hhFluxoModo === 'Full' ? g.full : g.total);
            const hTotalPct = (valAtual / maxHoraVal) * 100;
            const hCompPct = (g.compTotal / maxHoraVal) * 100;

            const fracShare = valAtual > 0 ? (g.frac / valAtual) * 100 : 0;
            const fullShare = valAtual > 0 ? (g.full / valAtual) * 100 : 0;

            let barInnerHtml = '';
            if (hhFluxoModo === 'todos' && valAtual > 0) {
              barInnerHtml = `
                <div style="width:100%;height:${fullShare}%;background:linear-gradient(180deg, #c084fc 0%, #7e22ce 100%);border-radius:5px 5px 0 0;"></div>
                <div style="width:100%;height:${fracShare}%;background:linear-gradient(180deg, #4da3ff 0%, #1d4ed8 100%);border-radius:${fullShare > 0 ? '0' : '5px 5px 0 0'};"></div>
              `;
            }

            const barStyleBg = hhFluxoModo === 'Full'
              ? 'background:linear-gradient(180deg, #c084fc 0%, #7e22ce 100%);border-color:rgba(192,132,252,0.5)'
              : (hhFluxoModo === 'Fracionado'
                ? 'background:linear-gradient(180deg, #4da3ff 0%, #1d4ed8 100%);border-color:rgba(77,163,255,0.5)'
                : 'background:transparent;border-color:rgba(255,255,255,0.2);display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden');

            const ttItems = [
              { prod: `Fracionado: ${fmtN.format(g.frac)} cx`, sub: `Full: ${fmtN.format(g.full)} cx | Total: ${fmtN.format(g.total)} cx` },
              { prod: `Operadores Ativos: ${g.opsSet.size}`, sub: dataComparacao ? `Dia Anterior (${dataComparacao}): ${fmtN.format(g.compTotal)} cx` : `Turno: ${g.turno}` }
            ];

            return `
              <div class="bar-chart-col" style="min-width:44px">
                ${dataComparacao && g.compTotal > 0 ? `<div style="position:absolute;bottom:${Math.max(hCompPct, 2)}%;width:82%;border-top:2px dashed rgba(255,196,0,0.75);z-index:4;pointer-events:none" title="Dia Anterior: ${fmtN.format(g.compTotal)} cx"></div>` : ''}
                <div class="bar-chart-bar" style="height:${valAtual > 0 ? Math.max(hTotalPct, 5) : 2}%;${valAtual === 0 ? 'opacity:0.25;' : ''}${barStyleBg}"
                     data-tooltip-title="Faixa ${g.label} (${g.turno})"
                     data-tooltip-color="var(--accent)"
                     data-tooltip-items="${JSON.stringify(ttItems).replace(/"/g, '&quot;')}">
                  ${barInnerHtml}
                  ${valAtual > 0 ? `<div class="bar-val-label" style="top:-26px;font-size:13px"><span>${fmtN.format(valAtual)}</span></div>` : ''}
                </div>
                <div class="bar-date-label">${g.label}</div>
              </div>`;
          }).join('')}
        </div>
      </div>
    </div>

    <div class="grid two-even" style="margin-top:20px">
      <div class="card">
        <h3>${ICONS.layers} Matriz Horária Detalhada · Fracionado vs Full (${esc(dataAlvo)})</h3>
        <div class="tw" style="max-height:430px;overflow-y:auto">
          <table class="sep-bi-table">
            <thead>
              <tr>
                <th>Hora</th>
                <th>Turno</th>
                <th class="r">Fracionado (Cx)</th>
                <th class="r">Full (Cx)</th>
                <th class="r">Total Hora</th>
                <th class="r">Acumulado Dia</th>
                <th class="r">Operadores</th>
              </tr>
            </thead>
            <tbody>
              ${(() => {
                let acum = 0;
                return horasVisiveis.map(g => {
                  acum += g.total;
                  return `<tr>
                    <td><b>${g.label}</b></td>
                    <td style="font-size:13px;color:var(--mute)">${esc(g.turno)}</td>
                    <td class="r col-hl-blue">${fmtN.format(g.frac)}</td>
                    <td class="r col-hl-purple">${fmtN.format(g.full)}</td>
                    <td class="r" style="font-weight:800">${fmtN.format(g.total)}</td>
                    <td class="r" style="color:var(--accent-text);font-weight:700">${fmtN.format(acum)}</td>
                    <td class="r">${fmtN.format(g.opsSet.size)}</td>
                  </tr>`;
                }).join('');
              })()}
              <tr class="tot">
                <td colspan="2"><b>Total ${esc(dataAlvo)}</b></td>
                <td class="r" style="color:var(--blue)">${fmtN.format(totDiaFrac)}</td>
                <td class="r" style="color:#c084fc">${fmtN.format(totDiaFull)}</td>
                <td class="r" style="color:var(--accent-text)">${fmtN.format(totDiaGeral)}</td>
                <td class="r">—</td>
                <td class="r">${fmtN.format(new Set(rowsDia.map(r => r.operador)).size)}</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>

      <div class="card">
        <h3>${ICONS.clock} Comparativo Direto: Dia Atual vs Dia Anterior por Faixa Horária</h3>
        ${dataAtual && dataAnterior ? `
          <div class="tw" style="max-height:430px;overflow-y:auto">
            <table class="sep-bi-table">
              <thead>
                <tr>
                  <th>Hora</th>
                  <th class="r">Atual Frac.</th>
                  <th class="r">Atual Full</th>
                  <th class="r">Total Atual (${esc(dataAtual.slice(0,5))})</th>
                  <th class="r">Total Anterior (${esc(dataAnterior.slice(0,5))})</th>
                  <th class="r">Variação</th>
                </tr>
              </thead>
              <tbody>
                ${horasVisiveis.map(g => {
                  const rAt = baseFiltroGeral.filter(r => r.data === dataAtual && r.hora === g.hora);
                  const rAn = baseFiltroGeral.filter(r => r.data === dataAnterior && r.hora === g.hora);
                  const atFrac = rAt.filter(r => r.fluxo === 'Fracionado').reduce((s, r) => s + r.caixas, 0);
                  const atFull = rAt.filter(r => r.fluxo === 'Full').reduce((s, r) => s + r.caixas, 0);
                  const atTot = atFrac + atFull;
                  const anTot = rAn.reduce((s, r) => s + r.caixas, 0);
                  const diff = atTot - anTot;
                  const diffColor = diff > 0 ? 'var(--ok)' : (diff < 0 ? 'var(--crit)' : 'var(--mute)');
                  return `<tr>
                    <td><b>${g.label}</b></td>
                    <td class="r col-hl-blue">${fmtN.format(atFrac)}</td>
                    <td class="r col-hl-purple">${fmtN.format(atFull)}</td>
                    <td class="r" style="font-weight:800">${fmtN.format(atTot)}</td>
                    <td class="r" style="color:var(--mute)">${fmtN.format(anTot)}</td>
                    <td class="r" style="color:${diffColor};font-weight:800">${diff > 0 ? '+' : ''}${fmtN.format(diff)}</td>
                  </tr>`;
                }).join('')}
              </tbody>
            </table>
          </div>` : '<p style="color:var(--mute);padding:16px">É necessário ter pelo menos dois dias na base de separação para exibir o comparativo entre Dia Atual e Dia Anterior.</p>'}
      </div>
    </div>`;

  document.querySelectorAll('[data-hh-dia]').forEach(btn => btn.addEventListener('click', () => {
    if (btn.disabled) return;
    hhDiaModo = btn.getAttribute('data-hh-dia');
    secSepHoraHora();
  }));
  document.querySelectorAll('[data-hh-fluxo]').forEach(btn => btn.addEventListener('click', () => {
    hhFluxoModo = btn.getAttribute('data-hh-fluxo');
    secSepHoraHora();
  }));
  attachTooltipEvents();
}

/* ABA PRODUTIVIDADE POR OPERADOR (FRACIONADO & FULL) */
function secSepOperadores() {
  const el = $('#s-sepoperadores');
  if (!el) return;
  if (!SepD) {
    el.innerHTML = `<h2>Produtividade por Operador</h2><p class="sub">Carregando dados...</p>`;
    return;
  }

  const rows = sepRegistrosFiltrados();
  const porOpMap = {};
  rows.forEach(r => {
    const k = r.operador;
    if (!porOpMap[k]) {
      porOpMap[k] = {
        operador: k,
        fracCx: 0,
        fullCx: 0,
        caixas: 0,
        linhas: 0,
        peso: 0,
        diasSet: new Set(),
        horasSet: new Set(),
        turnosSet: new Set()
      };
    }
    const o = porOpMap[k];
    if (r.fluxo === 'Fracionado') o.fracCx += r.caixas;
    else o.fullCx += r.caixas;
    o.caixas += r.caixas;
    o.linhas += r.linhas;
    o.peso += r.peso;
    if (r.data && r.data !== 'Sem data') o.diasSet.add(r.data);
    if (r.hora !== null && r.data !== 'Sem data') o.horasSet.add(`${r.data}_${r.hora}`);
    if (r.turno) o.turnosSet.add(r.turno);
  });

  let lista = Object.values(porOpMap).map(o => {
    const dias = o.diasSet.size || 1;
    const horas = o.horasSet.size || (dias * 8);
    return {
      ...o,
      dias,
      horas,
      cxHora: o.caixas / horas,
      cxDia: o.caixas / dias,
      turnosStr: Array.from(o.turnosSet).join(', ')
    };
  });

  const q = sepSearchOp.trim().toLowerCase();
  if (q) lista = lista.filter(o => o.operador.toLowerCase().includes(q) || o.turnosStr.toLowerCase().includes(q));

  const cmp = {
    caixas: (a, b) => b.caixas - a.caixas,
    frac: (a, b) => b.fracCx - a.fracCx,
    full: (a, b) => b.fullCx - a.fullCx,
    cxhora: (a, b) => b.cxHora - a.cxHora,
    linhas: (a, b) => b.linhas - a.linhas
  }[sepOrdemOp] || ((a, b) => b.caixas - a.caixas);

  lista.sort(cmp);
  const mostrados = lista.slice(0, sepLimiteOp);
  const restam = lista.length - mostrados.length;

  const totCx = lista.reduce((s, o) => s + o.caixas, 0);
  const totFrac = lista.reduce((s, o) => s + o.fracCx, 0);
  const totFull = lista.reduce((s, o) => s + o.fullCx, 0);
  const mediaOp = lista.length ? totCx / lista.length : 0;

  el.innerHTML = `
    <h2>Produtividade por Operador</h2>
    <p class="sub">Desempenho individual consolidado entre <b>Separação Fracionado</b> e <b>Separação Full</b>.${esc(sepAtualizadoTxt())}</p>

    <div class="sep-pill-grid">
      <div class="sep-pill-card accent-top">
        <div class="sep-pill-title">Operadores Ativos</div>
        <div class="sep-pill-val">${fmtN.format(lista.length)}</div>
        <div class="sep-pill-sub">colaboradores no filtro</div>
      </div>
      <div class="sep-pill-card blue-top">
        <div class="sep-pill-title">Volume Fracionado</div>
        <div class="sep-pill-val" style="color:var(--blue)">${fmtN.format(totFrac)}</div>
        <div class="sep-pill-sub">caixas separadas</div>
      </div>
      <div class="sep-pill-card purple-top">
        <div class="sep-pill-title">Volume Full</div>
        <div class="sep-pill-val" style="color:#c084fc">${fmtN.format(totFull)}</div>
        <div class="sep-pill-sub">caixas separadas</div>
      </div>
      <div class="sep-pill-card">
        <div class="sep-pill-title">Média por Operador</div>
        <div class="sep-pill-val" style="color:var(--ok)">${fmtN.format(Math.round(mediaOp))}</div>
        <div class="sep-pill-sub">caixas / operador</div>
      </div>
    </div>

    <div class="card">
      <div class="card-header-action">
        <h3>${ICONS.users} RANKING DE OPERADORES (${fmtN.format(lista.length)} COLABORADORES)</h3>
        <div class="prod-controls">
          <select id="selSepOrdemOp">

/* ABA ANALÍTICO MENSAL / ANUAL (FRACIONADO & FULL) */
function secSepAnual() {
  const el = $('#s-sepanual');
  if (!el) return;
  if (!SepD) {
    el.innerHTML = `<h2>Analítico Mensal · Separação</h2><p class="sub">Carregando histórico...</p>`;
    return;
  }

  const rows = sepRegistrosTodos().filter(r => {
    if (sepFiltro.fluxo !== 'todos' && r.fluxo !== sepFiltro.fluxo) return false;
    if (sepFiltro.turno.length > 0 && !hasArr(sepFiltro.turno, r.turno)) return false;
    if (sepFiltro.operador.length > 0 && !hasArr(sepFiltro.operador, r.operador)) return false;
    return true;
  });

  const porMesMap = {};
  rows.forEach(r => {
    const k = r.mes || 'Sem data';
    if (!porMesMap[k]) {
      porMesMap[k] = { mes: k, frac: 0, full: 0, total: 0, linhas: 0, diasSet: new Set(), opsSet: new Set() };
    }
    const m = porMesMap[k];
    if (r.fluxo === 'Fracionado') m.frac += r.caixas;
    else m.full += r.caixas;
    m.total += r.caixas;
    m.linhas += r.linhas;
    if (r.data !== 'Sem data') m.diasSet.add(r.data);
    m.opsSet.add(r.operador);
  });

  const meses = Object.values(porMesMap).sort((a, b) => mesOrdem(a.mes).localeCompare(mesOrdem(b.mes)));
  const maxMes = meses.length ? Math.max(...meses.map(m => m.total)) * 1.2 : 1;

  el.innerHTML = `
    <h2>Analítico Mensal · Separação</h2>
    <p class="sub">Evolução consolidada por mês entre <b>Separação Fracionado</b> e <b>Separação Full</b>.${esc(sepAtualizadoTxt())}</p>

    <div class="card">
      <h3>${ICONS.chart} Evolução Mensal de Caixas Separadas (Fracionado + Full)</h3>
      ${meses.length ? `
        <div class="bar-chart-container" style="height:290px;padding-top:55px">
          <div class="bar-chart-wrapper">
            ${meses.map((m, idx) => {
              const pctH = (m.total / maxMes) * 100;
              const isSel = isSelectedArr(sepFiltro.mes, m.mes);
              let varTag = '';
              if (idx > 0 && meses[idx - 1].total > 0) {
                const vp = ((m.total - meses[idx - 1].total) / meses[idx - 1].total) * 100;
                varTag = `<span class="bar-var-tag ${vp >= 0 ? 'up' : 'down'}">${vp >= 0 ? '+' : ''}${fmtP(vp, 1)}</span>`;
              }
              return `
                <div class="bar-chart-col" data-sep-mes="${esc(m.mes)}" style="cursor:pointer">
                  <div class="bar-chart-bar ${isSel ? 'is-proj' : ''}" style="height:${Math.max(pctH, 6)}%">
                    <div class="bar-val-label"><span>${fmtN.format(m.total)}</span>${varTag}</div>
                  </div>
                  <div class="bar-date-label" style="${isSel ? 'color:var(--accent-text);font-weight:800' : ''}">${esc(mesLabel(m.mes))}</div>
                </div>`;
            }).join('')}
          </div>
        </div>` : '<p style="color:var(--mute)">Sem dados mensais.</p>'}
    </div>

    <div class="card" style="margin-top:20px">
      <h3>${ICONS.calendar} Consolidado Mensal por Fluxo</h3>
      <div class="tw">
        <table class="sep-bi-table">
          <thead>
            <tr>
              <th>Mês</th>
              <th class="r">Dias Operados</th>
              <th class="r">Operadores</th>
              <th class="r">Fracionado (Cx)</th>
              <th class="r">Full (Cx)</th>
              <th class="r">Total Caixas</th>
              <th class="r">Média Diária</th>
              <th class="r">Linhas / Paletes</th>
            </tr>
          </thead>
          <tbody>
            ${meses.map(m => {
              const dias = m.diasSet.size || 1;
              return `<tr class="clickable-row ${isSelectedArr(sepFiltro.mes, m.mes) ? 'active-row' : ''}" data-sep-mes="${esc(m.mes)}">
                <td><b>${esc(mesLabel(m.mes))}</b></td>
                <td class="r">${fmtN.format(dias)}</td>
                <td class="r">${fmtN.format(m.opsSet.size)}</td>
                <td class="r col-hl-blue">${fmtN.format(m.frac)}</td>
                <td class="r col-hl-purple">${fmtN.format(m.full)}</td>
                <td class="r" style="font-weight:800">${fmtN.format(m.total)}</td>
                <td class="r" style="color:var(--ok);font-weight:700">${fmtN.format(Math.round(m.total / dias))}</td>
                <td class="r">${fmtN.format(m.linhas)}</td>
              </tr>`;
            }).join('')}
          </tbody>
        </table>
      </div>
    </div>`;

  document.querySelectorAll('[data-sep-mes]').forEach(el => el.addEventListener('click', () => {
    toggleArr(sepFiltro.mes, el.getAttribute('data-sep-mes'));
    render();
  }));
}

function tabFilters(){
  const opt = (v, l) => ({v:String(v), l:String(l)});
  const uniq = arr => Array.from(new Set(arr.filter(Boolean)));
  const R = (D && D.rows) || [];
  const C = (D && D.cart) || [];

  switch(activeTab){
    case 'geral': {
      const locais = uniq(R.map(r => r.est)).filter(n => n.toLowerCase() !== 'null').sort();
      const status = uniq(R.map(r => r.status)).sort();
      const base = filterArea.length > 0 ? R.filter(r => hasArr(filterArea, r.area)) : R;
      const ruas = uniq(base.map(r => r.rua).filter(r => r > 0)).sort((a,b) => a - b);
      return [
        {id:'local', label:'Local de Estoque', val:filterLocalEst, multi:true, opts:[opt('todos','Todos'), ...locais.map(x => opt(x, nice(x)))]},
        {id:'status', label:'Status', val:filterStatusEst, multi:true, opts:[opt('todos','Todos'), ...status.map(x => opt(x, x))]},
        {id:'area', label:'Galpão', val:filterArea, multi:true, opts:[opt('todos','Todos'), opt('1','Galpão 1'), opt('7','Galpão 2')]},
        {id:'rua', label:'Rua', val:filterRua, multi:true, opts:[opt('todos','Todas'), ...ruas.map(r => opt(r, 'Rua '+r))]}
      ];
    }
    case 'shelf':
      return [{id:'shelf', label:'Faixa de Validade', val:filterShelfFaixa, multi:true, opts:[opt('todos','Todas'), ...Object.keys(SHELF_CLASS).map(f => opt(f, f))]}];
    case 'aging':
      return [{id:'aging', label:'Faixa de Permanência', val:filterAgingFaixa, multi:true, opts:[opt('todos','Todas'), ...Object.keys(AGING_CLASS).map(f => opt(f, f))]}];
    case 'ocup': {
      const O = occData();
      const r1 = Object.keys(O.g1.ruas).map(Number).sort((a,b) => a-b);
      const r2 = Object.keys(O.g2.ruas).map(Number).sort((a,b) => a-b);
      let ruas = [];
      if (filterOcupGalpao.length === 1 && filterOcupGalpao[0] === 'g1') ruas = r1;
      else if (filterOcupGalpao.length === 1 && filterOcupGalpao[0] === 'g2') ruas = r2;
      else ruas = Array.from(new Set([...r1, ...r2])).sort((a,b) => a-b);
      return [
        {id:'galpao', label:'Galpão', val:filterOcupGalpao, multi:true, opts:[opt('todos','Todos'), opt('g1','Galpão 1'), opt('g2','Galpão 2')]},
        {id:'orua', label:'Rua', val:filterOcupRua, multi:true, opts:[opt('todos','Todas'), ...ruas.map(r => opt(r, 'Rua '+r))]}
      ];
    }
    case 'carteira': {
      const datas = uniq(C.map(r => r.gerReserva)).sort();
      const seps = uniq(C.map(r => r.tipoSep)).sort();
      const depts = uniq(C.map(r => r.dept)).sort();
      const dests = uniq(C.map(r => r.dest)).sort();
      return [
        {id:'cstatus', label:'Status', val:statusFilter, def:'pendente', multi:false, opts:[opt('pendente','Pendentes'), opt('separado','Separados'), opt('todos','Todos')]},
        {id:'cres', label:'Geração Reserva', val:dateReservaFilter, multi:true, opts:[opt('todos','Todas'), ...datas.map(x => opt(x, x))]},
        {id:'csep', label:'Tipo Separação', val:sepFilter, multi:true, opts:[opt('todos','Todos'), ...seps.map(x => opt(x, x))]},
        {id:'cdept', label:'Departamento', val:deptFilter, multi:true, opts:[opt('todos','Todos'), ...depts.map(x => opt(x, x))]},
        {id:'cdest', label:'Loja / Destino', val:targetDestFilter, multi:true, opts:[opt('todos','Todas'), ...dests.map(x => opt(x, x))]}
      ];
    }
    case 'transito': {
      const notas = admNotasTodas();
      const meses = uniq(notas.map(n => nfMes(n.dataEmissao))).sort((a,b) => mesOrdem(a).localeCompare(mesOrdem(b)));
      const lojasSet = new Set();
      notas.forEach(n => { [sCod(n.origem), sCod(n.destino)].forEach(c => { if (c && c !== CD_COD) lojasSet.add(c); }); });
      const lojas = Array.from(lojasSet).map(c => opt(c, getNomeLoja(c))).sort((a,b) => a.l.localeCompare(b.l));
      return [
        {id:'asentido', label:'Sentido', val:admFiltro.sentido, multi:true, opts:[opt('todos','Todos'), ...Object.entries(SENT_LABEL).map(([k,l]) => opt(k, l))]},
        {id:'ames', label:'Mês', val:admFiltro.mes, multi:true, opts:[opt('todos','Todos'), ...meses.map(m => opt(m, mesLabel(m)))]},
        {id:'afaixa', label:'Tempo em Trânsito', val:admFiltro.faixa, multi:true, opts:[opt('todos','Todas'), ...Object.entries(FAIXA_DIAS_LABEL).map(([k,l]) => opt(k, l))]},
        {id:'aloja', label:'Loja', val:admFiltro.loja, multi:true, opts:[opt('todos','Todas'), ...lojas]}
      ];
    }
    case 'prealerta': {
      const rows = preTodas();
      const sits = uniq(rows.map(r => r.situacao));
      const tipos = uniq(rows.map(r => r.tipo)).sort();
      const meses = uniq(rows.map(r => r.mes)).sort((a,b) => mesOrdem(a).localeCompare(mesOrdem(b)));
      const stCds = uniq(rows.map(r => r.statusCd)).sort();
      const stLojas = uniq(rows.map(r => r.statusLoja)).sort();
      const lojas = uniq(rows.map(r => r.loja)).sort();
      return [
        {id:'psit', label:'Situação', val:preFiltro.situacao, multi:true, opts:[opt('todos','Todas'), ...sits.map(x => opt(x, x))]},
        ...(tipos.length ? [{id:'ptipo', label:'Tipo', val:preFiltro.tipo, multi:true, opts:[opt('todos','Todos'), ...tipos.map(x => opt(x, x))]}] : []),
        ...(meses.length > 1 ? [{id:'pmes', label:'Mês', val:preFiltro.mes, multi:true, opts:[opt('todos','Todos'), ...meses.map(m => opt(m, mesLabel(m)))]}] : []),
        ...(stCds.length ? [{id:'pstcd', label:'Status CD', val:preFiltro.stCd, multi:true, opts:[opt('todos','Todos'), ...stCds.map(x => opt(x, x))]}] : []),
        ...(stLojas.length ? [{id:'pstloja', label:'Status Loja', val:preFiltro.stLoja, multi:true, opts:[opt('todos','Todos'), ...stLojas.map(x => opt(x, x))]}] : []),
        {id:'ploja', label:'Loja', val:preFiltro.loja, multi:true, opts:[opt('todos','Todas'), ...lojas.map(x => opt(x, x))]}
      ];
    }
    case 'recebnotas':
    case 'recebverba': {
      const notas = recNotasTodas();
      const meses = uniq(notas.map(n => n.mes)).sort((a,b) => mesOrdem(a).localeCompare(mesOrdem(b)));
      const lojas = uniq(notas.map(n => n.loja)).sort();
      const cargas = uniq(notas.map(n => n.tipoCarga)).sort();
      const ops = uniq(notas.map(n => n.tipoOperacao)).sort();
      const forns = uniq(notas.map(n => n.fornecedor)).sort();
      return [
        {id:'rmes', label:'Mês Recebimento', val:recFiltro.mes, multi:true, opts:[opt('todos','Todos'), ...meses.map(m => opt(m, mesLabel(m)))]},
        {id:'rpagaverba', label:'Paga Verba?', val:recFiltro.pagaVerba, def:'todos', multi:false, opts:[opt('todos','Todos (Pagam e Não)'), opt('sim','Sim · Com Verba'), opt('nao','Não · Sem Verba')]},
        {id:'rloja', label:'Loja', val:recFiltro.loja, multi:true, opts:[opt('todos','Todas'), ...lojas.map(x => opt(x, x))]},
        {id:'rcarga', label:'Tipo de Carga', val:recFiltro.tipoCarga, multi:true, opts:[opt('todos','Todos'), ...cargas.map(x => opt(x, x))]},
        {id:'rop', label:'Tipo de Operação', val:recFiltro.tipoOp, multi:true, opts:[opt('todos','Todas'), ...ops.map(x => opt(x, x))]},
        {id:'rforn', label:'Fornecedor', val:recFiltro.fornecedor, multi:true, opts:[opt('todos','Todos'), ...forns.map(x => opt(x, x))]}
      ];
    }
    case 'sepgeral':
    case 'sephorahora':
    case 'sepoperadores':
    case 'sepanual': {
      const regs = sepRegistrosTodos();
      const meses = uniq(regs.map(r => r.mes)).sort((a,b) => mesOrdem(a).localeCompare(mesOrdem(b)));
      const dias = uniq(regs.map(r => r.data).filter(d => d !== 'Sem data')).sort(sortDataBR).reverse();
      const turnos = uniq(regs.map(r => r.turno)).sort();
      const ops = uniq(regs.map(r => r.operador)).sort();
      return [
        {id:'smes', label:'Mês', val:sepFiltro.mes, multi:true, opts:[opt('todos','Todos'), ...meses.map(m => opt(m, mesLabel(m)))]},
        ...(activeTab !== 'sephorahora' ? [{id:'sdia', label:'Data', val:sepFiltro.dia, multi:true, opts:[opt('todos','Todas'), ...dias.map(d => opt(d, d))]}] : []),
        {id:'sfluxo', label:'Fluxo Separação', val:sepFiltro.fluxo, def:'todos', multi:false, opts:[opt('todos','Todos (Frac + Full)'), opt('Fracionado','Separação Fracionado'), opt('Full','Separação Full')]},
        {id:'sturno', label:'Turno', val:sepFiltro.turno, multi:true, opts:[opt('todos','Todos'), ...turnos.map(t => opt(t, t))]},
        {id:'sop', label:'Operador', val:sepFiltro.operador, multi:true, opts:[opt('todos','Todos'), ...ops.map(o => opt(o, o))]}
      ];
    }
  }
  return [];
}

function getMultiBtnText(f) {
  const arr = Array.isArray(f.val) ? f.val : [];
  const allOpt = f.opts.find(o => o.v === 'todos');
  if (arr.length === 0) return allOpt ? allOpt.l : 'Todos';
  if (arr.length === 1) {
    const found = f.opts.find(o => String(o.v).toLowerCase() === String(arr[0]).toLowerCase());
    return found ? found.l : arr[0];
  }
  return `${arr.length} selecionados`;
}

function renderFilterBar(){
  const bar = $('#filterbar');
  if (!bar) return;
  const fs = tabFilters();
  if (!fs.length) { bar.className = 'gfbar'; bar.innerHTML = ''; return; }
  bar.className = 'gfbar on';

  const ativos = [];
  fs.forEach(f => {
    if (f.multi) {
      const arr = Array.isArray(f.val) ? f.val : [];
      arr.forEach(v => {
        const found = f.opts.find(o => String(o.v).toLowerCase() === String(v).toLowerCase());
        ativos.push({ id: f.id, label: f.label, val: v, valLabel: found ? found.l : v, multi: true });
      });
    } else {
      const def = f.def || 'todos';
      if (f.val !== def) {
        const found = f.opts.find(o => o.v === f.val);
        ativos.push({ id: f.id, label: f.label, val: f.val, valLabel: found ? found.l : f.val, multi: false });
      }
    }
  });

  bar.innerHTML = `<div class="gf-row">
    <span class="gf-title">${ICONS.filter} Filtros</span>
    ${fs.map(f => {
      if (f.multi) {
        const arr = Array.isArray(f.val) ? f.val : [];
        const isOn = arr.length > 0;
        const realOpts = f.opts.filter(o => o.v !== 'todos');
        return `<div class="gf ${isOn ? 'on' : ''}">
          <span class="gf-lbl">${esc(f.label)}</span>
          <div class="ms-wrap" data-ms-id="${f.id}">
            <button type="button" class="ms-btn">
              <span class="ms-btn-txt">${esc(getMultiBtnText(f))}</span>
              ${arr.length > 1 ? `<span class="ms-badge">${arr.length}</span>` : ''}
              <span class="ms-arrow">▼</span>
            </button>
            <div class="ms-menu">
              ${realOpts.length > 7 ? `<input type="text" class="ms-search" placeholder="Buscar ${esc(f.label.toLowerCase())}...">` : ''}
              <div class="ms-actions">
                <span>${arr.length ? `${arr.length} marcado(s)` : 'Todos visíveis'}</span>
                <div class="ms-actions-btns">
                  <button type="button" data-ms-clear="${f.id}">Limpar (Todos)</button>
                </div>
              </div>
              <div class="ms-list">
                ${realOpts.map(o => {
                  const checked = isSelectedArr(arr, o.v);
                  return `<label class="ms-item ${checked ? 'checked' : ''}" data-ms-text="${esc(o.l.toLowerCase())}">
                    <input type="checkbox" data-ms-opt="${f.id}" value="${esc(o.v)}" ${checked ? 'checked' : ''}>
                    <span>${esc(o.l)}</span>
                  </label>`;
                }).join('')}
              </div>
            </div>
          </div>
        </div>`;
      } else {
        const def = f.def || 'todos';
        return `<label class="gf ${f.val !== def ? 'on' : ''}">
          <span class="gf-lbl">${esc(f.label)}</span>
          <select data-f="${f.id}">${f.opts.map(o => `<option value="${esc(o.v)}" ${o.v===f.val?'selected':''}>${esc(o.l)}</option>`).join('')}</select>
        </label>`;
      }
    }).join('')}
    <button class="gf-clear" id="gfClear" ${ativos.length ? '' : 'disabled'}>Limpar filtros</button>
  </div>${ativos.length ? `<div class="gf-chips">${ativos.map(a =>
    `<button class="chip" data-chip-id="${a.id}" data-chip-val="${esc(a.val)}" data-chip-multi="${a.multi ? '1' : '0'}" title="Remover filtro">${esc(a.label)}: <b>${esc(a.valLabel)}</b> ✕</button>`
  ).join('')}</div>` : ''}`;

  bar.querySelectorAll('select[data-f]').forEach(s => s.addEventListener('change', e => {
    setFilterValue(e.target.dataset.f, e.target.value);
    render();
  }));

  bar.querySelectorAll('.ms-wrap').forEach(wrap => {
    const btn = wrap.querySelector('.ms-btn');
    const search = wrap.querySelector('.ms-search');
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const wasOpen = wrap.classList.contains('open');
      document.querySelectorAll('.ms-wrap.open').forEach(w => w.classList.remove('open'));
      if (!wasOpen) {
        wrap.classList.add('open');
        if (search) setTimeout(() => search.focus(), 20);
      }
    });
    if (search) {
      search.addEventListener('click', e => e.stopPropagation());
      search.addEventListener('input', () => {
        const q = search.value.trim().toLowerCase();
        wrap.querySelectorAll('.ms-item').forEach(item => {
          item.style.display = item.dataset.msText.includes(q) ? 'flex' : 'none';
        });
      });
    }
    const menu = wrap.querySelector('.ms-menu');
    if (menu) menu.addEventListener('click', e => e.stopPropagation());
  });

  bar.querySelectorAll('input[data-ms-opt]').forEach(cb => {
    cb.addEventListener('change', () => {
      const fid = cb.dataset.msOpt;
      const val = cb.value;
      toggleMultiFilterValue(fid, val);
      render();
      const reopen = document.querySelector(`.ms-wrap[data-ms-id="${fid}"]`);
      if (reopen) reopen.classList.add('open');
    });
  });

  bar.querySelectorAll('button[data-ms-clear]').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      setFilterValue(btn.dataset.msClear, 'todos');
      render();
    });
  });

  bar.querySelectorAll('[data-chip-id]').forEach(c => c.addEventListener('click', () => {
    const id = c.dataset.chipId;
    const val = c.dataset.chipVal;
    const isMulti = c.dataset.chipMulti === '1';
    if (isMulti) {
      toggleMultiFilterValue(id, val);
    } else {
      const f = fs.find(x => x.id === id);
      setFilterValue(id, f && f.def ? f.def : 'todos');
    }
    render();
  }));

  const clr = $('#gfClear');
  if (clr) clr.addEventListener('click', () => { clearTabFilters(); render(); });
}

document.addEventListener('click', () => {
  document.querySelectorAll('.ms-wrap.open').forEach(w => w.classList.remove('open'));
});

function render(){
  document.querySelectorAll('section').forEach(s => s.classList.toggle('on', s.id === 's-' + activeTab));
  renderFilterBar();
  const t = ALL_TABS.find(x => x.id === activeTab);
  if (t && (D || ['admin', 'recebimento', 'separacao'].includes(t.setor))) t.fn();
}

const sideToggle = $('#sideToggle');
if (sideToggle) sideToggle.addEventListener('click', () => {
  document.body.classList.toggle('side-collapsed');
});

const themeBtn = $('#themeToggle');
if (themeBtn) {
  const savedTheme = localStorage.getItem('cdr_theme');
  if (savedTheme === 'light') {
    document.body.classList.add('light-theme');
    themeBtn.innerHTML = `${ICONS.moon} <span>Tema Escuro</span>`;
  }
  themeBtn.addEventListener('click', () => {
    const isLight = document.body.classList.toggle('light-theme');
    localStorage.setItem('cdr_theme', isLight ? 'light' : 'dark');
    themeBtn.innerHTML = isLight ? `${ICONS.moon} <span>Tema Escuro</span>` : `${ICONS.sun} <span>Tema Claro</span>`;
    render();
  });
}

renderNav();

document.querySelectorAll('#basis button').forEach(b=>b.addEventListener('click',()=>{
  basis=b.dataset.b; 
  document.querySelectorAll('#basis button').forEach(x=>x.setAttribute('aria-pressed',x===b)); 
  render();
}));

$('#tv').addEventListener('click',e=>{
  const on = e.currentTarget.getAttribute('aria-pressed')!=='true'; 
  e.currentTarget.setAttribute('aria-pressed',on); 
  document.body.classList.toggle('tvmode',on);
  clearInterval(tvTimer); 
  if(on){
    const s = SETORES.find(x => x.id === activeSetor) || SETORES[0];
    const order = s.tabs.map(t => t.id);
    let i = order.indexOf(activeTab);
    tvTimer = setInterval(() => {
      i = (i + 1) % order.length;
      setActiveTab(order[i]);
    }, CONFIG.TV_SEGUNDOS * 1000);
  }
});

let tick = 0; 
setInterval(()=>{
  tick++; 
  const p = (tick/(CONFIG.ATUALIZAR_MIN*60))*100; 
  $('#bar').style.width = Math.min(100,p)+'%';
  if(p>=100){
    tick=0; 
    load();
  }
},1000);

load();
</script>
</body>
</html>
