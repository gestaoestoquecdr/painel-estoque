function secCarteira(){
  let C = (D && D.cart) ? D.cart : [];
  if (!C.length) {
    $('#s-carteira').innerHTML = `<h2>Carteira de Pedido</h2><p class="sub">Nenhum dado encontrado na chave 'carteira' do JSON.</p>`;
    return;
  }

  let filteredC = C;

  if (dateReservaFilter.length > 0) {
    filteredC = filteredC.filter(r => hasArr(dateReservaFilter, r.gerReserva));
  }
  if (sepFilter.length > 0) {
    filteredC = filteredC.filter(r => hasArr(sepFilter, r.tipoSep));
  }
  if (targetDestFilter.length > 0) {
    filteredC = filteredC.filter(r => hasArr(targetDestFilter, r.dest));
  }
  if (deptFilter.length > 0) {
    filteredC = filteredC.filter(r => hasArr(deptFilter, r.dept));
  }

  const isRowSeparado = r => r.tipoSep === 'Separado' || (r.qtdPedida > 0 && r.qtdPedida <= r.qtdSeparada);
  const viewC = filteredC.filter(r => {
    if (statusFilter === 'pendente') return !isRowSeparado(r);
    if (statusFilter === 'separado') return isRowSeparado(r);
    return true;
  });

  const totPedida = viewC.reduce((s,r) => s + r.qtdPedida, 0);
  const totSeparada = viewC.reduce((s,r) => s + r.qtdSeparada, 0);
  const totPendQtd = Math.max(0, totPedida - totSeparada);
  const totValor = viewC.reduce((s,r) => s + r.valorTotal, 0);
  const pctAtendimento = totPedida ? (totSeparada / totPedida) * 100 : 0;

  const fullLinhasAll = viewC.filter(r => r.tipoSep.toLowerCase().trim() === 'full');
  const fullLinhasPend = fullLinhasAll.filter(r => !isRowSeparado(r)).length;
  const fullLinhasSep = fullLinhasAll.length - fullLinhasPend;

  const datasPendentesSet = new Set();
  viewC.forEach(r => {
    if (!isRowSeparado(r) && r.gerReserva && r.gerReserva !== 'Sem data') {
      datasPendentesSet.add(r.gerReserva);
    }
  });

  const qtdDatasPendentes = datasPendentesSet.size;
  const diasAtraso = qtdDatasPendentes;
  const isCritico = diasAtraso >= 2;
  const atrasoStr = `D-${diasAtraso}`;
  const atrasoSub = isCritico ? `🚨 CRÍTICO (${qtdDatasPendentes} datas pendentes)` : `Dentro da Meta (${qtdDatasPendentes} datas pendentes)`;
  const kpiClassAtraso = isCritico ? 'hl' : '';

  const topPedentesCrit = viewC.filter(r => !isRowSeparado(r)).sort((a,b) => b.valorTotal - a.valorTotal).slice(0, 3).map(r => ({
    prod: r.prod,
    sub: `Destino: ${r.dest} | Valor: ${brlShort(r.valorTotal)}`
  }));

  const hmClass = (pct) => {
    if (pct >= 40) return 'hm-crit';
    if (pct >= 15) return 'hm-high';
    if (pct >= 3)  return 'hm-mid';
    return 'hm-low';
  };

  // 1. TABELA POR DATA DE GERAÇÃO DA RESERVA
  const byRes = {};
  viewC.forEach(r => {
    const k = r.gerReserva || 'Sem data';
    byRes[k] = byRes[k] || {qtd:0, valor:0, qtdSep:0, pendentes:0, separados:0, fullLinhas:0, fullQtd:0, totalLinhas:0};
    byRes[k].qtd += r.qtdPedida;
    byRes[k].valor += r.valorTotal;
    byRes[k].qtdSep += r.qtdSeparada;
    byRes[k].totalLinhas += 1;
    if (r.tipoSep.toLowerCase().trim() === 'full') {
      byRes[k].fullLinhas += 1;
      byRes[k].fullQtd += r.qtdPedida;
    }
    if (isRowSeparado(r)) {
      byRes[k].separados++;
    } else {
      byRes[k].pendentes++;
    }
  });
  let resRows = Object.entries(byRes).sort((a,b) => a[0].localeCompare(b[0]));
  if (resFilter === 'pendente') {
    resRows = resRows.filter(([, o]) => o.pendentes > 0);
  } else if (resFilter === 'separado') {
    resRows = resRows.filter(([, o]) => o.pendentes === 0);
  }
  const totResBase = basis === 'custo' ? totValor : totPedida;
  const totFullLinhasRes = resRows.reduce((s, [, o]) => s + o.fullLinhas, 0);

  // 2. TABELA POR TIPO DE SEPARAÇÃO
  const bySep = {};
  viewC.forEach(r => {
    const k = r.tipoSep || 'Não informado';
    bySep[k] = bySep[k] || {pedida:0, separada:0, valor:0, linhas:0};
    bySep[k].pedida += r.qtdPedida;
    bySep[k].separada += r.qtdSeparada;
    bySep[k].valor += r.valorTotal;
    bySep[k].linhas += 1;
  });
  const sepRows = Object.entries(bySep).sort((a,b) => (basis === 'custo' ? b[1].valor - a[1].valor : b[1].pedida - a[1].pedida));
  const totLinhasSep = sepRows.reduce((s, [, o]) => s + o.linhas, 0);

  // 3. PARTICIPAÇÃO POR DEPARTAMENTO CD (CATEGORIA)
  const baseDept = C.filter(r => {
    if (dateReservaFilter.length > 0 && !hasArr(dateReservaFilter, r.gerReserva)) return false;
    if (sepFilter.length > 0 && !hasArr(sepFilter, r.tipoSep)) return false;
    if (targetDestFilter.length > 0 && !hasArr(targetDestFilter, r.dest)) return false;
    if (statusFilter === 'pendente' && isRowSeparado(r)) return false;
    if (statusFilter === 'separado' && !isRowSeparado(r)) return false;
    return true;
  });

  const byDept = {};
  baseDept.forEach(r => {
    const k = r.dept || 'Não encontrado';
    byDept[k] = byDept[k] || {qtd:0, valor:0, linhas:0};
    byDept[k].qtd += r.qtdPedida;
    byDept[k].valor += r.valorTotal;
    byDept[k].linhas += 1;
  });
  const deptRows = Object.entries(byDept).sort((a,b) => (basis==='custo' ? b[1].valor - a[1].valor : b[1].qtd - a[1].qtd));
  const totDeptVal = deptRows.reduce((s, [, o]) => s + (basis==='custo' ? o.valor : o.qtd), 0) || 1;
  const maxDeptVal = deptRows.length ? Math.max(...deptRows.map(([, o]) => basis==='custo' ? o.valor : o.qtd)) : 1;

  // 4. RESUMO POR DESTINATÁRIO (LOJA)
  const byDest = {};
  viewC.forEach(r => {
    const k = r.dest || "Sem Destino";
    byDest[k] = byDest[k] || {pedida:0, separada:0, valor:0, fullLinhas:0, linhas:0};
    byDest[k].pedida += r.qtdPedida;
    byDest[k].separada += r.qtdSeparada;
    byDest[k].valor += r.valorTotal;
    byDest[k].linhas += 1;
    if (r.tipoSep.toLowerCase().trim() === 'full') byDest[k].fullLinhas += 1;
  });
  let destRows = Object.entries(byDest).sort((a,b) => b[1].pedida - a[1].pedida);
  if (destSearch) {
    destRows = destRows.filter(([k]) => k.toLowerCase().includes(destSearch.toLowerCase()));
  }

  // 5. PRODUTOS AGRUPADOS
  const prodAggMap = {};
  filteredC.forEach(r => {
    const pendQtd = Math.max(0, r.qtdPedida - r.qtdSeparada);
    const isSep = isRowSeparado(r);
    
    if (statusFilter === 'pendente' && isSep) return;
    if (statusFilter === 'separado' && !isSep) return;

    const key = (r.codProd && r.codProd !== '-') ? r.codProd : r.prod;
    if (!prodAggMap[key]) {
      prodAggMap[key] = {
        codProd: r.codProd || '-',
        gtin: r.gtin || '-',
        prod: r.prod || 'Sem Descrição',
        tiposSet: new Set(),
        linhas: 0,
        qtdPedida: 0,
        qtdSeparada: 0,
        qtdPend: 0,
        valorTotal: 0,
        valorPend: 0
      };
    }

    prodAggMap[key].linhas += 1;
    prodAggMap[key].qtdPedida += r.qtdPedida;
    prodAggMap[key].qtdSeparada += r.qtdSeparada;
    prodAggMap[key].qtdPend += pendQtd;
    prodAggMap[key].valorTotal += r.valorTotal;
    
    const pendVal = r.qtdPedida ? (r.valorTotal * (pendQtd / r.qtdPedida)) : 0;
    prodAggMap[key].valorPend += pendVal;

    if (r.tipoSep) prodAggMap[key].tiposSet.add(r.tipoSep);
    if (r.gtin && r.gtin !== '-') prodAggMap[key].gtin = r.gtin;
  });

  let prodsList = Object.values(prodAggMap).map(p => ({
    ...p,
    tipoSep: Array.from(p.tiposSet).join(', ') || '-'
  }));

  if (prodSearch) {
    const q = prodSearch.toLowerCase();
    prodsList = prodsList.filter(p => 
      p.prod.toLowerCase().includes(q) || 
      p.codProd.toLowerCase().includes(q) || 
      p.gtin.toLowerCase().includes(q)
    );
  }

  if (prodSortOrder === 'valor') {
    prodsList.sort((a,b) => b.valorPend - a.valorPend);
  } else if (prodSortOrder === 'qtd') {
    prodsList.sort((a,b) => b.qtdPend - a.qtdPend);
  } else if (prodSortOrder === 'pedida') {
    prodsList.sort((a,b) => b.qtdPedida - a.qtdPedida);
  } else if (prodSortOrder === 'linhas') {
    prodsList.sort((a,b) => b.linhas - a.linhas);
  }

  const statusTitleText = statusFilter === 'pendente' 
    ? 'PRODUTOS PENDENTES DE SEPARAÇÃO' 
    : (statusFilter === 'separado' ? 'PRODUTOS SEPARADOS' : 'TODOS OS PRODUTOS DA CARTEIRA');

  $('#s-carteira').innerHTML = `
  <h2>Carteira de Pedido</h2>
  <p class="sub">Acompanhamento executivo por data de geração, tipo de separação, departamento, loja e produto.</p>

  <div class="grid kpis">
    ${kpi('Qtd Pedida', fmtN.format(totPedida), `Separado: ${fmtN.format(totSeparada)} (${fmtP(pctAtendimento)})`, 'hl')}
    ${kpi('Valor Total', brlShort(totValor), brl(totValor), 'hl')}
    ${kpi('Pendente de Separação', fmtN.format(totPendQtd), brlShort(viewC.reduce((s,r) => s + (!isRowSeparado(r) ? r.valorTotal : 0), 0)), '', 'Maiores Pedidos Pendentes', topPedentesCrit, 'var(--warn)')}
    ${kpi('Linhas / Paletes Full', `<span style="color:var(--blue)">${fmtN.format(fullLinhasAll.length)}</span>`, `Pend: ${fmtN.format(fullLinhasPend)} | Sep: ${fmtN.format(fullLinhasSep)}`, '', 'Separação Full (Paletes Fechados)', [{prod: `Total de Linhas Full: ${fmtN.format(fullLinhasAll.length)}`, sub: `Pendentes: ${fmtN.format(fullLinhasPend)} paletes | Separados: ${fmtN.format(fullLinhasSep)} paletes`}], 'var(--blue)')}
    ${kpi('Indicador de Atraso', `<span style="${isCritico ? 'color:var(--crit);' : 'color:var(--warn);'}">${atrasoStr}</span>`, atrasoSub, kpiClassAtraso, 'Datas em Atraso Crítico', Array.from(datasPendentesSet).map(d => ({prod: `Data Reserva: ${d}`, sub: 'Pendente de liberação'})), isCritico ? 'var(--crit)' : 'var(--warn)')}
  </div>

  <!-- BLOCO SUPERIOR: GERAÇÃO RESERVA (DATAS) AO LADO DE TIPO DE SEPARAÇÃO -->
  <div class="grid two-even" style="margin-top:18px">
    <!-- 1. GERAÇÃO RESERVA COM LINHAS / PALETES FULL -->
    <div class="card">
      <div class="card-header-action">
        <h3>${ICONS.calendar} GERAÇÃO RESERVA (${resRows.length} DATAS) · CLIQUE P/ FILTRAR</h3>
        <span style="font-size:14px;color:var(--mute);font-weight:700">Paletes Full: <b style="color:var(--blue)">${fmtN.format(totFullLinhasRes)}</b></span>
      </div>
      <div class="tw">
        <table class="cart-matrix">
          <thead>
            <tr>
              <th>Geração Reserva</th>
              <th class="r">Qtd Pedida</th>
              <th class="r">Valor Total</th>
              <th class="r">% Repr.</th>
              <th class="r" title="Quantidade de linhas / paletes do fluxo Full nesta data">Linhas / Paletes Full</th>
            </tr>
          </thead>
          <tbody>
            ${resRows.length ? resRows.map(([dt, o]) => {
              const isSelectedDt = isSelectedArr(dateReservaFilter, dt);
              const valMetric = basis === 'custo' ? o.valor : o.qtd;
              const pctRep = totResBase ? (valMetric / totResBase) * 100 : 0;
              const pctStr = pctRep > 0 && pctRep < 0.01 ? '+0%' : fmtP(pctRep, pctRep >= 10 ? 1 : 2);
              return `
              <tr class="clickable-row ${isSelectedDt ? 'active-row' : ''}" data-filter-res-dt="${esc(dt)}">
                <td>
                  <b>${esc(dt)}</b>
                  ${o.pendentes === 0 ? '<span style="color:var(--ok);font-size:13px;margin-left:6px">✔</span>' : ''}
                </td>
                <td class="r" style="font-weight:700">${fmtN.format(o.qtd)}</td>
                <td class="r">${brlShort(o.valor)}</td>
                <td class="r"><span class="hm-cell ${hmClass(pctRep)}">${pctStr}</span></td>
                <td class="r">
                  ${o.fullLinhas > 0 
                    ? `<span class="badge-pill badge-full" title="${fmtN.format(o.fullQtd)} unidades em ${o.fullLinhas} paletes Full">${fmtN.format(o.fullLinhas)}</span>` 
                    : `<span style="color:var(--mute)">0</span>`}
                </td>
              </tr>`;
            }).join('') : '<tr><td colspan="5">Nenhuma data encontrada no filtro.</td></tr>'}
            <tr class="tot">
              <td>Total Geral</td>
              <td class="r">${fmtN.format(totPedida)}</td>
              <td class="r">${brlShort(totValor)}</td>
              <td class="r" style="color:var(--accent-text)">100,0%</td>
              <td class="r" style="color:var(--blue)">${fmtN.format(totFullLinhasRes)}</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- 2. TIPO DE SEPARAÇÃO AO LADO DAS DATAS -->
    <div class="card">
      <div class="card-header-action">
        <h3>${ICONS.sliders} TIPO DE SEPARAÇÃO · CLIQUE P/ FILTRAR</h3>
        <span style="font-size:14px;color:var(--mute);font-weight:700">Lotes/Linhas: <b style="color:var(--accent-text)">${fmtN.format(totLinhasSep)}</b></span>
      </div>
      <div class="tw">
        <table class="cart-matrix">
          <thead>
            <tr>
              <th>Tipo de Separação</th>
              <th class="r">Qtd Pedida</th>
              <th class="r">Valor Total</th>
              <th class="r">% Repr.</th>
              <th class="r">Nº do Lote / Linhas</th>
            </tr>
          </thead>
          <tbody>
            ${sepRows.length ? sepRows.map(([tp, o]) => {
              const isSelectedSep = isSelectedArr(sepFilter, tp);
              const valMetric = basis === 'custo' ? o.valor : o.pedida;
              const pctRep = totResBase ? (valMetric / totResBase) * 100 : 0;
              const pctStr = pctRep > 0 && pctRep < 1 ? '+0%' : fmtP(pctRep, 0);
              return `
              <tr class="clickable-row ${isSelectedSep ? 'active-row' : ''}" data-filter-carteira-sep="${esc(tp)}">
                <td><b>${esc(tp)}</b></td>
                <td class="r" style="font-weight:700">${fmtN.format(o.pedida)}</td>
                <td class="r">${brlShort(o.valor)}</td>
                <td class="r"><span class="hm-cell ${hmClass(pctRep)}">${pctStr}</span></td>
                <td class="r"><span class="badge-pill badge-lote">${fmtN.format(o.linhas)}</span></td>
              </tr>`;
            }).join('') : '<tr><td colspan="5">Nenhum tipo encontrado.</td></tr>'}
            <tr class="tot">
              <td>Total</td>
              <td class="r">${fmtN.format(totPedida)}</td>
              <td class="r">${brlShort(totValor)}</td>
              <td class="r" style="color:var(--accent-text)">100%</td>
              <td class="r" style="color:var(--accent-text)">${fmtN.format(totLinhasSep)}</td>
            </tr>
          </tbody>
        </table>
      </div>
      <div class="info-note">
        ${ICONS.info} <b>Nota Operacional:</b> Os fluxos de <b>Cross Docking</b> e <b>Full</b> permanecem listados como <b>Pendente</b> até a finalização completa, quando convertem diretamente para <b>Separado</b>.
      </div>
    </div>
  </div>

  <!-- 3. PARTICIPAÇÃO POR DEPARTAMENTO CD (CATEGORIAS) EMBAIXO -->
  <div class="card" style="margin-top:18px">
    <div class="card-header-action">
      <h3>${ICONS.chart} PARTICIPAÇÃO POR DEPARTAMENTO CD / CATEGORIA (${basis === 'custo' ? 'VALOR R$' : 'QTD PEDIDA'})</h3>
      <span style="font-size:13px;color:var(--mute);font-weight:600">Clique p/ filtrar</span>
    </div>
    <div class="dept-hbar-list">
      ${deptRows.length ? deptRows.map(([deptName, o], idx) => {
        const valMetric = basis === 'custo' ? o.valor : o.qtd;
        const pct = (valMetric / totDeptVal) * 100;
        const barW = maxDeptVal ? (valMetric / maxDeptVal) * 100 : 0;
        const isSel = isSelectedArr(deptFilter, deptName);
        const barColor = isSel ? 'var(--accent)' : (idx < 2 ? 'var(--blue)' : '#3a6bc7');
        return `
        <div class="dept-hbar-row ${isSel ? 'active-dept' : ''}" data-filter-dept="${esc(deptName)}" title="${esc(deptName)}: ${brl(o.valor)} | ${fmtN.format(o.qtd)} un. (${fmtP(pct, 2)})">
          <div class="dept-hbar-name">${esc(deptName)}</div>
          <div class="dept-hbar-track">
            <div class="dept-hbar-fill" style="width:${Math.max(barW, 2)}%;background:${barColor}"></div>
          </div>
          <div class="dept-hbar-val">
            <span style="color:var(--accent-text)">${fmtP(pct, 2)}</span>
            <span style="color:var(--mute);font-size:13px;margin-left:4px">${basis === 'custo' ? brlShort(o.valor).replace('R$ ','') : fmtN.format(o.qtd)}</span>
          </div>
        </div>`;
      }).join('') : '<p style="color:var(--mute)">Nenhum departamento encontrado.</p>'}
    </div>
  </div>

  <!-- 4. RESUMO POR LOJA / DESTINATÁRIO -->
  <div class="card" style="margin-top:18px">
    <div class="card-header-action">
      <h3>${ICONS.store} RESUMO DE SEPARAÇÃO POR LOJA / DESTINATÁRIO (${destRows.length} LOJAS)</h3>
      <button class="toggle-btn" id="btnToggleDest">
        ${destExpanded ? '▲ Ocultar Lojas' : '▼ Exibir Lojas / Destinos (' + destRows.length + ')'}
      </button>
    </div>

    <div class="collapsible-content ${destExpanded ? 'open' : ''}" id="boxDestinos">
      <div style="margin-bottom: 12px;">
        <input type="text" id="inputDestSearch" placeholder="Buscar loja / destino..." value="${esc(destSearch)}" style="width: 100%; max-width: 360px;" />
      </div>
      <div class="tw">
        <table>
          <thead>
            <tr>
              <th>Loja / Destinatário</th>
              <th class="r">Linhas</th>
              <th class="r">Paletes Full</th>
              <th class="r">Qtd Pedida</th>
              <th class="r">Qtd Separada</th>
              <th class="r">Valor Total</th>
              <th class="r">% Repr.</th>
            </tr>
          </thead>
          <tbody>
            ${destRows.length ? destRows.map(([k,o]) => {
              const isSelDest = isSelectedArr(targetDestFilter, k);
              const valMetric = basis === 'custo' ? o.valor : o.pedida;
              const pctDest = totResBase ? (valMetric / totResBase) * 100 : 0;
              return `
              <tr class="clickable-row ${isSelDest ? 'active-row' : ''}" data-filter-dest-row="${esc(k)}">
                <td><b>${esc(k)}</b></td>
                <td class="r">${fmtN.format(o.linhas)}</td>
                <td class="r">${o.fullLinhas > 0 ? `<span class="badge-pill badge-full">${fmtN.format(o.fullLinhas)}</span>` : '<span style="color:var(--mute)">0</span>'}</td>
                <td class="r" style="font-weight:700">${fmtN.format(o.pedida)}</td>
                <td class="r" style="color:${o.separada > 0 ? 'var(--ok)' : 'var(--mute)'}">${fmtN.format(o.separada)}</td>
                <td class="r">${brlShort(o.valor)}</td>
                <td class="r" style="color:var(--accent-text);font-weight:700">${fmtP(pctDest, 2)}</td>
              </tr>`;
            }).join('') : '<tr><td colspan="7">Nenhuma loja encontrada.</td></tr>'}
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- 5. PRODUTOS DA CARTEIRA -->
  <div class="card" style="margin-top:18px">
    <div class="card-header-action">
      <h3>${ICONS.box} ${statusTitleText} (${prodsList.length} PRODUTOS ÚNICOS SOMADOS)</h3>
      <button class="toggle-btn" id="btnToggleProds">
        ${prodExpanded ? '▲ Ocultar Produtos' : '▼ Exibir Produtos (' + prodsList.length + ')'}
      </button>
    </div>

    <div class="collapsible-content ${prodExpanded ? 'open' : ''}" id="boxProdutos">
      <div class="prod-controls" style="margin-bottom:12px">
        <select id="selectStatusFilter" style="font-weight:700;color:var(--accent-text)">
          <option value="pendente" ${statusFilter==='pendente'?'selected':''}>Status: Apenas Pendentes</option>
          <option value="separado" ${statusFilter==='separado'?'selected':''}>Status: Apenas Separados</option>
          <option value="todos" ${statusFilter==='todos'?'selected':''}>Status: Todos os Status</option>
        </select>
        <input type="text" id="inputProdSearch" placeholder="Buscar código / GTIN / produto..." value="${esc(prodSearch)}" style="width:260px" />
        <select id="selectProdSort">
          <option value="qtd" ${prodSortOrder==='qtd'?'selected':''}>Ordenar por Maior Qtd Pendente</option>
          <option value="linhas" ${prodSortOrder==='linhas'?'selected':''}>Ordenar por Maior Qtd Linhas / Paletes</option>
          <option value="pedida" ${prodSortOrder==='pedida'?'selected':''}>Ordenar por Maior Qtd Pedida Total</option>
          <option value="valor" ${prodSortOrder==='valor'?'selected':''}>Ordenar por Maior Valor (R$)</option>
        </select>
      </div>
      <div class="tw">
        <table>
          <thead>
            <tr>
              <th>Cód. Interno</th>
              <th>GTIN (EAN)</th>
              <th>Produto</th>
              <th>Tipo Separação</th>
              <th class="r">Linhas (Paletes)</th>
              <th class="r">Qtd Pedida Total</th>
              <th class="r">Qtd Separada</th>
              <th class="r">Qtd Pendente Total</th>
              <th class="r">Valor Pendente Estimado</th>
            </tr>
          </thead>
          <tbody>
            ${prodsList.length ? prodsList.map(p => `
              <tr>

/* ================= SETOR ADMINISTRATIVO ================= */
let AdminD = null;
let searchNotas = '';
let searchPre = '';
const CD_COD = '205';

let admFiltro = {sentido:[], mes:[], faixa:[], loja:[]};
let admVisao = 'itens';
let admOrdem = 'dias';
let admLimite = 150;

let preFiltro = {loja:[], situacao:[], tipo:[], mes:[], stCd:[], stLoja:[]};
let preOrdem = 'valor';
let preLimite = 150;

async function loadAdminData(){
  try {
    const timestamp = new Date().getTime();
    const res = await fetch(`${CONFIG.ADMIN_URL}?v=${timestamp}`);
    if (res.ok) AdminD = await res.json();
  } catch(e) {
    console.error("Erro ao carregar administrativo.json:", e);
  }
}

const sCod = v => String(v == null ? '' : v).trim().replace(/^0+(?=\d)/, '');
const locNome = cod => sCod(cod) === CD_COD ? 'CD 205' : getNomeLoja(cod);

function nfMes(d){
  const m = /^(\d{2})\/(\d{2})\/(\d{4})$/.exec(String(d || '').trim());
  return m ? `${m[2]}/${m[3]}` : 'Sem data';
}
function mesOrdem(k){
  const m = /^(\d{2})\/(\d{4})$/.exec(k);
  return m ? m[2] + m[1] : '9999';
}
function mesLabel(k){ return k === 'Sem data' ? k : getNomeMesAno(k); }

const SENT_LABEL = {saida:'CD 205 → Lojas', entrada:'Lojas → CD 205', outros:'Entre lojas / outros'};
function sentidoNota(n){
  if (sCod(n.origem) === CD_COD) return 'saida';
  if (sCod(n.destino) === CD_COD) return 'entrada';
  return 'outros';
}
const FAIXA_DIAS_LABEL = {'0-7':'0 a 7 dias','8-15':'8 a 15 dias','16-30':'16 a 30 dias','31-60':'31 a 60 dias','60+':'Acima de 60 dias'};
function faixaDias(d){
  d = +d || 0;
  if (d <= 7) return '0-7';
  if (d <= 15) return '8-15';
  if (d <= 30) return '16-30';
  if (d <= 60) return '31-60';
  return '60+';
}

function admNotasTodas(){ return (AdminD && AdminD.notas_transito) || []; }

function admNotasFiltradas(){
  return admNotasTodas().filter(n => {
    if (admFiltro.sentido.length > 0 && !hasArr(admFiltro.sentido, sentidoNota(n))) return false;
    if (admFiltro.mes.length > 0 && !hasArr(admFiltro.mes, nfMes(n.dataEmissao))) return false;
    if (admFiltro.faixa.length > 0 && !hasArr(admFiltro.faixa, faixaDias(n.dias))) return false;
    if (admFiltro.loja.length > 0 && !admFiltro.loja.some(l => [sCod(n.origem), sCod(n.destino)].includes(l))) return false;
    return true;
  });
}

function agruparNFs(linhas){
  const m = new Map();
  linhas.forEach(n => {
    let g = m.get(n.nf);
    if (!g) {
      g = {nf:n.nf, origem:n.origem, destino:n.destino, dataEmissao:n.dataEmissao, dias:n.dias || 0, valor:n.valorNota || 0, qtd:0, linhas:0, skus:new Set(), sentido:sentidoNota(n)};
      m.set(n.nf, g);
    }
    g.qtd += n.qtd || 0;
    g.linhas++;
    g.skus.add(n.codProd);
  });
  return Array.from(m.values());
}

function lojaNota(g){
  const o = sCod(g.origem), d = sCod(g.destino);
  if (o === CD_COD) return getNomeLoja(d);
  if (d === CD_COD) return getNomeLoja(o);
  return `${locNome(o)} → ${locNome(d)}`;
}

function periodoTexto(linhas){
  const meses = Array.from(new Set(linhas.map(n => nfMes(n.dataEmissao)))).filter(k => k !== 'Sem data').sort((a,b) => mesOrdem(a).localeCompare(mesOrdem(b)));
  if (!meses.length) return 'sem data';
  const abr = k => { const [m,y] = k.split('/'); return {m:(MAPA_MESES[m] || m).slice(0,3), y}; };
  const a = abr(meses[0]), b = abr(meses[meses.length-1]);
  if (meses.length === 1) return `${a.m}/${a.y}`;
  return a.y === b.y ? `${a.m} a ${b.m}/${a.y}` : `${a.m}/${a.y} a ${b.m}/${b.y}`;
}

function admAtualizadoTxt(){
  const t = AdminD && AdminD.ultimaAtualizacao;
  if (!t) return '';
  const d = new Date(t);
  return isNaN(d) ? '' : ` Base atualizada em ${d.toLocaleString('pt-BR', {day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit'})}.`;
}

function keepFocus(sel, getVal){
  const el = $(sel);
  if (el) { el.focus(); const v = getVal(); el.setSelectionRange(v.length, v.length); }
}

/* ---------- NOTAS EM TRÂNSITO ---------- */
function secTransito(){
  const el = $('#s-transito');
  if (!el) return;
  if (!AdminD) {
    el.innerHTML = `<h2>Notas em Trânsito</h2><p class="sub">Carregando dados do administrativo.json...</p>`;
    return;
  }

  const linhas = admNotasFiltradas();
  const nfs = agruparNFs(linhas);
  const totVal = nfs.reduce((s,g) => s + g.valor, 0);
  const antigas = nfs.filter(g => g.dias > 30).sort((a,b) => b.dias - a.dias);
  const totAntigas = antigas.reduce((s,g) => s + g.valor, 0);

  const porSent = {};
  ['saida','entrada','outros'].forEach(k => {
    const ls = linhas.filter(n => sentidoNota(n) === k);
    const g = agruparNFs(ls);
    porSent[k] = {k, nfs:g.length, skus:new Set(ls.map(n => n.codProd)).size, cx:ls.reduce((s,n) => s + (n.qtd || 0), 0), valor:g.reduce((s,x) => x + x.valor, 0), periodo:periodoTexto(ls)};
  });

  const q = searchNotas.trim().toLowerCase();
  const linhasBusca = q ? linhas.filter(n =>
    String(n.nf || '').toLowerCase().includes(q) ||
    String(n.origem || '').toLowerCase().includes(q) ||
    String(n.destino || '').toLowerCase().includes(q) ||
    locNome(n.origem).toLowerCase().includes(q) ||
    locNome(n.destino).toLowerCase().includes(q) ||
    String(n.codProd || '').toLowerCase().includes(q) ||
    String(n.prod || '').toLowerCase().includes(q)
  ) : linhas;

  const cmp = {
    dias:  (a,b) => (b.dias || 0) - (a.dias || 0),
    valor: (a,b) => ((b.valorNota !== undefined ? b.valorNota : b.valor) || 0) - ((a.valorNota !== undefined ? a.valorNota : a.valor) || 0),
    nf:    (a,b) => String(a.nf).localeCompare(String(b.nf), undefined, {numeric:true})
  }[admOrdem] || (() => 0);

  const porNF = admVisao === 'nf';
  const listaDet = (porNF ? agruparNFs(linhasBusca) : linhasBusca.slice()).sort(cmp);
  const mostradas = listaDet.slice(0, admLimite);
  const restam = listaDet.length - mostradas.length;

  const diasCor = d => d > 30 ? 'var(--crit)' : (d > 15 ? 'var(--warn)' : 'var(--text)');

  const linhasFluxo = ['saida','entrada','outros'].filter(k => porSent[k].nfs > 0).map(k => {
    const s = porSent[k];
    const cor = k === 'saida' ? 'var(--accent-text)' : (k === 'entrada' ? 'var(--ok)' : 'var(--blue)');
    return `<tr>
      <td><b>${SENT_LABEL[k]}</b><br><span style="color:var(--mute);font-size:13px">${esc(s.periodo)}</span></td>
      <td class="r">${fmtN.format(s.nfs)}</td>
      <td class="r">${fmtP(nfs.length ? s.nfs / nfs.length * 100 : 0, 0)}</td>
      <td class="r">${fmtN.format(s.skus)}</td>
      <td class="r">${fmtN.format(s.cx)}</td>
      <td class="r" style="color:${cor};font-weight:700">${brl(s.valor)}</td>
    </tr>`;
  }).join('');

  el.innerHTML = `
    <h2>Notas em Trânsito</h2>
    <p class="sub">Setor Administrativo · NFs emitidas e ainda sem entrada registrada.${esc(admAtualizadoTxt())}</p>

    <div class="grid kpis">
      ${kpi('Total em Trânsito', brlShort(totVal), `${fmtN.format(nfs.length)} NFs · ${fmtN.format(linhas.length)} itens`, 'hl')}
      <div class="card kpi"><h3>Notas Antigas Pendentes (>30D)</h3><div class="v" style="color:var(--crit)">${brlShort(totAntigas)}</div><div class="s">${fmtN.format(antigas.length)} NFs críticas acumuladas</div></div>
      <div class="card kpi"><h3>CD 205 → Lojas (${esc(porSent.saida.periodo)})</h3><div class="v" style="color:var(--blue)">${brlShort(porSent.saida.valor)}</div><div class="s">${fmtN.format(porSent.saida.nfs)} NFs | ${fmtN.format(porSent.saida.cx)} caixas</div></div>
      <div class="card kpi"><h3>Lojas → CD 205 (${esc(porSent.entrada.periodo)})</h3><div class="v" style="color:var(--ok)">${brlShort(porSent.entrada.valor)}</div><div class="s">${fmtN.format(porSent.entrada.nfs)} NFs | ${fmtN.format(porSent.entrada.cx)} caixas</div></div>
    </div>

    <div class="grid two" style="margin-top:20px">
      <div class="card">
        <h3>Fluxo de Transferências (CD 205)</h3>
        <div class="tw">
          <table>
            <thead><tr><th>Período</th><th class="r">QTD NF</th><th class="r">% QTD NF</th><th class="r">QTD SKU</th><th class="r">TT CX</th><th class="r">R$ Total</th></tr></thead>
            <tbody>
              ${linhasFluxo || '<tr><td colspan="6">Nenhuma nota com os filtros aplicados.</td></tr>'}
              <tr class="tot"><td><b>Total</b></td><td class="r">${fmtN.format(nfs.length)}</td><td class="r">100%</td><td class="r">${fmtN.format(new Set(linhas.map(n => n.codProd)).size)}</td><td class="r">${fmtN.format(linhas.reduce((s,n) => s + (n.qtd || 0), 0))}</td><td class="r" style="color:var(--accent-text)">${brl(totVal)}</td></tr>
            </tbody>
          </table>
        </div>
      </div>

      <div class="card">
        <h3>Notas Antigas Pendentes de Entrada (>30 dias)</h3>
        <div class="tw">
          <table>
            <thead><tr><th>Nota Fiscal</th><th>Loja</th><th>Data Emissão</th><th class="r">Dias</th><th class="r">Valor da Nota</th></tr></thead>
            <tbody>
              ${antigas.slice(0, 8).map(g => `
                <tr>
                  <td><b style="color:var(--accent-text)">${esc(g.nf)}</b></td>
                  <td>${esc(lojaNota(g))}</td>
                  <td>${esc(g.dataEmissao)}</td>
                  <td class="r" style="color:var(--crit);font-weight:700">${g.dias}</td>
                  <td class="r" style="font-weight:700">${brl(g.valor)}</td>
                </tr>`).join('') || '<tr><td colspan="5">Nenhuma nota antiga com os filtros aplicados.</td></tr>'}
              ${antigas.length > 8 ? `<tr><td colspan="5" style="color:var(--mute)">+ ${antigas.length - 8} NFs antigas (veja na tabela abaixo ordenando por "Mais antigas")</td></tr>` : ''}
              <tr class="tot"><td colspan="4"><b>Total Antigas Pendentes</b></td><td class="r" style="color:var(--crit)">${brl(totAntigas)}</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

    ${totAntigas > 0 ? `
    <div class="alert-banner">
      <div class="alert-banner-icon" style="color:var(--warn);display:flex">${ICONS.alert}</div>
      <div class="alert-banner-content">
        <h4>Atenção Operacional - Notas Antigas Pendentes</h4>
        <p>Identificamos <b>${brl(totAntigas)}</b> em ${fmtN.format(antigas.length)} notas fiscais antigas que ainda não tiveram entrada registrada. Solicitamos a regularização o quanto antes para garantir a acuracidade dos estoques.</p>
      </div>
    </div>` : ''}

    <div class="card" style="margin-top:20px">
      <div class="card-header-action">
        <h3>${ICONS.truck} NOTAS EM TRÂNSITO - DETALHAMENTO ANALÍTICO (${fmtN.format(listaDet.length)} ${porNF ? 'NFs' : 'LINHAS'})</h3>
        <div class="prod-controls">
          <select id="selAdmVisao" title="Visão">
            <option value="itens" ${!porNF ? 'selected' : ''}>Visão: por item</option>
            <option value="nf" ${porNF ? 'selected' : ''}>Visão: por NF</option>
          </select>
          <select id="selAdmOrdem" title="Ordenação">
            <option value="dias" ${admOrdem === 'dias' ? 'selected' : ''}>Ordem: mais antigas</option>
            <option value="valor" ${admOrdem === 'valor' ? 'selected' : ''}>Ordem: maior valor</option>
            <option value="nf" ${admOrdem === 'nf' ? 'selected' : ''}>Ordem: nº da NF</option>
          </select>
          <input type="text" id="inputSearchNotas" placeholder="Buscar NF, loja, produto..." value="${esc(searchNotas)}" style="width:260px">
        </div>
      </div>
      <div class="tw">
        <table>
          <thead>
            ${porNF ? `<tr><th>NF</th><th>Origem</th><th>Destino</th><th>Data Emissão</th><th class="r">Dias em Trânsito</th><th class="r">SKUs</th><th class="r">Qtd (cx)</th><th class="r">Valor da Nota</th></tr>`
                    : `<tr><th>NF</th><th>Origem</th><th>Destino</th><th>Data Emissão</th><th class="r">Dias em Trânsito</th><th>Cód. Prod</th><th>Descrição Produto</th><th class="r">Qtd</th><th class="r">Valor Nota Total</th></tr>`}
          </thead>
          <tbody>
            ${mostradas.length ? mostradas.map(n => porNF ? `
              <tr>
                <td><b style="color:var(--accent-text)">${esc(n.nf)}</b></td>
                <td>${esc(locNome(n.origem))}</td>
                <td><b>${esc(locNome(n.destino))}</b></td>
                <td>${esc(n.dataEmissao)}</td>
                <td class="r" style="color:${diasCor(n.dias)};font-weight:700">${n.dias} dias</td>

                <td class="r">${fmtN.format(n.qtd)}</td>
                <td class="r" style="font-weight:700">${brl(n.valor)}</td>
              </tr>` : `
              <tr>
                <td><b style="color:var(--accent-text)">${esc(n.nf)}</b></td>
                <td>${esc(locNome(n.origem))}</td>
                <td><b>${esc(locNome(n.destino))}</b></td>
                <td>${esc(n.dataEmissao)}</td>
                <td class="r" style="color:${diasCor(n.dias)};font-weight:700">${n.dias} dias</td>
                <td>${esc(n.codProd)}</td>
                <td>${esc(n.prod)}</td>
                <td class="r">${fmtN.format(n.qtd)}</td>

              </tr>`).join('') : `<tr><td colspan="${porNF ? 8 : 9}">Nenhuma nota encontrada.</td></tr>`}

  const inN = $('#inputSearchNotas');

}

/* ---------- PRÉ-ALERTA (SOBRA E FALTA) ---------- */
const isMoney = v => /^R\$/i.test(String(v == null ? '' : v).trim());
const toBR = v => {
  const t = String(v || '').trim().split(' ')[0].split('T')[0];
  if (/^\d{4}-\d{2}-\d{2}$/.test(t)) { const [y,m,d] = t.split('-'); return `${d}/${m}/${y}`; }
  return /^\d{2}\/\d{2}\/\d{4}$/.test(t) ? t : '';
};
const stTxt = v => String(v == null ? '' : v).trim().toUpperCase();

function normPre(p){
  const novo = ('ocorrencia' in p) || ('carimboDataHora' in p);
  const antigoDesloc = !novo && isMoney(p.statusCd) && isMoney(p.statusLoja) && !(+p.valorTotal);
  let r;
  if (novo) {
    const qtd = parseNum(p.qtd), vu = parseNum(p.valorUnitario);
    let vt = parseNum(p.valorTotal);
    if (!vt && qtd && vu) vt = qtd * vu;
    const t = stTxt(p.ocorrencia);
    r = {
      data: toBR(p.carimboDataHora),
      dias: +p.diasSemRetorno || 0,
      loja: String(p.loja || '').trim(),
      pedido: String(p.pedido || '').trim(),
      dataEmissao: toBR(p.dataEmissao),
      nf: String(p.nf || '').trim(),
      codProd: String(p.codProd || '').trim(),
      prod: String(p.prod || '').trim(),
      qtd, un: String(p.um || '').trim(),
      tipo: (t === 'SOBRA' || t === 'FALTA') ? t : '',
      valorUnit: vu, valor: vt,
      origem: String(p.origem || '').trim(),
      statusCd: stTxt(p.statusCd), statusLoja: stTxt(p.statusLoja),
      obs: String(p.observacao || '').trim()
    };
  } else if (antigoDesloc) {
    r = {data:'', dias:0, loja:String(p.pedido || '').trim(), pedido:String(p.dataRegistro || '').trim(), dataEmissao:'', nf:String(p.nf || '').trim(),
      codProd:String(p.qtd || '').trim(), prod:String(p.um || '').trim(), qtd:parseNum(p.tipo), un:'', tipo:'', valorUnit:parseNum(p.statusCd), valor:parseNum(p.statusLoja),
      origem:'', statusCd:'', statusLoja:'', obs:String(p.prod || '').trim()};
  } else {
    const t = stTxt(p.tipo), rawLoja = String(p.loja || '').trim();
    r = {data:toBR(p.dataRegistro), dias:0, loja:/^\d+$/.test(rawLoja) ? getNomeLoja(rawLoja) : rawLoja, pedido:String(p.pedido || '').trim(), dataEmissao:'', nf:String(p.nf || '').trim(),
      codProd:String(p.codProd || '').trim(), prod:String(p.prod || '').trim(), qtd:parseNum(p.qtd), un:String(p.um || '').trim(), tipo:(t === 'SOBRA' || t === 'FALTA') ? t : '',
      valorUnit:0, valor:parseNum(p.valorTotal), origem:'', statusCd:stTxt(p.statusCd), statusLoja:stTxt(p.statusLoja), obs:''};
  }
  r.loja = r.loja || 'Sem loja';
  r.mes = r.data ? nfMes(r.data) : 'Sem data';
  const txt = `${r.nf} ${r.pedido} ${antigoDesloc ? r.obs : ''}`.toUpperCase();
  if (txt.includes('SEM NOTA')) r.situacao = 'Sem nota fiscal';
  else if (txt.includes('SEM PEDIDO')) r.situacao = 'Sem pedido';
  else if (!r.nf || r.nf === '*') r.situacao = 'NF não informada';
  else r.situacao = 'Com NF informada';
  return r;
}

function preTodas(){ return ((AdminD && AdminD.pre_alerta) || []).map(normPre); }
function preFiltradas(){
  const f = preFiltro;
  return preTodas().filter(r =>
    hasArr(f.loja, r.loja) &&
    hasArr(f.situacao, r.situacao) &&
    hasArr(f.tipo, r.tipo) &&
    hasArr(f.mes, r.mes) &&
    hasArr(f.stCd, r.statusCd) &&
    hasArr(f.stLoja, r.statusLoja)
  );
}

  const porLoja = agrup(r => r.loja).sort((a,b) => b[1].valor - a[1].valor);

    valor: (a,b) => b.valor - a.valor,

              <tr class="tot"><td><b>Total Geral</b></td><td class="r" style="color:var(--accent-text)">${brl(tot)}</td><td class="r">${fmtN.format(lojasSet.size)}</td></tr>

      <div class="card">

          <table>
            <thead><tr><th>Status Ocorrência (CD)</th><th class="r">Ocorr.</th><th class="r">Valor Total R$</th></tr></thead>
            <tbody>

                  <td><b style="color:${stCor(k)}">${esc(k)}</b></td><td class="r">${fmtN.format(o.n)}</td><td class="r" style="color:${stCor(k)};font-weight:700">${brl(o.valor)}</td>

              <tr class="tot"><td><b>Total Geral Auditado</b></td><td class="r">${fmtN.format(rows.length)}</td><td class="r" style="color:var(--accent-text)">${brl(tot)}</td></tr>

                <td>${esc(r.codProd)}</td>
                <td>${esc(r.prod)}</td>
                <td class="r">${fmtN.format(r.qtd)} ${esc(r.un)}</td>
                <td class="r" style="font-weight:700">${brl(r.valor)}</td>
                ${temStatus ? `<td><b style="color:${stCor(r.statusCd || 'SEM STATUS')}">${esc(r.statusCd)}</b></td><td><b style="color:${stCor(r.statusLoja || 'SEM STATUS')}">${esc(r.statusLoja)}</b></td>` : ''}
                ${temExtra ? `<td>${esc(r.origem)}</td><td class="r" style="color:${r.dias > 7 ? 'var(--crit)' : 'var(--text)'};font-weight:700">${r.dias}</td><td>${esc(r.obs)}</td>` : ''}
              </tr>`).join('') : `<tr><td colspan="${nCols}">Nenhuma ocorrência encontrada.</td></tr>`}
          </tbody>
        </table>
      </div>
      ${restam > 0 ? `<div style="text-align:center;margin-top:12px"><button class="btn-more" id="btnMorePre">Mostrar mais 150 (restam ${fmtN.format(restam)})</button></div>` : ''}
    </div>
  `;

  const toggle = (attr, key) => document.querySelectorAll(`[${attr}]`).forEach(tr => tr.addEventListener('click', () => {
    const k = tr.getAttribute(attr);
    toggleArr(preFiltro[key], k);
    preLimite = 150; secPreAlerta();
  }));
  toggle('data-pre-loja', 'loja');
  toggle('data-pre-sit', 'situacao');

  });
  const bm = $('#btnMorePre');
  if (bm) bm.addEventListener('click', () => { preLimite += 150; secPreAlerta(); });
}

/* ================= SETOR RECEBIMENTO ================= */
let RecebD = null;
let searchRecNotas = '';
let searchRecVerba = '';
let searchSemVerba = '';
let recFiltro = {mes:[], loja:[], tipoCarga:[], statusNota:[], tipoOp:[], fornecedor:[], pagaVerba:'todos'};
let recOrdem = 'valor';
let recLimite = 150;
let verbaOrdem = 'verba';
let verbaLimite = 150;
let semVerbaOrdem = 'valor';
let semVerbaLimite = 150;
let semVerbaExpanded = true;

async function loadRecebimentoData(){
  try {
    const timestamp = new Date().getTime();
    const res = await fetch(`${CONFIG.RECEBIMENTO_URL}?v=${timestamp}`);
    if (res.ok) RecebD = await res.json();
  } catch(e) {
    console.error("Erro ao carregar recebimento.json:", e);
  }
}

function recNotasTodas(){
  const raw = (RecebD && (RecebD.notas_recebimento || RecebD.notas || RecebD.data)) || [];
  return raw.map(n => {
    const dtRec = String(n.dataRecebimento || n['Data de Recebimento/Saída'] || n.dataEmissao || n['Data de Emissão'] || '').trim();
    const dtEmi = String(n.dataEmissao || n['Data de Emissão'] || '').trim();
    const mesRef = nfMes(dtRec || dtEmi);
    const lojaRaw = String(n.loja || n.Loja || '').trim();
    const lojaClean = lojaRaw.replace(/\.0$/, '');
    const lojaNome = lojaClean === '205' ? 'CD 205 - ROLDÃO' : (/^\d+$/.test(lojaClean) ? getNomeLoja(lojaClean) : (lojaClean || 'Sem Loja'));
    const valNf = parseNum(n.valorNf != null ? n.valorNf : n['Valor NF']);
    const valRec = parseNum(n.valorRecebido != null ? n.valorRecebido : n['Valor Recebido']) || valNf;
    let vPct = parseNum(n.verbaPct != null ? n.verbaPct : n['Verba logistica']);
    const vVal = n.verbaValor != null ? parseNum(n.verbaValor) : (valRec * (vPct / 100));
    const temVerba = (vVal > 0.005 || vPct > 0);
    const fornRaw = String(n.fornecedor || n['Fornecedor/Loja'] || n['Emitente/Destinatário'] || 'NÃO INFORMADO').trim();
    const statusNotaRaw = String(n.statusNota || n['Status da Nota Fiscal'] || '').trim() || 'Não informado';
    const statusNfeRaw = String(n.statusNfe || n['Status NF-e'] || '').trim();
    return {
      dataEmissao: dtEmi,
      dataRecebimento: dtRec,
      mes: mesRef,
      loja: lojaNome,
      tipoNota: String(n.tipoNota || n['Tipo de Nota Fiscal'] || '').trim(),
      tipoOperacao: String(n.tipoOperacao || n['Tipo de Operação'] || '').trim() || 'Não informado',
      cfop: String(n.cfop || n.CFOP || '').trim(),
      fornecedor: fornRaw,
      cnpj: String(n.cnpj || n.CNPJ || '').trim(),
      nf: String(n.nf || n.NF || '').replace(/\.0$/, '').trim(),
      serie: String(n.serie || n['Série'] || '').replace(/\.0$/, '').trim(),
      statusNfe: statusNfeRaw,
      statusNota: statusNotaRaw,
      valorNf: valNf,
      valorLiquido: parseNum(n.valorLiquido != null ? n.valorLiquido : n['Valor Liquido']),
      valorCompra: parseNum(n.valorCompra != null ? n.valorCompra : n['Valor NF Compra']),
      valorBonificada: parseNum(n.valorBonificada != null ? n.valorBonificada : n['Valor NF Bonificada']),
      usuario: String(n.usuario || n['Usuário'] || '').trim(),
      usuarioConfirmacao: String(n.usuarioConfirmacao || n['Usuário Confirmação'] || '').trim(),
      tipoCarga: String(n.tipoCarga || n['Tipo de Carga'] || 'FORNECEDOR').trim().toUpperCase(),
      valorRecebido: valRec,
      verbaPct: vPct,
      verbaValor: vVal,
      temVerba: temVerba,
      qtdFaturado: parseNum(n.qtdFaturado != null ? n.qtdFaturado : n['Qtd Faturado'])
    };
  });
}

function recNotasFiltradas(){
  return recNotasTodas().filter(n => {
    if (recFiltro.mes.length > 0 && !hasArr(recFiltro.mes, n.mes)) return false;
    if (recFiltro.loja.length > 0 && !hasArr(recFiltro.loja, n.loja)) return false;
    if (recFiltro.tipoCarga.length > 0 && !hasArr(recFiltro.tipoCarga, n.tipoCarga)) return false;
    if (recFiltro.statusNota.length > 0 && !hasArr(recFiltro.statusNota, n.statusNota)) return false;
    if (recFiltro.tipoOp.length > 0 && !hasArr(recFiltro.tipoOp, n.tipoOperacao)) return false;
    if (recFiltro.fornecedor.length > 0 && !hasArr(recFiltro.fornecedor, n.fornecedor)) return false;
    if (recFiltro.pagaVerba === 'sim' && !n.temVerba) return false;
    if (recFiltro.pagaVerba === 'nao' && n.temVerba) return false;
    return true;
  });
}

function recAtualizadoTxt(){
  const t = RecebD && RecebD.ultimaAtualizacao;
  if (!t) return '';
  const d = new Date(t);
  return isNaN(d) ? '' : ` Base atualizada em ${d.toLocaleString('pt-BR', {day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit'})}.`;
}

/* ---------- SUB-ABA 1: NOTAS DE RECEBIMENTO ---------- */
function secRecebNotas(){
  const el = $('#s-recebnotas');
  if (!el) return;
  if (!RecebD) {
    el.innerHTML = `<h2>Notas de Recebimento</h2><p class="sub">Carregando dados do recebimento.json...</p>`;
    return;
  }

  const notas = recNotasFiltradas();
  const totValNf = notas.reduce((s,n) => s + n.valorNf, 0);
  const totValRec = notas.reduce((s,n) => s + n.valorRecebido, 0);
  const totVerba = notas.reduce((s,n) => s + n.verbaValor, 0);
  const totQtd = notas.reduce((s,n) => s + n.qtdFaturado, 0);

  const notasComVerba = notas.filter(n => n.temVerba);
  const notasSemVerba = notas.filter(n => !n.temVerba);
  const valComVerba = notasComVerba.reduce((s,n) => s + n.valorRecebido, 0);
  const valSemVerba = notasSemVerba.reduce((s,n) => s + n.valorRecebido, 0);

  const fornAllSet = new Set(notas.map(n => n.fornecedor).filter(Boolean));
  const fornPagamSet = new Set(notasComVerba.map(n => n.fornecedor).filter(Boolean));
  const fornNaoPagamList = Array.from(fornAllSet).filter(f => !fornPagamSet.has(f));

  const porMesMap = {};
  notas.forEach(n => {
    const k = n.mes || 'Sem data';

              <tr class="tot"><td><b>Total</b></td><td class="r">${fmtN.format(notas.length)}</td><td class="r" style="color:var(--accent-text)">${brl(totValRec)}</td><td class="r" style="color:var(--ok)">${brl(totVerba)}</td><td class="r">${fmtP(totValRec ? (totVerba / totValRec) * 100 : 0, 2)}</td></tr>

            <tbody>
              ${porLoja.map(l => `

            <tbody>
              ${porCarga.map(c => `
                <tr class="clickable-row ${isSelectedArr(recFiltro.tipoCarga, c.tipo) ? 'active-row' : ''}" data-rec-carga="${esc(c.tipo)}">
                  <td><b>${esc(c.tipo)}</b></td>

                  <td class="r" style="font-weight:700">${brl(c.valorRec)}</td>
                  <td class="r">${fmtP(totValRec ? (c.valorRec / totValRec) * 100 : 0)}</td>
                </tr>`).join('')}
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <div class="card" style="margin-top:20px">
      <div class="card-header-action">
        <h3>${ICONS.doc} NOTAS FISCAIS DE RECEBIMENTO (${fmtN.format(lista.length)} NFs)</h3>
        <div class="prod-controls">
          <select id="selRecOrdem">
            <option value="valor" ${recOrdem === 'valor' ? 'selected' : ''}>Ordem: maior valor recebido</option>
            <option value="verba" ${recOrdem === 'verba' ? 'selected' : ''}>Ordem: maior verba R$</option>
            <option value="data" ${recOrdem === 'data' ? 'selected' : ''}>Ordem: recebimento mais recente</option>
            <option value="nf" ${recOrdem === 'nf' ? 'selected' : ''}>Ordem: nº da NF</option>
          </select>
          <input type="text" id="inputSearchRecNotas" placeholder="Buscar NF, fornecedor, loja, operação..." value="${esc(searchRecNotas)}" style="width:280px">
        </div>
      </div>
      <div class="tw">
        <table>
          <thead>
            <tr>
              <th>NF / Série</th>
              <th>Recebimento</th>
              <th>Loja</th>
              <th>Fornecedor</th>
              <th>Operação</th>
              <th>Verba?</th>
              <th class="r">Valor Recebido</th>
              <th class="r">% Verba</th>
              <th class="r">Verba R$</th>
            </tr>
          </thead>
          <tbody>
            ${mostradas.length ? mostradas.map(n => `
              <tr>
                <td><b style="color:var(--accent-text)">${esc(n.nf)}</b>${n.serie ? `<span style="color:var(--mute);font-size:13px"> / ${esc(n.serie)}</span>` : ''}</td>
                <td>${esc(n.dataRecebimento || n.dataEmissao)}</td>
                <td><b>${esc(n.loja)}</b></td>
                <td>${esc(n.fornecedor)}</td>
                <td>${esc(n.tipoOperacao)}</td>
                <td>${n.temVerba ? '<span class="badge-pill badge-verba-sim">SIM</span>' : '<span class="badge-pill badge-verba-nao">NÃO</span>'}</td>
                <td class="r" style="font-weight:700">${brl(n.valorRecebido)}</td>
                <td class="r">${fmtP(n.verbaPct, 2)}</td>
                <td class="r" style="color:${n.temVerba ? 'var(--ok)' : 'var(--mute)'};font-weight:700">${brl(n.verbaValor)}</td>
              </tr>`).join('') : '<tr><td colspan="9">Nenhuma nota encontrada.</td></tr>'}
          </tbody>
        </table>
      </div>
      ${restam > 0 ? `<div style="text-align:center;margin-top:12px"><button class="btn-more" id="btnMoreRecNotas">Mostrar mais 150 (restam ${fmtN.format(restam)})</button></div>` : ''}

  `;

  const bindToggle = (attr, key) => document.querySelectorAll(`[${attr}]`).forEach(el => el.addEventListener('click', () => {

    secRecebNotas();

  bindToggle('data-rec-mes', 'mes');
  bindToggle('data-rec-carga', 'tipoCarga');
  bindToggle('data-rec-op', 'tipoOp');

  document.querySelectorAll('[data-rec-pagaverba]').forEach(el => el.addEventListener('click', () => {

  const inS = $('#inputSearchRecNotas');

    keepFocus('#inputSearchRecNotas', () => searchRecNotas);
  });
  const bm = $('#btnMoreRecNotas');
  if (bm) bm.addEventListener('click', () => { recLimite += 150; secRecebNotas(); });
  attachTooltipEvents();
}

/* ---------- SUB-ABA 2: VERBA LOGÍSTICA ---------- */
function secRecebVerba(){
  const el = $('#s-recebverba');
  if (!el) return;
  if (!RecebD) {
    el.innerHTML = `<h2>Verba Logística</h2><p class="sub">Carregando dados do recebimento.json...</p>`;
    return;
  }

  const notas = recNotasFiltradas();
  const notasComVerba = notas.filter(n => n.temVerba);
  const totValRec = notas.reduce((s,n) => s + n.valorRecebido, 0);
  const totBaseVerba = notasComVerba.reduce((s,n) => s + n.valorRecebido, 0);
  const totVerba = notas.reduce((s,n) => s + n.verbaValor, 0);
  const pctMedioGeral = totValRec ? (totVerba / totValRec) * 100 : 0;
  const pctMedioComVerba = totBaseVerba ? (totVerba / totBaseVerba) * 100 : 0;

  const porFornMap = {};
  notas.forEach(n => {
    const k = n.fornecedor;
    porFornMap[k] = porFornMap[k] || {
      fornecedor: k,
      cnpj: n.cnpj,
      nfs: 0,
      nfsComVerba: 0,
      nfsSemVerba: 0,
      qtd: 0,
      valorRec: 0,
      valorRecComVerba: 0,
      valorRecSemVerba: 0,
      verba: 0,
      ultimaData: ''
    };
    const o = porFornMap[k];
    o.nfs++;
    o.qtd += n.qtdFaturado;
    o.valorRec += n.valorRecebido;
    o.verba += n.verbaValor;
    if (n.temVerba) {
      o.nfsComVerba++;
      o.valorRecComVerba += n.valorRecebido;
    } else {
      o.nfsSemVerba++;
      o.valorRecSemVerba += n.valorRecebido;
    }
    if (!o.cnpj && n.cnpj) o.cnpj = n.cnpj;
    const dt = n.dataRecebimento || n.dataEmissao;
    if (dt && (!o.ultimaData || dt.split('/').reverse().join('') > o.ultimaData.split('/').reverse().join(''))) {
      o.ultimaData = dt;
    }
  });

  const todosFornecedores = Object.values(porFornMap);
  const fornPagam = todosFornecedores.filter(f => f.verba > 0 || f.nfsComVerba > 0).sort((a,b) => b.verba - a.verba);
  const fornNaoPagam = todosFornecedores.filter(f => f.verba <= 0 && f.nfsComVerba === 0);

  const porMesMap = {};
  notas.forEach(n => {
    const k = n.mes || 'Sem data';
    porMesMap[k] = porMesMap[k] || {mes:k, nfs:0, valorRec:0, verba:0};
    porMesMap[k].nfs++;
    porMesMap[k].valorRec += n.valorRecebido;
    porMesMap[k].verba += n.verbaValor;
  });
  const porMes = Object.values(porMesMap).sort((a,b) => mesOrdem(a.mes).localeCompare(mesOrdem(b.mes)));
  const maxMesVerba = porMes.length ? Math.max(...porMes.map(m => m.verba)) * 1.2 : 1;

  const topFornChart = fornPagam.slice(0, 12);
  const maxFornVerba = topFornChart.length ? Math.max(...topFornChart.map(f => f.verba)) : 1;

  const qSem = searchSemVerba.trim().toLowerCase();
  const buscaSem = qSem ? fornNaoPagam.filter(f =>
    f.fornecedor.toLowerCase().includes(qSem) ||
    f.cnpj.toLowerCase().includes(qSem)
  ) : fornNaoPagam;

  const cmpSem = {
    valor: (a,b) => b.valorRec - a.valorRec,
    nfs:   (a,b) => b.nfs - a.nfs,
    nome:  (a,b) => a.fornecedor.localeCompare(b.fornecedor)
  }[semVerbaOrdem] || (() => 0);

  const listaSemVerba = buscaSem.slice().sort(cmpSem);
  const mostradosSem = listaSemVerba.slice(0, semVerbaLimite);
  const restamSem = listaSemVerba.length - mostradosSem.length;
  const totValFornNaoPagam = fornNaoPagam.reduce((s,f) => s + f.valorRec, 0);

  const q = searchRecVerba.trim().toLowerCase();
  const baseLista = notasComVerba.length ? notasComVerba : notas;
  const busca = q ? baseLista.filter(n =>
    n.fornecedor.toLowerCase().includes(q) ||
    n.loja.toLowerCase().includes(q) ||
    n.nf.toLowerCase().includes(q) ||
    n.cnpj.toLowerCase().includes(q)
  ) : baseLista;

  const cmp = {
    verba: (a,b) => b.verbaValor - a.verbaValor,
    pct:   (a,b) => b.verbaPct - a.verbaPct,
    valor: (a,b) => b.valorRecebido - a.valorRecebido
  }[verbaOrdem] || (() => 0);

  const lista = busca.slice().sort(cmp);
  const mostradas = lista.slice(0, verbaLimite);
  const restam = lista.length - mostradas.length;
  const dica = '<span style="color:var(--mute);font-weight:500;font-size:13px">(clique para filtrar)</span>';

  el.innerHTML = `
    <h2>Verba Logística · Dashboard & Fornecedores</h2>
    <p class="sub">Setor Recebimento · Apuração de verba logística, evolução mensal, ranking de pagantes e fornecedores sem verba.${esc(recAtualizadoTxt())}</p>

    <div class="grid kpis">
      ${kpi('Verba Logística Total', `<span style="color:var(--ok)">${brlShort(totVerba)}</span>`, `${brl(totVerba)} · Média geral ${fmtP(pctMedioGeral, 2)}`, 'hl')}
      ${kpi('% Verba (NFs Pagantes)', `<span style="color:var(--blue)">${fmtP(pctMedioComVerba, 2)}</span>`, `${fmtN.format(notasComVerba.length)} NFs (${brlShort(totBaseVerba)})`)}
      ${kpi('Fornecedores Pagantes', `<span style="color:var(--ok)">${fmtN.format(fornPagam.length)}</span>`, `De ${fmtN.format(todosFornecedores.length)} fornecedores ativos`)}
      ${kpi('Fornecedores SEM Verba', `<span style="color:var(--crit)">${fmtN.format(fornNaoPagam.length)}</span>`, `Volume: ${brlShort(totValFornNaoPagam)} (${fmtP(totValRec ? (totValFornNaoPagam / totValRec) * 100 : 0, 1)})`, 'hl')}
    </div>

    <div class="grid two" style="margin-top:20px">
      <div class="card">
        <h3>${ICONS.chart} Evolução Mensal da Verba Logística (R$) ${dica}</h3>
        ${porMes.length ? `
          <div class="bar-chart-container" style="height:285px;padding-top:55px">
            <div class="bar-chart-wrapper">
              ${porMes.map((m, idx) => {
                const pctH = (m.verba / maxMesVerba) * 100;

//* ================= SETOR SEPARAÇÃO (SEPARAÇÃO FRACIONADO & FULL) ================= */
let SepD = null;
let sepManifesto = null;
let sepMesesDisponiveis = [];
let sepMesSelecionado = ''; // ex: "2026_11" ou "TODOS"
let sepCacheMeses = {};
let sepDadosFiltro = { operacao: [], turno: [], data: [], loja: [], operador: [] };
let searchSepAnual = '';
let searchSepOp = '';
let sepAnualOrdem = 'qtd';
let sepOpOrdem = 'hh';
let sepAnualLimite = 150;
let sepAnualModalidade = 'TODAS'; // 'TODAS' | 'Separação Fracionado' | 'Full'
let sepAnualCarregando = false;
let sepHoraModo = 'COMPARATIVO'; // 'COMPARATIVO' | 'ATUAL' | 'ANTERIOR'
let sepHoraFluxoGrafico = 'FRAC'; // 'FRAC' | 'FULL'

function normalizarOpSep(op) {
  const s = String(op || '').trim();
  const low = s.toLowerCase();
  if (!s) return 'Separação Fracionado';
  if (low.includes('full') || low.includes('pulm') || low.includes('palet')) return 'Full';
  if (low.includes('frac') || low.includes('pick') || low.includes('cross') || low.includes('bloc')) return 'Separação Fracionado';
  return 'Separação Fracionado';
}

function isFullOp(op) {
  return normalizarOpSep(op) === 'Full';
}

function medicaoPrincipalReg(r) {
  return isFullOp(r.operacao) ? 1 : (r.qtd || 0);
}

function labelUnidadeOp(op) {
  return isFullOp(op) ? 'paletes (linhas)' : 'caixas';
}

function siglaUnidadeOp(op) {
  return isFullOp(op) ? 'plt' : 'cx';
}

function formatarChaveMesSep(chave) {
  if (!chave) return '';
  if (chave === 'TODOS') return 'Todos os Meses (Ano Completo)';
  const parts = String(chave).split('_');
  if (parts.length === 2) {
    const mesNome = MAPA_MESES[parts[1]] || parts[1];
    return `${mesNome}/${parts[0]}`;
  }
  return chave;
}

function extrairMesChaveDeData(dtStr) {
  const m = /^(\d{2})\/(\d{2})\/(\d{4})$/.exec(String(dtStr || '').trim());
  return m ? `${m[3]}_${m[2]}` : 'Sem_Data';
}

function chaveDataOrdenavel(dtStr) {
  const m = /^(\d{2})\/(\d{2})\/(\d{4})$/.exec(String(dtStr || '').trim());
  if (m) return `${m[3]}${m[2]}${m[1]}`;
  const parts = String(dtStr || '').split('/');
  if (parts.length === 3) return parts.slice().reverse().join('');
  return String(dtStr || '');
}

function getDatasOrdenadasDesc(rows) {
  return Array.from(new Set(rows.map(r => r.data).filter(Boolean)))
    .sort((a, b) => chaveDataOrdenavel(b).localeCompare(chaveDataOrdenavel(a)));
}

function descompactarArquivoSep(j, opPadrao) {
  const opNome = normalizarOpSep(j.operacao || opPadrao);
  if (Array.isArray(j.colunas) && Array.isArray(j.dados)) {
    const cols = j.colunas;
    const idx = {};
    cols.forEach((c, i) => { idx[c] = i; });
    return j.dados.map(row => {
      const qtd = parseNum(row[idx.qtd]);
      const dataStr = row[idx.data] || '';
      return {
        data: dataStr,
        mesChave: extrairMesChaveDeData(dataStr),
        turno: row[idx.turno] || '',
        operacao: opNome,
        lojaCd: row[idx.lojaCd] || '205',
        lojaDestino: row[idx.lojaDestino] || '',
        ordemServico: row[idx.ordemServico] || '',
        dataHoraInicio: row[idx.dataHoraInicio] || '',
        dataHoraFim: row[idx.dataHoraFim] || '',
        tempoPausado: row[idx.tempoPausado] || '00:00',
        tempoTotal: row[idx.tempoTotal] || '00:00',
        operador: row[idx.operador] || 'Não identificado',
        hora: +row[idx.hora] || 0,
        qtd: qtd,
        qtdConferida: parseNum(row[idx.qtdConferida] != null ? row[idx.qtdConferida] : qtd),
        qtdPedida: parseNum(row[idx.qtdPedida] != null ? row[idx.qtdPedida] : qtd),
        peso: parseNum(row[idx.peso]),
        unitizadores: parseNum(row[idx.unitizadores]),
        itens: parseNum(row[idx.itens])
      };
    });
  }
  return (j.registros || []).map(r => {
    const qtd = parseNum(r.qtd);
    const dataStr = r.data || '';
    return {
      ...r,
      data: dataStr,
      mesChave: extrairMesChaveDeData(dataStr),
      operacao: normalizarOpSep(r.operacao || opPadrao),
      qtd: qtd,
      qtdConferida: parseNum(r.qtdConferida != null ? r.qtdConferida : qtd),
      qtdPedida: parseNum(r.qtdPedida != null ? r.qtdPedida : qtd),
      peso: parseNum(r.peso),
      unitizadores: parseNum(r.unitizadores),
      itens: parseNum(r.itens),
      hora: +r.hora || 0
    };
  });
}

async function baixarMesesParaCache(listaMeses) {
  if (!sepManifesto || !sepManifesto.operacoes) return;
  const timestamp = new Date().getTime();
  const fetchOpts = { method: 'GET', headers: { 'Cache-Control': 'no-cache' } };
  const promessas = [];

  listaMeses.forEach(m => {
    if (sepCacheMeses[m] && m !== sepMesesDisponiveis[0]) return;
    const listaArquivosMes = [];
    Object.values(sepManifesto.operacoes).forEach(opObj => {
      const infoMes = opObj.meses && opObj.meses[m];
      if (infoMes && Array.isArray(infoMes.arquivos)) {
        infoMes.arquivos.forEach(arq => listaArquivosMes.push({ path: arq, op: normalizarOpSep(opObj.operacao) }));
      }
    });

    promessas.push((async () => {
      const resultados = await Promise.all(listaArquivosMes.map(async item => {
        const cleanPath = item.path.startsWith('./') ? item.path : `./${item.path}`;
        const res = await fetch(`${cleanPath}?v=${timestamp}`, fetchOpts).catch(() => null);
        if (!res || !res.ok) return { regs: [], metas: null, att: '' };
        const j = await res.json();
        return {
          regs: descompactarArquivoSep(j, item.op),
          metas: j.metas || null,
          att: j.ultimaAtualizacao || ''
        };
      }));
      sepCacheMeses[m] = resultados;
    })());
  });

  await Promise.all(promessas);
}

async function carregarMesSep(chaveMes) {
  if (!sepManifesto || !sepManifesto.operacoes) return;
  const mesesParaCarregar = chaveMes === 'TODOS' ? sepMesesDisponiveis : [chaveMes];
  await baixarMesesParaCache(mesesParaCarregar);

  const todosRegs = [];
  let metasEncontradas = null;
  let ultimaAtt = sepManifesto.ultimaAtualizacao || '';

  mesesParaCarregar.forEach(m => {
    const blocos = sepCacheMeses[m] || [];
    blocos.forEach(b => {
      for (let i = 0; i < b.regs.length; i++) todosRegs.push(b.regs[i]);
      if (!metasEncontradas && b.metas) metasEncontradas = b.metas;
      if (b.att && b.att > ultimaAtt) ultimaAtt = b.att;
    });
  });

  SepD = {
    todos: todosRegs,
    metas: metasEncontradas || { hh: 100, hhFull: 15, hhPulmao: 15, horasTurno: 7 },
    ultimaAtualizacao: ultimaAtt
  };
}

async function garantirTodosMesesSep() {
  if (!sepManifesto || !sepMesesDisponiveis.length) return;
  const faltando = sepMesesDisponiveis.filter(m => !sepCacheMeses[m]);
  if (!faltando.length) return;
  sepAnualCarregando = true;
  await baixarMesesParaCache(faltando);
  sepAnualCarregando = false;
}

async function trocarMesSep(novoMes) {
  if (!novoMes || novoMes === sepMesSelecionado) return;
  sepMesSelecionado = novoMes;
  sepDadosFiltro.data = [];
  sepAnualLimite = 150;
  $('#srctxt').textContent = `Carregando ${formatarChaveMesSep(novoMes)}...`;
  await carregarMesSep(novoMes);
  if (D && D.when) $('#srctxt').textContent = D.when;
  render();
}

async function loadSeparacaoData() {
  try {
    const timestamp = new Date().getTime();
    const fetchOpts = { method: 'GET', headers: { 'Cache-Control': 'no-cache' } };
    const resMan = await fetch(`${CONFIG.SEP_MANIFESTO_URL}?v=${timestamp}`, fetchOpts).catch(() => null);

    if (resMan && resMan.ok) {
      sepManifesto = await resMan.json();
      const setMeses = new Set();
      if (sepManifesto && sepManifesto.operacoes) {
        Object.values(sepManifesto.operacoes).forEach(opObj => {
          if (opObj && opObj.meses) {
            Object.keys(opObj.meses).forEach(m => setMeses.add(m));
          }
        });
      }
      sepMesesDisponiveis = Array.from(setMeses).sort((a, b) => b.localeCompare(a));

      if (sepMesesDisponiveis.length > 0) {
        if (!sepMesSelecionado || (sepMesSelecionado !== 'TODOS' && !sepMesesDisponiveis.includes(sepMesSelecionado))) {
          sepMesSelecionado = sepMesesDisponiveis[0];
        }
        await carregarMesSep(sepMesSelecionado);
        return;
      }
    }

    // Fallback caso o manifesto ainda não tenha sido gerado
    const [resPick, resPulm, resBloc] = await Promise.all([
      fetch(`${CONFIG.SEP_PICKING_URL}?v=${timestamp}`, fetchOpts).catch(() => null),
      fetch(`${CONFIG.SEP_PULMAO_URL}?v=${timestamp}`, fetchOpts).catch(() => null),
      fetch(`${CONFIG.SEP_BLOCADO_URL}?v=${timestamp}`, fetchOpts).catch(() => null)
    ]);

    const parseSep = async (res, opNome) => {
      if (!res || !res.ok) return { registros: [], ultimaAtualizacao: '', metas: null };
      const j = await res.json();
      return { registros: descompactarArquivoSep(j, opNome), ultimaAtualizacao: j.ultimaAtualizacao || '', metas: j.metas || null };
    };

    const [dPick, dPulm, dBloc] = await Promise.all([
      parseSep(resPick, 'Separação Fracionado'),
      parseSep(resPulm, 'Full'),
      parseSep(resBloc, 'Separação Fracionado')
    ]);

    const datasAtt = [dPick.ultimaAtualizacao, dPulm.ultimaAtualizacao, dBloc.ultimaAtualizacao].filter(Boolean).sort();
    const todos = [...dPick.registros, ...dPulm.registros, ...dBloc.registros];
    sepMesesDisponiveis = Array.from(new Set(todos.map(r => r.mesChave).filter(m => m !== 'Sem_Data'))).sort((a, b) => b.localeCompare(a));
    if (!sepMesSelecionado && sepMesesDisponiveis.length) sepMesSelecionado = 'TODOS';

    const metasBase = dPick.metas || dPulm.metas || dBloc.metas || {};
    SepD = {
      todos,
      metas: {
        hh: metasBase.hh || 100,
        hhFull: metasBase.hhFull || metasBase.hhPulmao || 15,
        horasTurno: metasBase.horasTurno || 7
      },
      ultimaAtualizacao: datasAtt.length ? datasAtt[datasAtt.length - 1] : ''
    };
  } catch (e) {
    console.error("Erro ao carregar JSONs de separação:", e);
  }
}

function sepTodosRegistros() {
  return (SepD && SepD.todos) || [];
}

function sepRegistrosFiltrados() {
  return sepTodosRegistros().filter(r => {
    if (sepDadosFiltro.operacao.length > 0 && !hasArr(sepDadosFiltro.operacao, r.operacao)) return false;
    if (sepDadosFiltro.turno.length > 0 && !hasArr(sepDadosFiltro.turno, r.turno)) return false;
    if (sepDadosFiltro.data.length > 0 && !hasArr(sepDadosFiltro.data, r.data)) return false;
    if (sepDadosFiltro.loja.length > 0 && !hasArr(sepDadosFiltro.loja, r.lojaDestino)) return false;
    if (sepDadosFiltro.operador.length > 0 && !hasArr(sepDadosFiltro.operador, r.operador)) return false;
    return true;
  });
}

function tempoStrParaHoras(tStr) {
  if (!tStr) return 0;
  const parts = String(tStr).trim().split(':').map(Number);
  if (parts.length === 3 && !parts.some(isNaN)) return parts[0] + parts[1] / 60 + parts[2] / 3600;
  if (parts.length === 2 && !parts.some(isNaN)) return parts[0] + parts[1] / 60;
  return 0;
}

function sepAtualizadoTxt() {

// Calcula HH respeitando a unidade de cada modalidade:
// - Separação Fracionado -> Caixas / Hora (meta padrão: 100 cx/h)
// - Full -> Paletes (Linhas) / Hora (meta padrão: 15 plt/h)
function calcResumoOperadoresSep(rows, metaHhCx, horasTurno, metaHhPlt = 15) {
  const mapOp = {};
  rows.forEach(r => {
    const opNorm = normalizarOpSep(r.operacao);
    const key = `${r.operador}__${opNorm}__${r.turno}`;
    if (!mapOp[key]) {
      mapOp[key] = {
        operador: r.operador || 'Não identificado',
        operacao: opNorm,
        turno: r.turno || '-',
        osSet: new Set(),
        horasAtivasSet: new Set(),
        linhas: 0,
        qtd: 0,
        qtdConferida: 0,
        qtdPedida: 0,
        peso: 0,
        unitizadores: 0,
        itens: 0,
        horasTempo: 0
      };
    }
    const o = mapOp[key];
    o.linhas++;
    if (r.ordemServico) o.osSet.add(r.ordemServico);
    o.horasAtivasSet.add(`${r.data}_${r.hora}`);
    o.qtd += r.qtd || 0;
    o.qtdConferida += r.qtdConferida || 0;
    o.qtdPedida += r.qtdPedida || 0;
    o.peso += r.peso || 0;
    o.unitizadores += r.unitizadores || 0;
    o.itens += r.itens || 0;
    o.horasTempo += tempoStrParaHoras(r.tempoTotal);
  });

  return Object.values(mapOp).map(o => {
    const isFull = isFullOp(o.operacao);
    const horasConsideradas = o.horasTempo > 0 ? o.horasTempo : Math.max(o.horasAtivasSet.size, 1);
    const prodPrincipal = isFull ? o.linhas : o.qtd;
    const metaAplicada = isFull ? metaHhPlt : metaHhCx;
    const hhReal = horasConsideradas > 0 ? (prodPrincipal / horasConsideradas) : 0;
    const metaTurnoTotal = metaAplicada * horasTurno;
    const pctMeta = metaAplicada > 0 ? (hhReal / metaAplicada) * 100 : 0;
    return {
      ...o,
      isFull,
      isPulmao: isFull,
      prodPrincipal,
      unidade: isFull ? 'plt' : 'cx',
      metaAplicada,
      qtdOs: o.osSet.size || o.linhas,
      horasTrabalhadas: horasConsideradas,
      hh: hhReal,
      metaTurnoTotal,
      pctMeta
    };
  });
}

function buildGradeHoraPorFluxo(rowsDia, isFullFluxo, metaHhFluxo, horasTurno) {
  const sub = rowsDia.filter(r => isFullOp(r.operacao) === isFullFluxo);
  const horasComMov = Array.from(new Set(sub.map(r => Math.max(0, Math.min(23, +r.hora || 0))))).sort((a, b) => a - b);
  let gradeHoras = [];
  if (horasComMov.length > 0) {
    const minH = horasComMov[0];
    const maxH = Math.max(horasComMov[horasComMov.length - 1], minH + 6);
    for (let h = minH; h <= Math.min(23, maxH); h++) gradeHoras.push(h);
  } else {
    gradeHoras = [6, 7, 8, 9, 10, 11, 12, 13, 14];
  }

  const porHoraTotal = {};
  gradeHoras.forEach(h => { porHoraTotal[h] = 0; });

  const mapOp = {};
  sub.forEach(r => {
    const opNome = r.operador || 'Não identificado';
    const turnoNome = r.turno || '-';
    const key = `${opNome}__${turnoNome}`;
    if (!mapOp[key]) {
      mapOp[key] = {
        operador: opNome,
        turno: turnoNome,
        porHora: {},
        total: 0,
        caixas: 0,
        horasTempo: 0
      };
    }
    const item = mapOp[key];
    const h = Math.max(0, Math.min(23, +r.hora || 0));
    const val = isFullFluxo ? 1 : (r.qtd || 0);
    item.porHora[h] = (item.porHora[h] || 0) + val;
    item.total += val;
    item.caixas += (r.qtd || 0);
    item.horasTempo += tempoStrParaHoras(r.tempoTotal);
    if (porHoraTotal[h] !== undefined) porHoraTotal[h] += val;
  });

  const operadores = Object.values(mapOp).map(o => {
    const hrsEfetivas = o.horasTempo > 0 ? o.horasTempo : Math.max(Object.keys(o.porHora).length, 1);
    const hhCalc = hrsEfetivas > 0 ? (o.total / hrsEfetivas) : 0;
    const metaTurno = metaHhFluxo * horasTurno;
    const pctMetaTurno = metaTurno > 0 ? (o.total / metaTurno) * 100 : 0;
    return { ...o, hrsEfetivas, hhCalc, metaTurno, pctMetaTurno };
  }).sort((a, b) => b.total - a.total);

  const qtdOps = operadores.length;
  const totalUnid = sub.reduce((s, r) => s + (isFullFluxo ? 1 : (r.qtd || 0)), 0);
  const totalCx = sub.reduce((s, r) => s + (r.qtd || 0), 0);
  const metaEquipeHora = qtdOps * metaHhFluxo;
  const metaEquipeTurno = metaEquipeHora * horasTurno;
  const pctEquipeTurno = metaEquipeTurno > 0 ? (totalUnid / metaEquipeTurno) * 100 : 0;

  return {
    gradeHoras,
    porHoraTotal,
    operadores,
    qtdOps,
    totalUnid,
    totalCx,
    metaEquipeHora,
    metaEquipeTurno,
    pctEquipeTurno
  };
}

function fmtDeltaPct(atual, anterior) {
  if (!anterior || anterior <= 0) {
    return atual > 0 ? '<span class="bar-var-tag up">Novo</span>' : '<span class="bar-var-tag">—</span>';
  }
  const diff = ((atual - anterior) / anterior) * 100;
  const sinal = diff >= 0 ? '+' : '';
  return `<span class="bar-var-tag ${diff >= 0 ? 'up' : 'down'}">${sinal}${fmtP(diff, 1)}</span>`;
}

    garantirTodosMesesSep().then(() => {
      if (activeTab === 'sepanual') secSepAnual();
    });
    return;
  }

  let baseRegs = [];
  if (sepMesSelecionado === 'TODOS' && sepManifesto && sepMesesDisponiveis.length > 0) {
    sepMesesDisponiveis.forEach(m => {
      const blocos = sepCacheMeses[m] || [];
      blocos.forEach(b => {
        for (let i = 0; i < b.regs.length; i++) baseRegs.push(b.regs[i]);
      });
    });
  } else {
    baseRegs = sepTodosRegistros();
  }

  const filtrados = baseRegs.filter(r => {
    if (sepAnualModalidade !== 'TODAS' && normalizarOpSep(r.operacao) !== sepAnualModalidade) return false;
    if (sepDadosFiltro.operacao.length > 0 && !hasArr(sepDadosFiltro.operacao, r.operacao)) return false;
    if (sepDadosFiltro.turno.length > 0 && !hasArr(sepDadosFiltro.turno, r.turno)) return false;
    if (sepDadosFiltro.data.length > 0 && !hasArr(sepDadosFiltro.data, r.data)) return false;
    if (sepDadosFiltro.loja.length > 0 && !hasArr(sepDadosFiltro.loja, r.lojaDestino)) return false;
    if (sepDadosFiltro.operador.length > 0 && !hasArr(sepDadosFiltro.operador, r.operador)) return false;
    return true;
  });

  const regsFrac = filtrados.filter(r => !isFullOp(r.operacao));
  const regsFull = filtrados.filter(r => isFullOp(r.operacao));

  const fracCx = regsFrac.reduce((s, r) => s + (r.qtd || 0), 0);
  const fullPlt = regsFull.length;
  const fullCx = regsFull.reduce((s, r) => s + (r.qtd || 0), 0);
  const totalCx = filtrados.reduce((s, r) => s + (r.qtd || 0), 0);
  const totalPeso = filtrados.reduce((s, r) => s + (r.peso || 0), 0);
  const osUnicas = new Set(filtrados.map(r => r.ordemServico).filter(Boolean)).size || filtrados.length;
  const opsUnicos = new Set(filtrados.map(r => r.operador).filter(Boolean)).size;
  const diasUnicos = new Set(filtrados.map(r => r.data).filter(Boolean)).size;
  const lojasUnicas = new Set(filtrados.map(r => r.lojaDestino).filter(Boolean)).size;

          <div class="dept-hbar-list" style="grid-template-columns:minmax(0,1fr);gap:6px">
            ${topLojas.length ? topLojas.map(lj => {

              return `
              <div class="dept-hbar-row" style="grid-template-columns:165px 1fr 140px;padding:5px 8px">
                <div class="dept-hbar-name" title="${esc(lj.loja)}">${esc(lj.loja)}</div>
                <div class="dept-hbar-track"><div class="dept-hbar-fill" style="width:${Math.max(pctL, 3)}%;background:var(--accent)"></div></div>
                <div class="dept-hbar-val">${fmtN.format(lj.cx)} cx <span style="color:#d8b4fe;font-size:12px;margin-left:4px">${lj.plt} plt</span></div>

    <div class="card" style="margin-top:20px">

      <div class="tw">
        <table>

              <th class="r">OS</th>
