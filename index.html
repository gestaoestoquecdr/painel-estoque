                <td><b>${esc(m.label)}</b></td>
                <td class="r">${fmtN.format(m.qtdDias)}</td>
                <td class="r">${fmtN.format(m.qtdOs)}</td>
                <td class="r">${fmtN.format(m.qtdOps)}</td>
                <td class="r" style="color:var(--blue);font-weight:700">${fmtN.format(m.fracCx)}</td>
                <td class="r" style="color:#d8b4fe;font-weight:800">${fmtN.format(m.fullPlt)} plt</td>
                <td class="r" style="color:var(--mute)">${fmtN.format(m.fullCx)}</td>
                <td class="r" style="font-weight:800;color:var(--text-strong)">${fmtN.format(m.totalCx)}</td>
              </tr>`).join('') : '<tr><td colspan="8">Nenhum mês encontrado.</td></tr>'}
            <tr class="tot">
              <td><b>Total Período</b></td>
              <td class="r">${fmtN.format(diasUnicos)}</td>
              <td class="r">${fmtN.format(osUnicas)}</td>
              <td class="r">${fmtN.format(opsUnicos)}</td>
              <td class="r" style="color:var(--blue)">${fmtN.format(fracCx)}</td>
              <td class="r" style="color:#d8b4fe">${fmtN.format(fullPlt)} plt</td>
              <td class="r">${fmtN.format(fullCx)}</td>
              <td class="r" style="color:var(--ok)">${fmtN.format(totalCx)}</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

    <div class="card" style="margin-top:20px">
      <div class="card-header-action">
        <h3>${ICONS.layers} DETALHAMENTO ANALÍTICO DE REGISTROS (${fmtN.format(lista.length)} REGISTROS)</h3>
        <div class="prod-controls">
          <select id="selSepAnualOrdem">
            <option value="qtd" ${sepAnualOrdem === 'qtd' ? 'selected' : ''}>Ordem: maior volume (cx)</option>
            <option value="os" ${sepAnualOrdem === 'os' ? 'selected' : ''}>Ordem: nº da OS</option>
            <option value="hora" ${sepAnualOrdem === 'hora' ? 'selected' : ''}>Ordem: horário</option>
            <option value="op" ${sepAnualOrdem === 'op' ? 'selected' : ''}>Ordem: operador (A-Z)</option>
          </select>
          <input type="text" id="inputSearchSepAnual" placeholder="Buscar operador, OS, loja, modalidade..." value="${esc(searchSepAnual)}" style="width:280px">
        </div>
      </div>
      <div class="tw">
        <table>
          <thead>
            <tr>
              <th>Modalidade</th>
              <th>Data</th>
              <th>Turno</th>
              <th>OS</th>
              <th>Loja Destino</th>
              <th>Operador</th>
              <th class="r">Medida Oper.</th>
              <th class="r">Caixas</th>
            </tr>
          </thead>
          <tbody>
            ${mostradas.length ? mostradas.map(r => {
              const full = isFullOp(r.operacao);
              return `
              <tr>
                <td><span class="dot" style="background:${full ? '#a855f7' : '#4285f4'}"></span><b>${esc(normalizarOpSep(r.operacao))}</b></td>
                <td>${esc(r.data)}</td>
                <td>${esc(r.turno)}</td>
                <td><b style="color:var(--accent-text)">${esc(r.ordemServico || '-')}</b></td>
                <td>${esc(r.lojaDestino || '-')}</td>
                <td><b>${esc(r.operador)}</b></td>
                <td class="r" style="font-weight:700;color:${full ? '#d8b4fe' : 'var(--accent-text)'}">${full ? '1 palete (linha)' : fmtN.format(r.qtd || 0) + ' cx'}</td>
                <td class="r" style="color:var(--ok);font-weight:700">${fmtN.format(r.qtd || 0)}</td>
              </tr>`;
            }).join('') : '<tr><td colspan="8">Nenhum registro encontrado no filtro atual.</td></tr>'}
          </tbody>
        </table>
      </div>
      ${restam > 0 ? `<div style="text-align:center;margin-top:12px"><button class="btn-more" id="btnMoreSepAnual">Mostrar mais 150 (restam ${fmtN.format(restam)})</button></div>` : ''}
    </div>
  `;

  const selMod = $('#selSepAnualMod');
  if (selMod) selMod.addEventListener('change', e => {
    sepAnualModalidade = e.target.value;
    sepAnualLimite = 150;
    secSepAnual();
  });

  document.querySelectorAll('[data-anual-mes]').forEach(el => el.addEventListener('click', async () => {
    const m = el.getAttribute('data-anual-mes');
    if (m) {
      await trocarMesSep(m);
      setActiveTab('sephora');
    }
  }));

  document.querySelectorAll('[data-sep-op]').forEach(el => el.addEventListener('click', () => {
    toggleArr(sepDadosFiltro.operacao, el.getAttribute('data-sep-op'));
    sepAnualLimite = 150;
    render();
  }));

  document.querySelectorAll('[data-sep-turno]').forEach(el => el.addEventListener('click', () => {
    toggleArr(sepDadosFiltro.turno, el.getAttribute('data-sep-turno'));
    sepAnualLimite = 150;
    render();
  }));

  const selO = $('#selSepAnualOrdem');
  if (selO) selO.addEventListener('change', e => { sepAnualOrdem = e.target.value; sepAnualLimite = 150; secSepAnual(); });
  const inS = $('#inputSearchSepAnual');
  if (inS) inS.addEventListener('input', e => {
    searchSepAnual = e.target.value; sepAnualLimite = 150;
    secSepAnual();
    keepFocus('#inputSearchSepAnual', () => searchSepAnual);
  });
  const bm = $('#btnMoreSepAnual');
  if (bm) bm.addEventListener('click', () => { sepAnualLimite += 150; secSepAnual(); });
  attachTooltipEvents();
}

/* ---------- PÁGINA DEDICADA: PRODUÇÃO HORA A HORA (DIA ATUAL E DIA ANTERIOR · FRACIONADO E FULL) ---------- */
function renderBlocoFluxoHora(tituloFluxo, badgeUnid, dadosDia, corAccent, isFullFluxo) {
  const { gradeHoras, porHoraTotal, operadores, qtdOps, totalUnid, totalCx, metaEquipeHora, metaEquipeTurno, pctEquipeTurno } = dadosDia;
  const colSpanVazio = gradeHoras.length + 6;

  return `
    <div class="card" style="margin-top:20px;border-top:4px solid ${corAccent}">
      <div class="card-header-action">
        <h3>${ICONS.clock} ${esc(tituloFluxo)} (${esc(badgeUnid)})</h3>
        <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center">
          <span class="badge-pill badge-lote">Operadores: ${fmtN.format(qtdOps)}</span>
          <span class="badge-pill badge-full">Total: ${fmtN.format(totalUnid)} ${esc(badgeUnid)}</span>
          ${isFullFluxo ? `<span class="badge-pill badge-verba-sim">Vol. Caixas: ${fmtN.format(totalCx)} cx</span>` : ''}
        </div>
      </div>

      <div class="tw" style="margin-bottom:14px">
        <table>
          <thead>
            <tr>
              <th>Resumo Equipe</th>
              ${gradeHoras.map(h => `<th class="r">${h}hr</th>`).join('')}
              <th class="r">Meta H.H</th>
              <th class="r">Meta Turno</th>
              <th class="r">Total (${esc(badgeUnid)})</th>
              <th class="r">% Meta</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td><b>PRD. HORA</b></td>
              ${gradeHoras.map(h => `<td class="r" style="font-weight:700;color:${(porHoraTotal[h] || 0) > 0 ? 'var(--accent-text)' : 'var(--mute)'}">${fmtN.format(porHoraTotal[h] || 0)}</td>`).join('')}
              <td class="r" style="font-weight:700">${fmtN.format(metaEquipeHora)}</td>
              <td class="r" style="font-weight:700;color:var(--accent-text)">${fmtN.format(metaEquipeTurno)}</td>
              <td class="r" style="font-weight:800;color:var(--ok)">${fmtN.format(totalUnid)} ${esc(badgeUnid)}</td>
              <td class="r" style="font-weight:800;color:${pctEquipeTurno >= 100 ? 'var(--ok)' : 'var(--warn)'}">${fmtP(pctEquipeTurno, 1)}</td>
            </tr>
            <tr>
              <td style="color:var(--mute);font-size:13px"><b>% Ritmo Hora</b></td>
              ${gradeHoras.map(h => {
                const pctH = metaEquipeHora > 0 ? ((porHoraTotal[h] || 0) / metaEquipeHora) * 100 : 0;
                return `<td class="r" style="font-size:13px;color:${pctH >= 100 ? 'var(--ok)' : (pctH > 0 ? 'var(--warn)' : 'var(--mute)')}">${fmtP(pctH, 0)}</td>`;
              }).join('')}
              <td colspan="4" style="font-size:13px;color:var(--mute);text-align:right">${isFullFluxo ? `Volume em caixas no dia: <b>${fmtN.format(totalCx)} cx</b>` : `Meta unitária: <b>${fmtN.format(metaEquipeHora / Math.max(qtdOps, 1))} ${esc(badgeUnid)}/h</b>`}</td>
            </tr>
          </tbody>
        </table>
      </div>

      <div class="tw" style="max-height:420px;overflow-y:auto">
        <table>
          <thead>
            <tr>
              <th>Funcionário</th>
              <th>Turno</th>
              <th class="r">Horas</th>
              ${gradeHoras.map(h => `<th class="r">${h}hr</th>`).join('')}
              <th class="r">H.H</th>
              <th class="r">Meta</th>
              <th class="r">Total</th>
              <th class="r">% Meta</th>
            </tr>
          </thead>
          <tbody>
            ${operadores.length ? operadores.map(o => {
              const metaUn = metaEquipeHora / Math.max(qtdOps, 1);
              const okHh = o.hhCalc >= metaUn;
              return `
              <tr>
                <td><b>${esc(o.operador)}</b></td>
                <td>${esc(o.turno)}</td>
                <td class="r">${o.hrsEfetivas.toFixed(1)}</td>
                ${gradeHoras.map(h => {
                  const v = o.porHora[h] || 0;
                  return `<td class="r" style="${v > 0 ? 'background:rgba(255,196,0,0.14);color:var(--text-strong);font-weight:700' : 'color:var(--mute)'}">${fmtN.format(v)}</td>`;
                }).join('')}
                <td class="r" style="font-weight:800;color:${okHh ? 'var(--ok)' : 'var(--warn)'}">${o.hhCalc.toFixed(1)}</td>
                <td class="r" style="color:var(--mute)">${fmtN.format(o.metaTurno)}</td>
                <td class="r" style="font-weight:800;color:var(--text-strong)">${fmtN.format(o.total)} <span style="font-size:12px;color:var(--mute)">${esc(badgeUnid)}</span></td>
                <td class="r" style="font-weight:700;color:${o.pctMetaTurno >= 100 ? 'var(--ok)' : 'var(--crit)'}">${fmtP(o.pctMetaTurno, 1)}</td>
              </tr>`;
            }).join('') : `<tr><td colspan="${colSpanVazio}">Sem apontamentos de ${esc(tituloFluxo)} para o dia selecionado.</td></tr>`}
          </tbody>
        </table>
      </div>
    </div>
  `;
}

function secSepHora() {
  const el = $('#s-sephora');
  if (!el) return;
  if (!SepD) {
    el.innerHTML = `<h2>Separação · Produção Hora a Hora</h2><p class="sub">Carregando apontamentos hora a hora...</p>`;
    return;
  }

  const metaHhCx = (SepD.metas && SepD.metas.hh) || 100;
  const metaHhFull = (SepD.metas && (SepD.metas.hhFull || SepD.metas.hhPulmao)) || 15;
  const horasTurno = (SepD.metas && SepD.metas.horasTurno) || 7;

  // Respeita filtros de modalidade, turno, loja e operador, mas descobre datas disponíveis para Dia Atual e Dia Anterior
  const rowsSemData = sepTodosRegistros().filter(r => {
    if (sepDadosFiltro.operacao.length > 0 && !hasArr(sepDadosFiltro.operacao, r.operacao)) return false;
    if (sepDadosFiltro.turno.length > 0 && !hasArr(sepDadosFiltro.turno, r.turno)) return false;
    if (sepDadosFiltro.loja.length > 0 && !hasArr(sepDadosFiltro.loja, r.lojaDestino)) return false;
    if (sepDadosFiltro.operador.length > 0 && !hasArr(sepDadosFiltro.operador, r.operador)) return false;
    return true;
  });

  const datasDesc = getDatasOrdenadasDesc(rowsSemData);
  const dataAtual = sepDadosFiltro.data.length >= 1 ? sepDadosFiltro.data[0] : (datasDesc[0] || '');
  const dataAnterior = sepDadosFiltro.data.length >= 2
    ? sepDadosFiltro.data[1]
    : (datasDesc.find(d => d !== dataAtual) || '');

  const rowsAtual = dataAtual ? rowsSemData.filter(r => r.data === dataAtual) : [];
  const rowsAnterior = dataAnterior ? rowsSemData.filter(r => r.data === dataAnterior) : [];

  const fracAtual = buildGradeHoraPorFluxo(rowsAtual, false, metaHhCx, horasTurno);
  const fullAtual = buildGradeHoraPorFluxo(rowsAtual, true, metaHhFull, horasTurno);
  const fracAnt = buildGradeHoraPorFluxo(rowsAnterior, false, metaHhCx, horasTurno);
  const fullAnt = buildGradeHoraPorFluxo(rowsAnterior, true, metaHhFull, horasTurno);

  const dataExibidaRef = sepHoraModo === 'ANTERIOR' ? (dataAnterior || 'Sem dia anterior') : (dataAtual || 'Sem data');
  const fracExibido = sepHoraModo === 'ANTERIOR' ? fracAnt : fracAtual;
  const fullExibido = sepHoraModo === 'ANTERIOR' ? fullAnt : fullAtual;

  const isGrafFull = sepHoraFluxoGrafico === 'FULL';
  const horasGraf = Array.from(new Set([
    ...(isGrafFull ? fullAtual.gradeHoras : fracAtual.gradeHoras),
    ...(isGrafFull ? fullAnt.gradeHoras : fracAnt.gradeHoras)
  ])).sort((a, b) => a - b);

  const maxGrafVal = horasGraf.length
    ? Math.max(...horasGraf.map(h => Math.max(
        (isGrafFull ? fullAtual.porHoraTotal[h] : fracAtual.porHoraTotal[h]) || 0,
        (isGrafFull ? fullAnt.porHoraTotal[h] : fracAnt.porHoraTotal[h]) || 0
      ))) * 1.2
    : 1;

  const mostrarFrac = sepDadosFiltro.operacao.length === 0 || hasArr(sepDadosFiltro.operacao, 'Separação Fracionado');
  const mostrarFull = sepDadosFiltro.operacao.length === 0 || hasArr(sepDadosFiltro.operacao, 'Full');

  el.innerHTML = `
    <h2>Separação · Produção Hora a Hora</h2>
    <p class="sub">Acompanhamento hora a hora com <b>Dia Atual</b> (${esc(dataAtual || '—')}) e <b>Dia Anterior</b> (${esc(dataAnterior || '—')}), dividido em <b>Separação Fracionado</b> e <b>Full</b>.${esc(sepAtualizadoTxt())}</p>

    <div class="grid kpis">
      ${kpi('Fracionado · Dia Atual', `${fmtN.format(fracAtual.totalUnid)} <span style="font-size:18px;color:var(--mute)">cx</span>`, `Anterior (${esc(dataAnterior || '—')}): ${fmtN.format(fracAnt.totalUnid)} cx · ${fmtDeltaPct(fracAtual.totalUnid, fracAnt.totalUnid).replace(/<[^>]+>/g, '')}`, 'hl')}
      ${kpi('Full · Dia Atual', `${fmtN.format(fullAtual.totalUnid)} <span style="font-size:18px;color:var(--mute)">plt</span>`, `Anterior (${esc(dataAnterior || '—')}): ${fmtN.format(fullAnt.totalUnid)} plt · ${fmtN.format(fullAtual.totalCx)} cx`, 'hl')}
      ${kpi('Dia Anterior · Fracionado', `${fmtN.format(fracAnt.totalUnid)} <span style="font-size:18px;color:var(--mute)">cx</span>`, `Data: ${esc(dataAnterior || 'Não disponível')} · ${fmtN.format(fracAnt.qtdOps)} oper.`)}
      ${kpi('Dia Anterior · Full', `${fmtN.format(fullAnt.totalUnid)} <span style="font-size:18px;color:var(--mute)">plt</span>`, `Data: ${esc(dataAnterior || 'Não disponível')} · ${fmtN.format(fullAnt.totalCx)} cx`)}
    </div>

    <div class="card" style="margin-top:20px">
      <div class="card-header-action">
        <h3>${ICONS.clock} VISUALIZAÇÃO DO DIA & COMPARATIVO HORA A HORA (ATUAL VS ANTERIOR)</h3>
        <div class="prod-controls">
          <select id="selSepHoraModo" style="font-weight:700;color:var(--accent-text)">
            <option value="COMPARATIVO" ${sepHoraModo === 'COMPARATIVO' ? 'selected' : ''}>Dia Atual + Dia Anterior (Comparativo)</option>
            <option value="ATUAL" ${sepHoraModo === 'ATUAL' ? 'selected' : ''}>Somente Dia Atual (${esc(dataAtual || '-')})</option>
            <option value="ANTERIOR" ${sepHoraModo === 'ANTERIOR' ? 'selected' : ''}>Somente Dia Anterior (${esc(dataAnterior || '-')})</option>
          </select>
          <select id="selSepHoraFluxoGraf" style="font-weight:700">
            <option value="FRAC" ${sepHoraFluxoGrafico === 'FRAC' ? 'selected' : ''}>Gráfico: Separação Fracionado (cx)</option>
            <option value="FULL" ${sepHoraFluxoGrafico === 'FULL' ? 'selected' : ''}>Gráfico: Full (paletes)</option>
          </select>
        </div>
      </div>

      ${horasGraf.length ? `
        <div class="bar-chart-container" style="height:260px;padding-top:52px">
          <div class="bar-chart-wrapper">
            ${horasGraf.map(h => {
              const vAtual = (isGrafFull ? fullAtual.porHoraTotal[h] : fracAtual.porHoraTotal[h]) || 0;
              const vAnt = (isGrafFull ? fullAnt.porHoraTotal[h] : fracAnt.porHoraTotal[h]) || 0;
              const vRef = sepHoraModo === 'ANTERIOR' ? vAnt : vAtual;
              const pctH = (vRef / maxGrafVal) * 100;
              const hLabel = `${h}hr`;
              const ttItems = [
                { prod: `Dia Atual (${dataAtual || '-'}): ${fmtN.format(vAtual)} ${isGrafFull ? 'plt' : 'cx'}`, sub: `Faixa ${hLabel}` },
                { prod: `Dia Anterior (${dataAnterior || '-'}): ${fmtN.format(vAnt)} ${isGrafFull ? 'plt' : 'cx'}`, sub: `Variação vs Ontem: ${fmtDeltaPct(vAtual, vAnt).replace(/<[^>]+>/g, '')}` }
              ];
              return `
              <div class="bar-chart-col">
                <div class="bar-chart-bar" style="height:${Math.max(pctH, 6)}%;${isGrafFull ? 'background:linear-gradient(180deg, #a855f7 0%, #581c87 100%);border-color:rgba(216,180,254,0.5)' : ''}"
                     data-tooltip-title="${esc(hLabel)}"
                     data-tooltip-color="${isGrafFull ? '#a855f7' : 'var(--accent)'}"
                     data-tooltip-items="${JSON.stringify(ttItems).replace(/"/g, '&quot;')}">
                  <div class="bar-val-label">
                    <span>${fmtN.format(vRef)}</span>
                    ${sepHoraModo === 'COMPARATIVO' ? `<span style="font-size:11px;color:var(--mute)">ontem: ${fmtN.format(vAnt)}</span>` : ''}
                  </div>
                </div>
                <div class="bar-date-label">${hLabel}</div>
              </div>`;
            }).join('')}
          </div>
        </div>
      ` : '<p style="color:var(--mute);padding:16px">Sem dados horários disponíveis.</p>'}
    </div>

    ${mostrarFrac ? renderBlocoFluxoHora(`Separação Fracionado · ${dataExibidaRef}`, 'cx', fracExibido, '#4285f4', false) : ''}
    ${mostrarFull ? renderBlocoFluxoHora(`Full · ${dataExibidaRef}`, 'plt', fullExibido, '#a855f7', true) : ''}

    ${sepHoraModo === 'COMPARATIVO' && dataAnterior ? `
      <div style="margin-top:26px;padding-top:16px;border-top:2px dashed var(--line)">
        <h3 style="margin-bottom:4px">${ICONS.calendar} REFERÊNCIA DO DIA ANTERIOR (${esc(dataAnterior)})</h3>
        <p class="sub" style="margin-bottom:0">Detalhamento hora a hora do dia anterior para comparação direta com o dia atual (${esc(dataAtual || '—')}).</p>
        ${mostrarFrac ? renderBlocoFluxoHora(`Dia Anterior (${dataAnterior}) · Separação Fracionado`, 'cx', fracAnt, '#64748b', false) : ''}
        ${mostrarFull ? renderBlocoFluxoHora(`Dia Anterior (${dataAnterior}) · Full`, 'plt', fullAnt, '#7e22ce', true) : ''}
      </div>
    ` : ''}
  `;

  const selModo = $('#selSepHoraModo');
  if (selModo) selModo.addEventListener('change', e => { sepHoraModo = e.target.value; secSepHora(); });
  const selFlux = $('#selSepHoraFluxoGraf');
  if (selFlux) selFlux.addEventListener('change', e => { sepHoraFluxoGrafico = e.target.value; secSepHora(); });
  attachTooltipEvents();
}

/* ---------- ABA RANKING OPERADORES (SEPARAÇÃO FRACIONADO & FULL) ---------- */
function secSepOperadores() {
  const el = $('#s-sepoperadores');
  if (!el) return;
  if (!SepD) {
    el.innerHTML = `<h2>Ranking Operadores</h2><p class="sub">Carregando dados de Separação Fracionado e Full...</p>`;
    return;
  }

  const metaHh = (SepD.metas && SepD.metas.hh) || 100;
  const metaHhFull = (SepD.metas && (SepD.metas.hhFull || SepD.metas.hhPulmao)) || 15;
  const horasTurno = (SepD.metas && SepD.metas.horasTurno) || 7;
  const rows = sepRegistrosFiltrados();

  ]},

    { id:'sepoperadores', nome:`${ICONS.users} Ranking Operadores`,         render:secSepOperadores }
  ]}
];
const TAB_RENDER = Object.fromEntries(SETORES.flatMap(s => s.tabs.map(t => [t.id, t.render])));
const TAB_SETOR  = Object.fromEntries(SETORES.flatMap(s => s.tabs.map(t => [t.id, s.id])));

let activeSetor = 'estoque';
let activeTab   = 'geral';
let filterOcupGalpao = [];

function renderSetores(){
  const box = $('#setores');
  if (!box) return;
  box.innerHTML = SETORES.map(s => `<button type="button" data-setor="${s.id}" aria-pressed="${s.id === activeSetor}"><span class="si">${s.ico}</span><span class="st">${esc(s.nome)}</span></button>`).join('');
  box.querySelectorAll('button').forEach(b => b.addEventListener('click', () => setSetor(b.dataset.setor)));
}

function renderNav(){
  const s = SETORES.find(x => x.id === activeSetor) || SETORES[0];
  const nav = $('#tabs');
  if (!nav) return;
  nav.innerHTML = s.tabs.map(t => `<button type="button" role="tab" data-t="${t.id}" aria-selected="${t.id === activeTab}">${t.nome}</button>`).join('');
  nav.querySelectorAll('button').forEach(b => b.addEventListener('click', () => setActiveTab(b.dataset.t)));
}

function setSetor(id){
  const s = SETORES.find(x => x.id === id);
  if (!s) return;
  activeSetor = id;
  document.body.dataset.setor = id;
  if (activeSetor !== id || !s.tabs.some(t => t.id === activeTab)) activeTab = s.tabs[0].id;
  renderSetores();
  renderNav();
  setActiveTab(activeTab);
}

function setActiveTab(id){
  const setor = TAB_SETOR[id];
  if (setor && setor !== activeSetor) {
    activeSetor = setor;
    document.body.dataset.setor = setor;
    renderSetores();
    renderNav();
  }
  activeTab = id;
  document.querySelectorAll('#tabs button').forEach(x => x.setAttribute('aria-selected', x.dataset.t === id));
  document.querySelectorAll('section').forEach(s => s.classList.toggle('on', s.id === 's-' + id));
  render();
  window.scrollTo({top:0, behavior:'smooth'});
}

    if (sepMesesDisponiveis.length > 0) {
      const mesOpts = [
        ...sepMesesDisponiveis.map(m => ({ v: m, l: formatarChaveMesSep(m) })),
        { v: 'TODOS', l: 'Todos os Meses (Ano Completo)' }
      ];
      ctrls.unshift({
        id: 's_mes',
        lbl: 'Mês',
        type: 'single',
        val: sepMesSelecionado,
        all: formatarChaveMesSep(sepMesesDisponiveis[0]),
        opts: mesOpts,
        set: v => { trocarMesSep(v); }
      });
    }
    return ctrls;
  }
  return [];
}

function resetTabFilters(){
  const t = activeTab;
  if (t === 'geral') { filterLocalEst = []; filterStatusEst = []; filterArea = []; filterRua = []; }
  else if (t === 'shelf') filterShelfFaixa = [];
  else if (t === 'aging') filterAgingFaixa = [];
  else if (t === 'ocup') filterOcupGalpao = [];
  else if (t === 'carteira') { statusFilter = 'pendente'; dateReservaFilter = []; sepFilter = []; deptFilter = []; targetDestFilter = []; }
  else if (t === 'transito') { admFiltro = {sentido:[], mes:[], faixa:[], loja:[]}; admLimite = 150; }
  else if (t === 'prealerta') { preFiltro = {loja:[], situacao:[], tipo:[], mes:[], stCd:[], stLoja:[]}; preLimite = 150; }
  else if (t === 'recebnotas' || t === 'recebverba') { recFiltro = {mes:[], loja:[], tipoCarga:[], statusNota:[], tipoOp:[], fornecedor:[], pagaVerba:'todos'}; recLimite = 150; verbaLimite = 150; semVerbaLimite = 150; }
  else if (t === 'sepanual' || t === 'sephora' || t === 'sepoperadores') { sepDadosFiltro = { operacao: [], turno: [], data: [], loja: [], operador: [] }; sepAnualModalidade = 'TODAS'; sepAnualLimite = 150; }
}

function renderFilterBar(){
  const bar = $('#filterbar');
  if (!bar) return;
  const openIds = Array.from(bar.querySelectorAll('.ms-wrap.open')).map(el => el.dataset.msId);
  const ctrls = getFilterControls();
  bar.classList.toggle('on', ctrls.length > 0);
  if (!ctrls.length) { bar.innerHTML = ''; return; }

  const ativos = [];
  ctrls.forEach(c => {
    if (c.type === 'multi') {
      (c.val || []).forEach(v => {
        const opt = c.opts.find(o => String(o.v) === String(v));
        ativos.push({ctrl:c, val:v, label:opt ? opt.l : v});
      });
    } else {
      const def = c.id === 'c_st' ? 'pendente' : (c.id === 's_mes' ? sepMesesDisponiveis[0] : 'todos');
      if (c.val && c.val !== def) {
        const opt = c.opts.find(o => String(o.v) === String(c.val));
        ativos.push({ctrl:c, val:c.val, label:opt ? opt.l : c.val});
      }
    }
  });

  bar.innerHTML = `
    <div class="gf-row">
      <span class="gf-title">${ICONS.filter} Filtros</span>
      ${ctrls.map(c => {
        if (c.type === 'single') {
          const def = c.id === 'c_st' ? 'pendente' : (c.id === 's_mes' ? sepMesesDisponiveis[0] : 'todos');
          const on = c.val && c.val !== def;
          const allOpt = c.opts.some(o => o.v === 'todos') ? '' : `<option value="todos">${esc(c.all)}</option>`;
          return `<label class="gf ${on ? 'on' : ''}">
            <span class="gf-lbl">${esc(c.lbl)}</span>
            <select data-gf="${c.id}">${allOpt}${c.opts.map(o => `<option value="${esc(o.v)}" ${String(o.v) === String(c.val) ? 'selected' : ''}>${esc(o.l)}</option>`).join('')}</select>
          </label>`;
        } else {
          const selArr = c.val || [];
          const on = selArr.length > 0;
          let btnLabel = c.all;
          if (selArr.length === 1) {
            const found = c.opts.find(o => String(o.v) === String(selArr[0]));
            btnLabel = found ? found.l : selArr[0];
          } else if (selArr.length > 1) {
            btnLabel = `${selArr.length} selecionados`;
          }
          const showSearch = c.opts.length > 6;
          return `<div class="gf ${on ? 'on' : ''}">
            <span class="gf-lbl">${esc(c.lbl)}</span>
            <div class="ms-wrap" data-ms-id="${c.id}">
              <button type="button" class="ms-btn" aria-expanded="false">
                <span class="ms-btn-txt">${esc(btnLabel)}</span>
                ${selArr.length > 0 ? `<span class="ms-badge">${selArr.length}</span>` : ''}
                <span class="ms-arrow">▼</span>
              </button>
              <div class="ms-menu">
                ${showSearch ? `<input type="text" class="ms-search" placeholder="Pesquisar..." />` : ''}
                <div class="ms-actions">
                  <span>${selArr.length} de ${c.opts.length}</span>
                  <div class="ms-actions-btns">
                    <button type="button" data-ms-all="${c.id}">Todos</button>
                    <button type="button" data-ms-none="${c.id}">Limpar</button>
                  </div>
                </div>
                <div class="ms-list">
                  ${c.opts.map(o => {
                    const checked = isSelectedArr(selArr, o.v);
                    return `<label class="ms-item ${checked ? 'checked' : ''}" data-ms-text="${esc(String(o.l).toLowerCase())}">
                      <input type="checkbox" data-ms-ctrl="${c.id}" value="${esc(o.v)}" ${checked ? 'checked' : ''} />
                      <span title="${esc(o.l)}">${esc(o.l)}</span>
                    </label>`;
                  }).join('')}
                </div>
              </div>
            </div>
          </div>`;
        }
      }).join('')}
      <button type="button" class="gf-clear" id="gfClear" ${ativos.length ? '' : 'disabled'}>✕ Limpar</button>
    </div>
    ${ativos.length ? `<div class="gf-chips">${ativos.map((a, idx) => `<button type="button" class="chip" data-chip-idx="${idx}" title="Remover filtro"><b>${esc(a.ctrl.lbl)}:</b> ${esc(a.label)} ✕</button>`).join('')}</div>` : ''}
  `;

  openIds.forEach(id => {
    const wrap = bar.querySelector(`.ms-wrap[data-ms-id="${id}"]`);
    if (wrap) {
      wrap.classList.add('open');
      const btn = wrap.querySelector('.ms-btn');
      if (btn) btn.setAttribute('aria-expanded', 'true');
    }
  });

  bar.querySelectorAll('select[data-gf]').forEach(sel => sel.addEventListener('change', () => {
    const c = ctrls.find(x => x.id === sel.dataset.gf);
    if (c) {
      c.set(sel.value);
      if (c.id !== 's_mes') render();
    }
  }));

  bar.querySelectorAll('.ms-btn').forEach(btn => btn.addEventListener('click', (e) => {
    e.stopPropagation();
    const wrap = btn.closest('.ms-wrap');
    const wasOpen = wrap.classList.contains('open');
    bar.querySelectorAll('.ms-wrap.open').forEach(w => {
      w.classList.remove('open');
      const b = w.querySelector('.ms-btn');
      if (b) b.setAttribute('aria-expanded', 'false');
    });
    if (!wasOpen) {
      wrap.classList.add('open');
      btn.setAttribute('aria-expanded', 'true');
      const inp = wrap.querySelector('.ms-search');
      if (inp) setTimeout(() => inp.focus(), 10);
    }
  }));

  bar.querySelectorAll('.ms-menu').forEach(menu => menu.addEventListener('click', e => e.stopPropagation()));

  bar.querySelectorAll('.ms-search').forEach(inp => inp.addEventListener('input', () => {
    const q = inp.value.trim().toLowerCase();
    const list = inp.closest('.ms-menu').querySelector('.ms-list');
    list.querySelectorAll('.ms-item').forEach(item => {
      const txt = item.dataset.msText || '';
      item.style.display = (!q || txt.includes(q)) ? 'flex' : 'none';
    });
  }));

  bar.querySelectorAll('input[data-ms-ctrl]').forEach(chk => chk.addEventListener('change', () => {
    const c = ctrls.find(x => x.id === chk.dataset.msCtrl);
    if (!c) return;
    const next = [...(c.val || [])];
    toggleArr(next, chk.value);
    c.set(next);
    render();
  }));

  bar.querySelectorAll('button[data-ms-all]').forEach(btn => btn.addEventListener('click', () => {
    const c = ctrls.find(x => x.id === btn.dataset.msAll);
    if (!c) return;
    c.set(c.opts.map(o => String(o.v)));
    render();
  }));

  bar.querySelectorAll('button[data-ms-none]').forEach(btn => btn.addEventListener('click', () => {
    const c = ctrls.find(x => x.id === btn.dataset.msNone);
    if (!c) return;
    c.set([]);
    render();
  }));

  bar.querySelectorAll('[data-chip-idx]').forEach(btn => btn.addEventListener('click', () => {
    const a = ativos[+btn.dataset.chipIdx];
    if (!a) return;
    if (a.ctrl.type === 'multi') {
      const next = (a.ctrl.val || []).filter(v => String(v) !== String(a.val));
      a.ctrl.set(next);
    } else {
      const defVal = a.ctrl.id === 'c_st' ? 'pendente' : (a.ctrl.id === 's_mes' ? sepMesesDisponiveis[0] : 'todos');
      a.ctrl.set(defVal);
      if (a.ctrl.id === 's_mes') return;
    }
    render();
  }));

  const clr = $('#gfClear');
  if (clr) clr.addEventListener('click', () => { resetTabFilters(); render(); });
}

document.addEventListener('click', (e) => {
  if (!e.target.closest('.ms-wrap')) {
    document.querySelectorAll('.ms-wrap.open').forEach(w => {
      w.classList.remove('open');
      const b = w.querySelector('.ms-btn');
      if (b) b.setAttribute('aria-expanded', 'false');
    });
  }
});

function render(){
  if (!D) return;
  const fn = TAB_RENDER[activeTab] || secGeral;
  fn();
  renderFilterBar();
}

renderSetores();
renderNav();
document.body.dataset.setor = activeSetor;
setActiveTab(activeTab);

const sideToggle = $('#sideToggle');
if (sideToggle) sideToggle.addEventListener('click', () => document.body.classList.toggle('side-collapsed'));

/* ===== CONTROLE DE TEMA CLARO / ESCURO ===== */
const themeToggle = $('#themeToggle');
function applyTheme(isLight) {
  document.body.classList.toggle('light-theme', isLight);
  if (themeToggle) {
    themeToggle.innerHTML = isLight
      ? `${ICONS.moon} <span>Tema Escuro</span>`
      : `${ICONS.sun} <span>Tema Claro</span>`;
  }
}
const savedTheme = localStorage.getItem('cdr_theme');
if (savedTheme === 'light') {
  applyTheme(true);
}
if (themeToggle) {
  themeToggle.addEventListener('click', () => {
    const nextIsLight = !document.body.classList.contains('light-theme');
    applyTheme(nextIsLight);
    localStorage.setItem('cdr_theme', nextIsLight ? 'light' : 'dark');
  });
}

$('#basis').querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{
  basis=b.dataset.b;
  $('#basis').querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b));
  render();
}));

function setTv(on){
  document.body.classList.toggle('tvmode',on);
  $('#tv').setAttribute('aria-pressed',on);
  clearInterval(tvTimer);
  const bar=$('#bar'); bar.style.transition='none'; bar.style.width='0%';
  if(!on) return;
  const tabs=[...document.querySelectorAll('#tabs button')];
  if (!tabs.length) return;
  const step=()=>{
    bar.style.transition='none'; bar.style.width='0%';
    requestAnimationFrame(()=>{bar.style.transition=`width ${CONFIG.TV_SEGUNDOS}s linear`;bar.style.width='100%';});
  };
  step();
  tvTimer=setInterval(()=>{
    const i=tabs.findIndex(t=>t.getAttribute('aria-selected')==='true');
    tabs[(i+1)%tabs.length].click(); step();
  },CONFIG.TV_SEGUNDOS*1000);
}
$('#tv').addEventListener('click',()=>setTv(!document.body.classList.contains('tvmode')));
document.addEventListener('keydown',e=>{if(e.key==='Escape')setTv(false);});

load();
if(CONFIG.ATUALIZAR_MIN>0) setInterval(load, CONFIG.ATUALIZAR_MIN*60*1000);
</script>
