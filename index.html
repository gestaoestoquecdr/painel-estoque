<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel de Estoque CD - Roldão Atacadista</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,600;0,700;0,800;1,700;1,800&family=Barlow+Semi+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  --bg:#050c1a; --panel:#0a1733; --panel2:#0f2046; --line:#1a3163;
  --text:#eaf0ff; --mute:#8da1cc; --accent:#ffc400;
  --blue:#4285f4; --navy:#3a5db0; --cream:#fce8b2;
  --ok:#35d49a; --warn:#ffb020; --crit:#ff5d62; --none:#5b6b8f;
  --f-body:'Montserrat', system-ui, sans-serif; 
  --f-num:'Barlow Semi Condensed', 'Montserrat', system-ui, sans-serif;
  --radius:10px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font-family:var(--f-body);font-size:15px;line-height:1.4;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 28px}
button, input, select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}

/* HEADER & BRANDING */
header{position:sticky;top:0;z-index:10;background:rgba(5, 12, 26, 0.92);backdrop-filter:blur(12px);display:flex;flex-wrap:wrap;align-items:center;gap:12px 24px;padding:12px 0;border-bottom:1px solid var(--line)}
.brand-container { display: flex; align-items: center; gap: 16px; }

/* LOGO ROLDÃO OFICIAL VETORIZADO */
.roldao-logo-wrap {
  display: flex;
  align-items: center;
  position: relative;
  overflow: hidden;
  border-radius: 8px;
  padding: 6px 14px;
  background: #002248;
  border: 1px solid rgba(255, 196, 0, 0.25);
  animation: logoEntrance 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
}
.roldao-logo-wrap:hover {
  transform: translateY(-2px) scale(1.02);
  border-color: var(--accent);
  box-shadow: 0 0 16px rgba(255, 196, 0, 0.35);
}

.roldao-logo-wrap::after {
  content: '';
  position: absolute;
  top: -50%;
  left: -150%;
  width: 100%;
  height: 200%;
  background: linear-gradient(60deg, transparent, rgba(255, 255, 255, 0.3), transparent);
  transform: rotate(25deg);
  animation: logoShimmer 4s infinite 1s;
}

.roldao-logo-svg {
  height: 38px;
  width: auto;
  display: block;
}

@keyframes logoEntrance {
  0% { opacity: 0; transform: scale(0.8) translateY(-8px); filter: blur(4px); }
  100% { opacity: 1; transform: scale(1) translateY(0); filter: blur(0); }
}

@keyframes logoShimmer {
  0% { left: -150%; }
  25%, 100% { left: 150%; }
}

.brand{display:flex;flex-direction:column;line-height:1.1}
.brand b{font-family:var(--f-body);font-size:20px;font-weight:700;letter-spacing:-.01em;color:#fff}
.brand small{color:var(--mute);font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:600}
nav{display:flex;gap:6px;flex-wrap:wrap}
nav button{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:9px 16px;font-weight:700;font-size:14px;transition:all .2s ease}
nav button:hover{border-color:var(--accent);transform:translateY(-1px)}
nav button[aria-selected="true"]{background:var(--accent);color:#1a1400;border-color:var(--accent);box-shadow:0 0 16px rgba(255,196,0,0.35)}
.tools{margin-left:auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{background:var(--panel);border:0;padding:8px 14px;font-size:13px;font-weight:600;color:var(--mute);transition:all .2s ease}
.seg button[aria-pressed="true"]{background:var(--panel2);color:var(--accent)}
.tv{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 14px;font-size:13px;font-weight:600;transition:all .2s ease}
.tv[aria-pressed="true"]{background:var(--accent);color:#1a1400}
#src{font-size:13px;color:var(--mute);width:100%;display:flex;gap:8px;align-items:center}
#src i{width:9px;height:9px;border-radius:50%;background:var(--warn);display:inline-block}
#src.live i{background:var(--ok)}
#bar{height:3px;background:var(--accent);width:0;position:fixed;left:0;top:0;z-index:99}

section{display:none;padding-top:20px}
section.on{display:block}
h2{font-family:var(--f-body);font-size:26px;font-weight:700;margin:0 0 6px;letter-spacing:-.01em}
.sub{color:var(--mute);margin:0 0 18px;font-size:14px}
.grid{display:grid;gap:16px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.two{grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);align-items:stretch}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:20px;min-width:0;box-shadow:0 8px 24px rgba(0,0,0,0.3);display:flex;flex-direction:column;justify-content:flex-start}
.card h3{margin:0 0 14px;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);font-weight:700}
.card-header-action { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; flex-wrap: wrap; gap: 8px; }
.card-header-action h3 { margin: 0; }
.kpi .v{font-family:var(--f-num);font-size:38px;font-weight:700;line-height:1.05}
.kpi .s{color:var(--mute);font-size:13px;margin-top:6px}
.kpi.hl{border-top:4px solid var(--accent)}
.good{color:var(--ok)} .warnc{color:var(--warn)} .critc{color:var(--crit)}

.filter-bar { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 16px; background: var(--panel2); padding: 12px 16px; border-radius: var(--radius); border: 1px solid var(--line); }
.filter-bar label { font-size: 14px; font-weight: 600; color: var(--mute); display: flex; align-items: center; gap: 8px; }
.filter-bar select, .filter-bar input { background: var(--panel); border: 1px solid var(--line); color: var(--text); padding: 7px 12px; border-radius: 6px; font-size: 14px; outline: none; transition: border-color .2s ease; }
.filter-bar select:focus, .filter-bar input:focus { border-color: var(--accent); }

.prod-controls { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }

.toggle-btn { display: inline-flex; align-items: center; gap: 8px; background: var(--panel2); border: 1px solid var(--line); color: var(--accent); padding: 8px 16px; border-radius: 6px; font-weight: 700; font-size: 14px; transition: all .2s ease; }
.toggle-btn:hover { background: var(--line); transform: translateY(-1px); }

.collapsible-content { display: none; margin-top: 14px; animation: fadeIn .25s ease-in-out; }
.collapsible-content.open { display: block; }

@keyframes fadeIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: translateY(0); } }

.sem-fisico-badge {
  background: rgba(255, 93, 98, 0.15);
  border: 1px solid var(--crit);
  border-radius: 6px;
  padding: 6px 12px;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-size: 13px;
  color: #ff8b8f;
  font-weight: 600;
}
.sem-fisico-badge b { color: var(--crit); font-family: var(--f-num); font-size: 16px; }

.donutwrap{display:flex;gap:20px;align-items:center;flex-wrap:wrap;justify-content:center;margin:auto 0;padding:12px 0;width:100%}
.donut{width:210px;height:210px;flex:none}
.donut text{fill:var(--text);font-family:var(--f-num)}
.legend{display:flex;flex-direction:column;gap:12px;min-width:200px;flex:1}
.legend div{display:flex;align-items:center;gap:10px;font-size:14px}
.legend i{width:14px;height:14px;border-radius:3px;flex:none}
.legend span:last-child{margin-left:auto;font-family:var(--f-num);font-weight:700;white-space:nowrap}

.tw{overflow-x:auto;width:100%}
table{border-collapse:collapse;width:100%;font-size:14px}
th{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);font-weight:700;white-space:nowrap}
td{padding:11px 12px;border-bottom:1px solid #12244b;white-space:nowrap}
tr:hover td{background:rgba(255,255,255,0.02)}
th.r,td.r{text-align:right;font-family:var(--f-num)}
tr.tot td{font-weight:700;border-top:2px solid var(--line);border-bottom:0}
td .dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px}
.bar{display:block;height:8px;background:#162a58;border-radius:4px;min-width:70px;margin-top:6px}
.bar b{display:block;height:100%;border-radius:4px}

.sep-progress { display: flex; flex-direction: column; gap: 14px; margin-top: 6px; }
.sep-item { display: flex; flex-direction: column; gap: 6px; }
.sep-header { display: flex; justify-content: space-between; font-size: 14px; font-weight:600; }
.sep-bar-bg { height: 12px; background: var(--panel2); border-radius: 6px; overflow: hidden; display: flex; }
.sep-bar-fill { height: 100%; transition: width 0.3s ease; }

.info-note {
  background: rgba(66, 133, 244, 0.1);
  border: 1px solid rgba(66, 133, 244, 0.3);
  border-radius: 8px;
  padding: 12px 16px;
  margin-top: 16px;
  font-size: 13px;
  color: #b0cdff;
  line-height: 1.4;
}
.info-note b { color: var(--accent); }

.occ { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 16px; align-items: stretch; }
.mini { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.mini .b { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 14px 10px; text-align: center; }
.mini .b small { display: block; color: var(--mute); font-size: 11px; text-transform: uppercase; margin-bottom: 4px; font-weight:600; }
.mini .b strong { font-family: var(--f-num); font-size: 26px; line-height: 1.1; }
.mini.g1 .b { border-left: 3px solid var(--blue); border-right: 3px solid var(--blue); }
.mini.g2 .b { border-left: 3px solid var(--navy); border-right: 3px solid var(--navy); }

.donutcard { display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding: 16px; }

.pcts { display: flex; flex-direction: column; gap: 12px; justify-content: center; min-width: 0; }
.pcts .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.pcts .b { background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 14px; text-align: center; min-width: 0; }
.pcts .b small { display: block; color: var(--mute); font-size: 11px; margin-bottom: 4px; font-weight:600; }
.pcts .b strong { font-family: var(--f-num); font-size: 24px; }
.pcts .big strong { font-size: 42px; color: var(--accent); }

.rua-container { overflow-x: auto; width: 100%; }
.rua { display: flex; gap: 12px; align-items: flex-end; height: 230px; padding-top: 10px; min-width: 600px; }
.rua .c { flex: 1; min-width: 32px; display: flex; flex-direction: column; align-items: stretch; height: 100%; }
.rua .stk { flex: 1; display: flex; flex-direction: column; border-radius: 4px; overflow: hidden; min-height: 0; }
.rua .lv { display: flex; align-items: center; justify-content: center; font-family: var(--f-num); font-size: 12px; font-weight: 600; overflow: hidden; min-height: 0; }
.rua .oc { background: var(--cream); color: #2b2205; }
.rua .name { text-align: center; font-family: var(--f-num); font-size: 14px; font-weight: 600; margin-top: 8px; color: var(--mute); }
.lg { display: flex; gap: 18px; font-size: 13px; color: var(--mute); margin-bottom: 10px; justify-content: center; }
.lg i { display: inline-block; width: 14px; height: 14px; border-radius: 3px; margin-right: 6px; vertical-align: -2px; }
.foot { color: var(--mute); font-size: 13px; margin-top: 18px; }

body.tvmode header nav, body.tvmode .seg, body.tvmode #src { display: none !important; }
body.tvmode header { border-bottom: 0; padding: 10px 0; }
body.tvmode .card { padding: 24px; }
body.tvmode h2 { font-size: 36px; }
body.tvmode .kpi .v { font-size: 52px; }

@media (max-width:820px){.two{grid-template-columns:minmax(0,1fr)}}
@media (prefers-reduced-motion:no-preference){#bar{transition:width .3s linear}}
</style>
</head>

<header>

<script>
const CONFIG = {
  DATA_URL: "./dados.json",
  ESTOQUE_FISICO: "ESTOQUE REVENDA",
  ATUALIZAR_MIN: 5,
  TV_SEGUNDOS: 20
};

const $ = s => document.querySelector(s);
const fmtN = new Intl.NumberFormat('pt-BR',{maximumFractionDigits:0});
const fmtP = (v,d=1)=> (isFinite(v)?v:0).toLocaleString('pt-BR',{minimumFractionDigits:d,maximumFractionDigits:d})+'%';
const brl = v => 'R$ '+new Intl.NumberFormat('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2}).format(v);
function brlShort(v){
  if(Math.abs(v)>=1e6) return 'R$ '+(v/1e6).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2})+' mi';
  if(Math.abs(v)>=1e3) return 'R$ '+(v/1e3).toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1})+' mil';
  return brl(v);
}
const esc = s => String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const nice = s => String(s).replace(/^ESTOQUE\s+/i,'').toLowerCase().replace(/(^|\s)\S/g,c=>c.toUpperCase());

let D = null;
let basis = 'custo';
let resFilter = 'todos';
let sepFilter = 'todos';
let destExpanded = false;
let destSearch = '';
let prodSearch = '';
let prodSortOrder = 'valor';
let estoqueProdSearch = '';
let estoqueProdSortOrder = 'valor';

let shelfSearch = '';
let shelfSortOrder = 'critico';
let agingSearch = '';
let agingSortOrder = 'critico';

let tvTimer = null;

const val = r => basis==='custo' ? r.custo : r.qtd;
const fmtV = v => basis==='custo' ? brlShort(v) : fmtN.format(v);

const SHELF_CLASS = {'0 a 5 dias':'crit','06 a 15 dias':'crit','16 a 30 dias':'warn','31 a 60 dias':'warn','61 a 90 dias':'ok','Acima de 90 dias':'ok','Sem data de Validade':'none'};
const AGING_CLASS = {'0 a 15 dias':'ok','16 a 30 dias':'ok','30 a 60 dias':'warn','Acima de 60 dias':'crit'};
const CLS = {ok:{n:'Saudável',c:'var(--ok)'},warn:{n:'Atenção',c:'var(--warn)'},crit:{n:'Crítico',c:'var(--crit)'},none:{n:'Sem validade',c:'var(--none)'}};
const normF = s => String(s||'').replace(/\s+/g,' ').trim();

function getProp(obj, propNames) {
  if (!obj || typeof obj !== 'object') return '';
  const keys = Object.keys(obj);
  for (let name of propNames) {
    const target = name.toLowerCase().replace(/\s+/g, '');
    const foundKey = keys.find(k => k.toLowerCase().replace(/\s+/g, '') === target);
    if (foundKey && obj[foundKey] !== undefined && obj[foundKey] !== null) {
      return String(obj[foundKey]).trim();
    }
  }
  return '';
}

function extractList(source) {
  if (Array.isArray(source)) return source;
  if (source && typeof source === 'object') {
    if (Array.isArray(source.data)) return source.data;
    if (Array.isArray(source.rows)) return source.rows;
    if (Array.isArray(source.items)) return source.items;
    const vals = Object.values(source).filter(v => v && typeof v === 'object');
    if (vals.length > 0) return vals;
  }
  return [];
}

async function fromJsonFile(){
  const res = await fetch(CONFIG.DATA_URL + '?t=' + Date.now(), { cache: 'no-store' });
  if (!res.ok) throw new Error('Não foi possível carregar dados.json (HTTP ' + res.status + ').');
  const data = await res.json();
  
  const jsonKeys = Object.keys(data);
  let rawAddr = extractList(data.ocupacao);
  if (rawAddr.length === 0) {
    for (let k of jsonKeys) {
      if (k.toLowerCase().includes('1682') || k.toLowerCase().includes('enderec')) {
        rawAddr = extractList(data[k]);
        if (rawAddr.length > 0) break;
      }
    }
  }
  
  const rawRows = extractList(data.dados1926);
  const rawCart = extractList(data.carteira || data.dados1666 || data["1666 - Carteira de Pedido"]);
  
  const rows = rawRows.map(o => ({
    est: getProp(o, ["Local de Estoque"]).trim(),
    status: normF(getProp(o, ["Status"])),
    shelf: normF(getProp(o, ["Desc Shelf"])),
    aging: normF(getProp(o, ["Faixa Anging ", "Faixa Anging", "Faixa Aging"])),
    qtd: +(getProp(o, ["Qtd. Endereçada", "Qtd Enderecada"]) || 0),
    custo: +(getProp(o, ["Custo Bruto Total"]) || 0),
    codProd: getProp(o, ["Código Interno", "Codigo Interno", "Código Produto", "Codigo Produto", "Cód. Prod.", "Cod. Prod", "Código", "Codigo", "SKU"]) || "-",
    gtin: getProp(o, ["GTIN", "EAN", "Cod. Barras", "Código de Barras", "Codigo de Barras"]) || "-",
    prod: getProp(o, ["Produto"]).slice(0,60),
    end: getProp(o, ["Endereço Logístico", "Endereco Logistico", "Endereço", "Endereco"])
  })).filter(r => r.est !== "" && r.est.toLowerCase() !== "null");

  const addr = rawAddr.map(o => {
    const statusVal = getProp(o, ["Status"]);
    const ocupVal = getProp(o, ["Endereço ocupado", "Endereco ocupado", "Status da Ocupação", "Status da Ocupacao"]);
    const areaVal = getProp(o, ["Area", "AREA"]);
    const ruaVal = getProp(o, ["Rua", "RUA"]);
    const endStr = getProp(o, ["Endereço", "Endereco", "Endereço Logístico", "Endereco Logistico"]);
    
    return {
      end: endStr,
      area: areaVal,
      rua: +ruaVal || 0,
      occ: ocupVal.toLowerCase() === 'ocupado',
      ativo: statusVal.toLowerCase() === 'ativo' || statusVal.toLowerCase() === 'ativa' || statusVal === ''
    };
  }).filter(a => a.ativo);

  const cart = rawCart.map(o => {
    let dtRes = getProp(o, ["Geração Reserva", "Geracao Reserva"]);
    if (dtRes && dtRes.includes('T')) dtRes = dtRes.split('T')[0];
    if (dtRes && dtRes.includes(' ')) dtRes = dtRes.split(' ')[0];
    let formattedDt = dtRes;
    if (dtRes && dtRes.includes('-')) {
      const parts = dtRes.split('-');
      if (parts.length === 3) formattedDt = parts[2] + '.' + parts[1];
    }
    return {
      codProd: getProp(o, ["Código Interno", "Codigo Interno", "Código Produto", "Codigo Produto", "Cód. Prod.", "Cod. Prod", "Código", "Codigo", "SKU"]) || "-",
      gtin: getProp(o, ["GTIN", "EAN", "Cod. Barras", "Código de Barras", "Codigo de Barras"]) || "-",
      prod: getProp(o, ["Produto", "Desc. Produto", "Descrição", "Descricao"]) || "Não informado",
      dest: getProp(o, ["Destinatário", "Destinatario", "Loja"]),
      dept: getProp(o, ["Departamento CD", "Departamento"]) || "Outros",
      tipoSep: getProp(o, ["Tipo de separação", "Tipo de separacao", "Tipo Separação"]) || "Não informado",
      gerReserva: formattedDt || "Sem data",
      qtdPedida: +(getProp(o, ["Qtd Pedida", "Qtd. Pedida"]) || 0),
      qtdSeparada: +(getProp(o, ["Qtd Separada", "Qtd. Separada"]) || 0),
      valorTotal: +(getProp(o, ["Valor Total", "Valor"]) || 0)
    };
  });

  let timeStr = 'JSON';
  if (data.ultimaAtualizacao) {
    const dt = new Date(data.ultimaAtualizacao);
    timeStr = dt.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
  }

  return { rows, addr, cart, live: true, when: 'Atualizado às ' + timeStr };
}

function aviso(msg){
  const srcTxt = $('#srctxt');
  if (srcTxt) srcTxt.textContent = msg;
  document.querySelectorAll('section').forEach(s=>{ s.innerHTML = '<div class="card"><h3>Aviso</h3><p>'+esc(msg)+'</p></div>'; });
}

async function load(){
  try {
    const d = await fromJsonFile();
    D = d;
    $('#src').className = 'live';
    $('#srctxt').textContent = d.when;
    renderNav();
    render();
  } catch(err) {
    console.error('Erro ao carregar dados:', err);
    aviso('Erro ao carregar dados: ' + err.message);
  }
}

function donut(items,center,sub){
  if (!items || !items.length) return '<p style="color:var(--mute)">Sem dados para gráfico</p>';
  const tot = items.reduce((s,i)=>s+i.v,0)||1, R=75, C=2*Math.PI*R; let off=0, segs='';
  items.forEach(i=>{ const L=C*i.v/tot; if(L>0) segs+=`<circle r="${R}" cx="100" cy="100" fill="none" stroke="${i.c}" stroke-width="26" stroke-dasharray="${L} ${C-L}" stroke-dashoffset="${-off}" transform="rotate(-90 100 100)"><title>${esc(i.n)}: ${fmtV(i.v)} (${fmtP(i.v/tot*100)})</title></circle>`; off+=L; });
  return `<svg class="donut" viewBox="0 0 200 200" role="img" aria-label="${esc(sub||'Gráfico de rosca')}"><circle r="${R}" cx="100" cy="100" fill="none" stroke="#162e5c" stroke-width="26"/>${segs}
    <text x="100" y="${sub?98:106}" text-anchor="middle" font-size="${String(center).length>5?24:30}" font-weight="700">${center}</text>${sub?`<text x="100" y="122" text-anchor="middle" font-size="13" style="fill:var(--mute)">${sub}</text>`:''}</svg>`;
}

function legend(items){
  if (!items || !items.length) return '';
  const tot = items.reduce((s,i)=>s+i.v,0)||1;
  return `<div class="legend">${items.map(i=>`<div><i style="background:${i.c}"></i><span>${esc(i.n)}</span><span>${fmtV(i.v)} · ${fmtP(i.v/tot*100)}</span></div>`).join('')}</div>`;
}

const COLOR_MAP = {
  'revenda': '#ffc400',
  'virtual': '#ff5d62',
  'pre alerta': '#ff8b8f',
  'pré alerta': '#ff8b8f',

};

function secGeral(){
  const R = D.rows, by = {};
  let semFisicoVal = 0;

  R.forEach(r => {
    if(!r.est || r.est.toLowerCase() === 'null') return;
    by[r.est] = by[r.est] || {custo:0, qtd:0, n:0};
    by[r.est].custo += r.custo;
    by[r.est].qtd += r.qtd;
    by[r.est].n++;
  });
  
  const ests = Object.entries(by).filter(([n,o]) => n && n.toLowerCase() !== 'null' && (o.custo > 0 || o.qtd > 0)).sort((a,b) => (basis==='custo' ? b[1].custo - a[1].custo : b[1].qtd - a[1].qtd));
  const totC = R.reduce((s,r)=>s+r.custo,0), totQ = R.reduce((s,r)=>s+r.qtd,0);
  const totV = basis==='custo' ? totC : totQ;
  
  const items = ests.map(([n,o],i) => {
    const key = n.toLowerCase().trim();
    const valItem = basis==='custo' ? o.custo : o.qtd;
    
    if (key.includes('virtual') || key.includes('pre alerta') || key.includes('pré alerta')) {
      semFisicoVal += valItem;
    }

    return {
      n: nice(n),
      v: valItem,
      c: COLOR_MAP[key] || DEFAULT_COLORS[i % DEFAULT_COLORS.length]
    };
  });
  
  const rev = R.filter(r=>r.est.trim()===CONFIG.ESTOQUE_FISICO);
  const st = {}; 
  rev.forEach(r => {
    st[r.status] = st[r.status] || {custo:0, qtd:0, n:0};
    st[r.status].custo += r.custo;
    st[r.status].qtd += r.qtd;
    st[r.status].n++;
  });
  
  const stRows = Object.entries(st).sort((a,b) => b[1].custo - a[1].custo);
  const rc = rev.reduce((s,r)=>s+r.custo,0), rq = rev.reduce((s,r)=>s+r.qtd,0);
  const occ = occData();
  
  const centerLabel = basis==='custo' ? brlShort(totC).replace('R$ ','') : fmtN.format(totQ);
  const subLabel = basis==='custo' ? 'custo bruto' : 'qtd. endereçada';
  const cardTitle = basis==='custo' ? 'VALOR POR LOCAL DE ESTOQUE (R$)' : 'QUANTIDADE POR LOCAL DE ESTOQUE';
  const semFisicoPct = totV ? (semFisicoVal / totV) * 100 : 0;

  const prodMap = {};
  R.forEach(r => {
    const k = (r.codProd && r.codProd !== '-') ? r.codProd : r.prod;
    if (!prodMap[k]) {
      prodMap[k] = { codProd: r.codProd, gtin: r.gtin, prod: r.prod, qtd: 0, custo: 0, est: r.est, end: r.end };
    }
    prodMap[k].qtd += r.qtd;
    prodMap[k].custo += r.custo;
    if (r.gtin && r.gtin !== '-') prodMap[k].gtin = r.gtin;
    if (r.codProd && r.codProd !== '-') prodMap[k].codProd = r.codProd;
    if (r.end && !prodMap[k].end) prodMap[k].end = r.end;
  });

  let listEstoqueProds = Object.values(prodMap);
  if (estoqueProdSearch) {
    const q = estoqueProdSearch.toLowerCase();
    listEstoqueProds = listEstoqueProds.filter(p => 
      p.prod.toLowerCase().includes(q) || 
      p.codProd.toLowerCase().includes(q) || 
      p.gtin.toLowerCase().includes(q) || 
      p.est.toLowerCase().includes(q) ||
      (p.end && p.end.toLowerCase().includes(q))
    );
  }

  if (estoqueProdSortOrder === 'valor') {
    listEstoqueProds.sort((a,b) => b.custo - a.custo);
  } else {
    listEstoqueProds.sort((a,b) => b.qtd - a.qtd);
  }

  const topEstoqueProds = listEstoqueProds.slice(0, 25);

  $('#s-geral').innerHTML = `<h2>Visão geral</h2><p class="sub">Estoque endereçado nos locais de estoque.</p>
  <div class="grid kpis">
    ${kpi('Custo bruto total',brlShort(totC),brl(totC),'hl')}
    ${kpi('Qtd. endereçada total',fmtN.format(totQ),fmtN.format(R.length)+' linhas de palete')}
    ${kpi('Estoque revenda',brlShort(rc),fmtN.format(rq)+' endereçados · '+fmtP(rc/totC*100)+' do valor')}
    ${kpi('Ocupação do CD',fmtP(occ.pct,2),fmtN.format(occ.ocup)+' de '+fmtN.format(occ.total)+' endereços')}
  </div>
  <div class="grid two" style="margin-top:16px">
    <div class="card">
      <div class="card-header-action">
        <h3>${cardTitle}</h3>
        <div class="sem-fisico-badge" title="Soma do estoque Virtual e Pré Alerta">
          🚨 Sem Físico: <b>${fmtV(semFisicoVal)} (${fmtP(semFisicoPct)})</b>
        </div>
      </div>
      <div class="donutwrap">${donut(items, centerLabel, subLabel)}${legend(items)}</div>
    </div>
    <div class="card"><h3>Status do estoque revenda</h3><div class="tw"><table>
      <tr><th>Status</th><th class="r">Linhas</th><th class="r">Qtd. endereçada</th><th class="r">Custo bruto</th><th class="r">% do valor</th></tr>
      ${stRows.map(([n,o])=>`<tr><td>${esc(n)}</td><td class="r">${fmtN.format(o.n)}</td><td class="r">${fmtN.format(o.qtd)}</td><td class="r">${brl(o.custo)}</td><td class="r">${fmtP(o.custo/rc*100)}</td></tr>`).join('')}
      <tr class="tot"><td>Total</td><td class="r">${fmtN.format(rev.length)}</td><td class="r">${fmtN.format(rq)}</td><td class="r">${brl(rc)}</td><td class="r">100,0%</td></tr></table></div></div>
  </div>
  <div class="card" style="margin-top:16px"><h3>Valor e quantidade por local de estoque</h3><div class="tw"><table>
    <tr><th>Local</th><th class="r">Linhas</th><th class="r">Qtd. endereçada</th><th class="r">Custo bruto</th><th>Participação</th></tr>
    ${ests.map(([n,o],i) => {
      const v = basis==='custo' ? o.custo : o.qtd;
      const key = n.toLowerCase().trim();
      const color = COLOR_MAP[key] || DEFAULT_COLORS[i % DEFAULT_COLORS.length];
      return `<tr><td><span class="dot" style="background:${color}"></span>${esc(nice(n))}</td><td class="r">${fmtN.format(o.n)}</td><td class="r">${fmtN.format(o.qtd)}</td><td class="r">${brl(o.custo)}</td><td><span class="num">${fmtP(v/totV*100)}</span><span class="bar"><b style="width:${v/totV*100}%;background:${color}"></b></span></td></tr>`;
    }).join('')}
  </table></div></div>

  <div class="card" style="margin-top:16px">
    <div class="card-header-action">
      <h3>📦 TOP PRODUTOS EM ESTOQUE NO CD (${listEstoqueProds.length} encontrados)</h3>
      <div class="prod-controls">
        <input type="text" id="inputEstoqueProdSearch" placeholder="🔍 Buscar código / GTIN / produto / endereço..." value="${esc(estoqueProdSearch)}" style="width:300px" />
        <select id="selectEstoqueProdSort">
          <option value="valor" ${estoqueProdSortOrder==='valor'?'selected':''}>Ordenar por Maior Valor (R$)</option>
          <option value="qtd" ${estoqueProdSortOrder==='qtd'?'selected':''}>Ordenar por Maior Qtd Endereçada</option>
        </select>
      </div>
    </div>
    <div class="tw">
      <table>
        <thead>
          <tr>
            <th>Cód. Interno</th>
            <th>GTIN (EAN)</th>
            <th>Produto</th>
            <th>Local Estoque</th>
            <th class="r">Qtd. Endereçada</th>
            <th class="r">Custo Bruto Total</th>
          </tr>
        </thead>
        <tbody>
          ${topEstoqueProds.length ? topEstoqueProds.map(p => `
            <tr>
              <td><span class="num" style="color:var(--accent);font-weight:700">${esc(p.codProd)}</span></td>
              <td><span class="num" style="color:var(--mute);font-weight:600">${esc(p.gtin)}</span></td>
              <td><b>${esc(p.prod)}</b></td>
              <td><span class="dot" style="background:var(--accent)"></span>${esc(nice(p.est))}</td>
              <td class="r" style="font-weight:700;color:var(--ok)">${fmtN.format(p.qtd)}</td>
              <td class="r" style="font-weight:700;color:var(--text)">${brl(p.custo)}</td>
            </tr>
          `).join('') : '<tr><td colspan="6">Nenhum produto encontrado.</td></tr>'}
        </tbody>
      </table>
    </div>
  </div>`;

  const epSearch = $('#inputEstoqueProdSearch');
  if (epSearch) {
    epSearch.addEventListener('input', (e) => {
      estoqueProdSearch = e.target.value;
      secGeral();
      const el = $('#inputEstoqueProdSearch');
      if (el) { el.focus(); el.setSelectionRange(estoqueProdSearch.length, estoqueProdSearch.length); }
    });
  }

  const epSort = $('#selectEstoqueProdSort');
  if (epSort) {
    epSort.addEventListener('change', (e) => {
      estoqueProdSortOrder = e.target.value;
      secGeral();
    });
  }
}

function faixaSection(id,title,sub,field,order,cmap,topCls,topTitle, filterFisicoOnly = false, tabType = 'shelf'){
  const allowedStatus = ['disponivel', 'disponível', 'reservado', 'pendente de saída', 'pendente de saida', 'pendente saída', 'pendente saida'];
  
  const rev = D.rows.filter(r => {
    if (r.est.trim() !== CONFIG.ESTOQUE_FISICO) return false;
    if (filterFisicoOnly) {
      const st = r.status.toLowerCase().trim();
      return allowedStatus.includes(st);
    }
    return true;
  });

  const g = {}; order.forEach(f=>g[f]={custo:0,qtd:0,n:0});
  rev.forEach(r=>{const f=r[field]; (g[f]=g[f]||{custo:0,qtd:0,n:0}); g[f].custo+=r.custo; g[f].qtd+=r.qtd; g[f].n++;});
  const cls = {ok:0,warn:0,crit:0,none:0}; rev.forEach(r=>cls[cmap[r[field]]||'none']+=val(r));
  const tot = Object.values(cls).reduce((a,b)=>a+b,0)||1, comVal = tot-cls.none||1;
  const items = ['ok','warn','crit','none'].filter(k=>cls[k]>0).map(k=>({n:CLS[k].n,v:cls[k],c:CLS[k].c}));
  const pctOk = cls.ok/comVal*100, totB = Object.values(g).reduce((s,o)=>s+(basis==='custo'?o.custo:o.qtd),0)||1;
  
  let top = rev.filter(r => topCls.includes(r[field]));

  const currentSearch = tabType === 'shelf' ? shelfSearch : agingSearch;
  const currentSort = tabType === 'shelf' ? shelfSortOrder : agingSortOrder;

  if (currentSearch) {
    const q = currentSearch.toLowerCase();
    top = top.filter(r => 
      r.prod.toLowerCase().includes(q) || 
      r.codProd.toLowerCase().includes(q) || 
      r.gtin.toLowerCase().includes(q) || 
      (r.end && r.end.toLowerCase().includes(q))
    );
  }

  if (currentSort === 'critico') {
    top.sort((a, b) => {
      const idxA = topCls.indexOf(a[field]);
      const idxB = topCls.indexOf(b[field]);
      if (idxA !== idxB) {
        return idxA - idxB;
      }
      return b.custo - a.custo;
    });
  } else if (currentSort === 'valor') {
    top.sort((a, b) => b.custo - a.custo);
  } else if (currentSort === 'qtd') {
    top.sort((a, b) => b.qtd - a.qtd);
  }

  const inputId = tabType === 'shelf' ? 'inputShelfSearch' : 'inputAgingSearch';
  const selectId = tabType === 'shelf' ? 'selectShelfSort' : 'selectAgingSort';

  const critV = cls.crit, critN = rev.filter(r=>cmap[r[field]]==='crit').length;
  $(id).innerHTML = `<h2>${title}</h2><p class="sub">${sub}</p>
  <div class="grid kpis">
    ${kpi('Estoque revenda',fmtV(rev.reduce((s,r)=>s+val(r),0)),fmtN.format(rev.length)+' linhas de palete')}
    ${kpi('Saudável',`<span class="good">${fmtP(pctOk)}</span>`,fmtV(cls.ok)+(cls.none?' · sem validade fora da conta':''))}
    ${kpi('Em atenção',`<span class="warnc">${fmtP(cls.warn/comVal*100)}</span>`,fmtV(cls.warn))}
    ${kpi('Crítico',`<span class="critc">${fmtP(cls.crit/comVal*100)}</span>`,fmtV(critV)+' · '+fmtN.format(critN)+' linhas')}
  </div>
  <div class="grid two" style="margin-top:16px">
    <div class="card"><h3>Saúde do estoque revenda</h3><div class="donutwrap">${donut(items,fmtP(pctOk,0),'saudável')}${legend(items)}</div></div>
    <div class="card"><h3>Por faixa</h3><div class="tw"><table>
      <tr><th>Faixa</th><th class="r">Linhas</th><th class="r">Qtd. endereçada</th><th class="r">Custo bruto</th><th>Participação</th></tr>
      ${order.map(f=>{const o=g[f],c=CLS[cmap[f]||'none'].c,v=basis==='custo'?o.custo:o.qtd;return `<tr><td><span class="dot" style="background:${c}"></span>${esc(f)}</td><td class="r">${fmtN.format(o.n)}</td><td class="r">${fmtN.format(o.qtd)}</td><td class="r">${brl(o.custo)}</td><td><span class="num">${fmtP(v/totB*100)}</span><span class="bar"><b style="width:${v/totB*100}%;background:${c}"></b></span></td></tr>`}).join('')}
    </table></div></div>
  </div>
  <div class="card" style="margin-top:16px">
    <div class="card-header-action">
      <h3>${topTitle} (${top.length} linhas encontradas)</h3>
      <div class="prod-controls">
        <input type="text" id="${inputId}" placeholder="🔍 Buscar código / GTIN / produto / endereço..." value="${esc(currentSearch)}" style="width:300px" />
        <select id="${selectId}">
          <option value="critico" ${currentSort==='critico'?'selected':''}>Ordenar por Mais Crítico</option>
          <option value="valor" ${currentSort==='valor'?'selected':''}>Ordenar por Maior Valor (R$)</option>
          <option value="qtd" ${currentSort==='qtd'?'selected':''}>Ordenar por Maior Qtd Endereçada</option>
        </select>
      </div>
    </div>
    <div class="tw">
      <table>
        <thead>
          <tr>
            <th>Cód. Interno</th>
            <th>GTIN (EAN)</th>
            <th>Produto</th>
            <th>Endereço</th>
            <th>Status</th>
            <th>Faixa</th>
            <th class="r">Qtd.</th>
            <th class="r">Custo bruto</th>
          </tr>
        </thead>
        <tbody>
          ${top.length ? top.map(r => {
            const classKey = cmap[r[field]] || 'none';
            const badgeColor = CLS[classKey].c;
            return `<tr>
              <td><span class="num" style="color:var(--accent);font-weight:700">${esc(r.codProd)}</span></td>
              <td><span class="num" style="color:var(--mute);font-weight:600">${esc(r.gtin)}</span></td>
              <td><b>${esc(r.prod)}</b></td>
              <td>${esc(r.end)}</td>
              <td>${esc(r.status)}</td>
              <td><span class="dot" style="background:${badgeColor}"></span><b>${esc(r[field])}</b></td>
              <td class="r" style="font-weight:700">${fmtN.format(r.qtd)}</td>
              <td class="r" style="font-weight:700">${brl(r.custo)}</td>
            </tr>`;
          }).join('') : '<tr><td colspan="8">Nenhum item encontrado nesta faixa.</td></tr>'}
        </tbody>
      </table>
    </div>
  </div>`;

  const sInput = $('#' + inputId);
  if (sInput) {
    sInput.addEventListener('input', (e) => {
      if (tabType === 'shelf') shelfSearch = e.target.value;
      else agingSearch = e.target.value;
      if (tabType === 'shelf') secShelf(); else secAging();
      const el = $('#' + inputId);
      if (el) { 
        const valLen = (tabType === 'shelf' ? shelfSearch : agingSearch).length;
        el.focus(); 
        el.setSelectionRange(valLen, valLen); 
      }
    });
  }

  const sSort = $('#' + selectId);
  if (sSort) {
    sSort.addEventListener('change', (e) => {
      if (tabType === 'shelf') shelfSortOrder = e.target.value;
      else agingSortOrder = e.target.value;
      if (tabType === 'shelf') secShelf(); else secAging();
    });
  }
}

function occData(){
  const g1 = {total:0, ocup:0, ruas:{}};
  const g2 = {total:0, ocup:0, ruas:{}};
  const bl = {total:0, ocup:0};
  
  if (D && D.addr) {
    D.addr.forEach(a=>{
      const area = String(a.area);
      const end = String(a.end);
      
      const isG1 = area === '1' || end.includes("205.1041.1.");
      const isG2 = area === '7' || end.includes("205.1041.7.");
      const isBlocado = area === '5' || end.includes("205.1066.");
      
      let rua = a.rua;
      if (!rua) {
        const p = end.split('.');
        rua = p.length >= 4 ? +p[3] : 0;
      }
      
      if (isG1) {
        g1.total++;
        if (a.occ) g1.ocup++;
        if (rua > 0) {
          const r = (g1.ruas[rua] = g1.ruas[rua] || {t:0, o:0});
          r.t++; if (a.occ) r.o++;
        }
      } else if (isG2) {
        g2.total++;
        if (a.occ) g2.ocup++;
        if (rua > 0) {
          const r = (g2.ruas[rua] = g2.ruas[rua] || {t:0, o:0});
          r.t++; if (a.occ) r.o++;
        }
      } else if (isBlocado) {
        bl.total++;
        if (a.occ) bl.ocup++;
      }
    });
  }

  const total = g1.total + g2.total;
  const ocup = g1.ocup + g2.ocup;
  return {g1, g2, bl, total, ocup, pct: total ? (ocup/total)*100 : 0};
}

function ruaBars(g,livreCor){
  const ruas = Object.entries(g.ruas).filter(([,r])=>r.t>=1).sort((a,b)=>+a[0]-+b[0]);
  if(!ruas.length) return '<p style="color:var(--mute)">Nenhuma rua mapeada para esta área.</p>';
  return `<div class="lg"><span><i style="background:${livreCor}"></i>Livre</span><span><i style="background:var(--cream)"></i>Ocupado</span></div>
  <div class="rua-container"><div class="rua">${ruas.map(([n,r])=>{const o=r.o/r.t*100,l=100-o;return `<div class="c"><div class="stk" title="Rua ${n}: ${fmtN.format(r.o)} ocupados de ${fmtN.format(r.t)}">
    <div class="lv" style="flex:${l};background:${livreCor};color:#fff">${l>=8?fmtP(l,1):''}</div>
    <div class="lv oc" style="flex:${Math.max(o,2)}">${o>=8?fmtP(o,1):''}</div></div><div class="name">${n}</div></div>`}).join('')}</div></div>`;
}

    <div class="pcts">

        <div class="b"><small>% Galpão 2</small><strong>${fmtP(O.g2.total?O.g2.ocup/O.g2.total*100:0,2)}</strong></div>
      </div>

    </div>
  </div>

function secCarteira(){
  let C = (D && D.cart) ? D.cart : [];
  if (!C.length) {
    $('#s-carteira').innerHTML = `<h2>Carteira de Pedido</h2><p class="sub">Nenhum dado encontrado na chave 'carteira' do JSON.</p>`;
    return;
  }

  const tiposSepDisponiveis = Array.from(new Set(C.map(r => r.tipoSep))).filter(Boolean);

  let filteredC = C;
  if (sepFilter !== 'todos') {
    filteredC = C.filter(r => r.tipoSep === sepFilter);
  }

  const totPedida = filteredC.reduce((s,r) => s + r.qtdPedida, 0);
  const totSeparada = filteredC.reduce((s,r) => s + r.qtdSeparada, 0);
  const totValor = filteredC.reduce((s,r) => s + r.valorTotal, 0);
  const pctAtendimento = totPedida ? (totSeparada / totPedida) * 100 : 0;

  const datasPendentesSet = new Set();
  filteredC.forEach(r => {
    if (r.tipoSep !== 'Separado') {
      if (r.gerReserva && r.gerReserva !== 'Sem data') {
        datasPendentesSet.add(r.gerReserva);
      }
    }
  });

  const qtdDatasPendentes = datasPendentesSet.size;
  const diasAtraso = qtdDatasPendentes; 
  const isCritico = diasAtraso >= 2;
  const atrasoStr = `D-${diasAtraso}`;
  const atrasoSub = isCritico ? `🚨 CRÍTICO (${qtdDatasPendentes} datas pendentes)` : `Dentro da Meta (${qtdDatasPendentes} datas pendentes)`;
  const kpiClassAtraso = isCritico ? 'hl' : '';

  const bySep = {};
  filteredC.forEach(r => {
    const k = r.tipoSep || 'Não informado';
    bySep[k] = bySep[k] || {pedida:0, separada:0, valor:0};
    bySep[k].pedida += r.qtdPedida;
    bySep[k].separada += r.qtdSeparada;
    bySep[k].valor += r.valorTotal;
  });

  const prodDer = bySep["Produção Derrubada"] || {pedida:0, separada:0};
  const prodSor = bySep["Produção Sorter"] || {pedida:0, separada:0};
  const pendDer = bySep["Pendente Derrubada"] || {pedida:0, separada:0};
  const pendSor = bySep["Pendente Sorter"] || {pedida:0, separada:0};
  
  const crossDock = bySep["Cross Docking"] || bySep["CROSS DOCKING"] || {pedida:0, separada:0};
  const fullSep = bySep["Full"] || bySep["FULL"] || {pedida:0, separada:0};

  const derTotQtd = prodDer.pedida + pendDer.pedida;
  const derPctProd = derTotQtd ? (prodDer.pedida / derTotQtd) * 100 : 0;
  const derPctPend = derTotQtd ? (pendDer.pedida / derTotQtd) * 100 : 0;

  const sorTotQtd = prodSor.pedida + pendSor.pedida;
  const sorPctProd = sorTotQtd ? (prodSor.pedida / sorTotQtd) * 100 : 0;
  const sorPctPend = sorTotQtd ? (pendSor.pedida / sorTotQtd) * 100 : 0;

  const cdTotQtd = crossDock.pedida;
  const cdPendQtd = Math.max(0, crossDock.pedida - crossDock.separada);
  const cdPctPend = cdTotQtd ? (cdPendQtd / cdTotQtd) * 100 : 0;
  const cdPctSep = cdTotQtd ? (crossDock.separada / cdTotQtd) * 100 : 0;

  const fullTotQtd = fullSep.pedida;
  const fullPendQtd = Math.max(0, fullSep.pedida - fullSep.separada);
  const fullPctPend = fullTotQtd ? (fullPendQtd / fullTotQtd) * 100 : 0;
  const fullPctSep = fullTotQtd ? (fullSep.separada / fullTotQtd) * 100 : 0;

  const byDept = {};
  filteredC.forEach(r => {
    const k = r.dept || 'Outros';
    byDept[k] = byDept[k] || {qtd:0, valor:0};
    byDept[k].qtd += r.qtdPedida;
    byDept[k].valor += r.valorTotal;
  });
  const deptRows = Object.entries(byDept).sort((a,b) => (basis==='custo' ? b[1].valor - a[1].valor : b[1].qtd - a[1].qtd));
  const deptItems = deptRows.map(([n,o],i) => ({
    n: n,
    v: basis==='custo' ? o.valor : o.qtd,
    c: DEFAULT_COLORS[i % DEFAULT_COLORS.length]
  }));
  const centerDept = basis==='custo' ? brlShort(totValor).replace('R$ ','') : fmtN.format(totPedida);

  const byRes = {};
  filteredC.forEach(r => {
    const k = r.gerReserva || 'Sem data';
    byRes[k] = byRes[k] || {qtd:0, valor:0, qtdSep:0, pendentes:0, separados:0};
    byRes[k].qtd += r.qtdPedida;
    byRes[k].valor += r.valorTotal;
    byRes[k].qtdSep += r.qtdSeparada;
    if (r.tipoSep === 'Separado' || (r.qtdPedida > 0 && r.qtdPedida === r.qtdSeparada)) {
      byRes[k].separados++;
    } else {
      byRes[k].pendentes++;
    }
  });
  let resRows = Object.entries(byRes).sort((a,b) => a[0].localeCompare(b[0]));
  if (resFilter === 'pendente') {
    resRows = resRows.filter(([, o]) => o.pendentes > 0);
  } else if (resFilter === 'separado') {
    resRows = resRows.filter(([, o]) => o.pendentes === 0);
  }

  const byDest = {};
  filteredC.forEach(r => {
    const k = r.dest || "Sem Destino";
    byDest[k] = byDest[k] || {pedida:0, separada:0, valor:0};
    byDest[k].pedida += r.qtdPedida;
    byDest[k].separada += r.qtdSeparada;
    byDest[k].valor += r.valorTotal;
  });
  let destRows = Object.entries(byDest).sort((a,b) => b[1].pedida - a[1].pedida);
  if (destSearch) {
    destRows = destRows.filter(([k]) => k.toLowerCase().includes(destSearch.toLowerCase()));
  }

  let prodsPendentes = [];
  filteredC.forEach(r => {
    const pendQtd = r.qtdPedida - r.qtdSeparada;
    if (pendQtd > 0) {
      const pendValor = r.qtdPedida ? (r.valorTotal * (pendQtd / r.qtdPedida)) : 0;
      prodsPendentes.push({
        codProd: r.codProd || '-',
        gtin: r.gtin || '-',
        prod: r.prod || 'Sem Descrição',
        tipoSep: r.tipoSep || '-',
        dest: r.dest || '-',
        qtdPend: pendQtd,
        valorPend: pendValor
      });
    }
  });

  if (prodSearch) {
    const q = prodSearch.toLowerCase();
    prodsPendentes = prodsPendentes.filter(p => 
      p.prod.toLowerCase().includes(q) || 
      p.codProd.toLowerCase().includes(q) || 
      p.gtin.toLowerCase().includes(q) || 
      String(p.dest).toLowerCase().includes(q)
    );
  }

  if (prodSortOrder === 'valor') {
    prodsPendentes.sort((a,b) => b.valorPend - a.valorPend);
  } else {
    prodsPendentes.sort((a,b) => b.qtdPend - a.qtdPend);
  }

  const topProdsPendentes = prodsPendentes.slice(0, 25);

  $('#s-carteira').innerHTML = `
  <h2>Carteira de Pedido</h2>
  <p class="sub">Acompanhamento e status das reservas e solicitações do CD.</p>
  
  <div class="filter-bar">
    <label>⚡ Filtrar Tipo de Separação:
      <select id="sepFilterSelect">
        <option value="todos" ${sepFilter==='todos'?'selected':''}>-- Todos os Tipos (${C.length} itens) --</option>
        ${tiposSepDisponiveis.map(t => `<option value="${esc(t)}" ${sepFilter===t?'selected':''}>${esc(t)}</option>`).join('')}
      </select>
    </label>
  </div>

  <div class="grid kpis">
    ${kpi('Total Pedido', fmtN.format(totPedida), brlShort(totValor))}
    ${kpi('Total Separado', fmtN.format(totSeparada), fmtP(pctAtendimento) + ' atendido')}
    ${kpi('Pendente de Separação', fmtN.format(totPedida - totSeparada), brlShort(filteredC.reduce((s,r) => s + (r.tipoSep !== 'Separado' ? r.valorTotal : 0), 0)))}
    ${kpi('Indicador de Atraso', `<span style="${isCritico ? 'color:var(--crit);' : 'color:var(--warn);'}">${atrasoStr}</span>`, atrasoSub, kpiClassAtraso)}
  </div>

  <div class="grid two" style="margin-top:16px">
    <div class="card">
      <h3>Progresso e Status da Separação</h3>
      <div class="sep-progress">
        <div class="sep-item">
          <div class="sep-header">
            <span>Derrubada (Total: ${fmtN.format(derTotQtd)})</span>
            <span>Prod: ${fmtP(derPctProd)} | Pend: ${fmtP(derPctPend)}</span>
          </div>
          <div class="sep-bar-bg">
            <div class="sep-bar-fill" style="width:${derPctProd}%;background:var(--ok);" title="Produção: ${fmtN.format(prodDer.pedida)}"></div>
            <div class="sep-bar-fill" style="width:${derPctPend}%;background:var(--warn);" title="Pendente: ${fmtN.format(pendDer.pedida)}"></div>
          </div>
        </div>

        <div class="sep-item" style="margin-top: 8px;">
          <div class="sep-header">
            <span>Sorter (Total: ${fmtN.format(sorTotQtd)})</span>
            <span>Prod: ${fmtP(sorPctProd)} | Pend: ${fmtP(sorPctPend)}</span>
          </div>
          <div class="sep-bar-bg">
            <div class="sep-bar-fill" style="width:${sorPctProd}%;background:var(--blue);" title="Produção: ${fmtN.format(prodSor.pedida)}"></div>
            <div class="sep-bar-fill" style="width:${sorPctPend}%;background:var(--crit);" title="Pendente: ${fmtN.format(pendSor.pedida)}"></div>
          </div>
        </div>

        <div class="sep-item" style="margin-top: 8px;">
          <div class="sep-header">
            <span>Cross Docking (Total: ${fmtN.format(cdTotQtd)})</span>
            <span>Sep: ${fmtP(cdPctSep)} | Pend: ${fmtP(cdPctPend)}</span>
          </div>
          <div class="sep-bar-bg">
            <div class="sep-bar-fill" style="width:${cdPctSep}%;background:var(--ok);" title="Separado: ${fmtN.format(crossDock.separada)}"></div>
            <div class="sep-bar-fill" style="width:${cdPctPend}%;background:var(--accent);" title="Pendente: ${fmtN.format(cdPendQtd)}"></div>
          </div>
        </div>

        <div class="sep-item" style="margin-top: 8px;">
          <div class="sep-header">
            <span>Full (Total: ${fmtN.format(fullTotQtd)})</span>
            <span>Sep: ${fmtP(fullPctSep)} | Pend: ${fmtP(fullPctPend)}</span>
          </div>
          <div class="sep-bar-bg">
            <div class="sep-bar-fill" style="width:${fullPctSep}%;background:var(--ok);" title="Separado: ${fmtN.format(fullSep.separada)}"></div>
            <div class="sep-bar-fill" style="width:${fullPctPend}%;background:#c084fc;" title="Pendente: ${fmtN.format(fullPendQtd)}"></div>
          </div>
        </div>

      <div class="info-note">

              <td class="r" style="font-weight:700;color:var(--text)">${brl(p.valorPend)}</td>

          `).join('') : '<tr><td colspan="7">Nenhum produto encontrado com os filtros aplicados.</td></tr>'}
        </tbody>
      </table>
    </div>
  </div>

  <div class="card" style="margin-top:16px">
    <h3>Status por Data de Geração da Reserva</h3>
    <div class="tw">
      <table>
        <thead>
          <tr>
            <th>Data Reserva</th>

            <th class="r">Qtd Separada</th>
            <th class="r">Valor Total</th>
            <th class="r">Status Pendentes</th>
          </tr>
        </thead>
        <tbody>
          ${resRows.map(([dt, o]) => `
            <tr>
              <td><b>${esc(dt)}</b></td>
              <td class="r">${fmtN.format(o.qtd)}</td>
              <td class="r">${fmtN.format(o.qtdSep)}</td>
              <td class="r">${brlShort(o.valor)}</td>
              <td class="r">
                ${o.pendentes > 0 
                  ? `<span style="color:var(--crit);font-weight:700">🚨 ${o.pendentes} pendentes</span>` 
                  : `<span style="color:var(--ok);font-weight:700">✔ Concluído</span>`}
              </td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    </div>
  </div>

  <div class="card" style="margin-top:16px">
    <div class="card-header-action">
      <h3>SEPARAÇÃO POR DESTINATÁRIO (DESTINO)</h3>
      <button class="toggle-btn" id="btnToggleDest">
        ${destExpanded ? '▲ Ocultar Lojas' : '▼ Exibir Lojas / Destinos (' + destRows.length + ')'}
      </button>
    </div>

    <div class="collapsible-content ${destExpanded ? 'open' : ''}" id="boxDestinos">
      <div style="margin-bottom: 12px;">
        <input type="text" id="inputDestSearch" placeholder="🔍 Buscar loja / destino..." value="${esc(destSearch)}" style="width: 100%; max-width: 320px;" />
      </div>
      <div class="tw">
        <table>
          <thead>
            <tr>
              <th>Destinatário</th>
              <th class="r">Qtd Pedida</th>
              <th class="r">Qtd Separada</th>
              <th class="r">Valor Total</th>
            </tr>
          </thead>
          <tbody>
            ${destRows.length ? destRows.map(([k,o]) => `
              <tr>
                <td><b>${esc(k)}</b></td>
                <td class="r">${fmtN.format(o.pedida)}</td>
                <td class="r" style="color:${o.separada > 0 ? 'var(--ok)' : 'var(--mute)'}">${fmtN.format(o.separada)}</td>
                <td class="r">${brlShort(o.valor)}</td>

  const selectSep = $('#sepFilterSelect');

  if (pSearch) {
    pSearch.addEventListener('input', (e) => {
      prodSearch = e.target.value;
      secCarteira();
      const el = $('#inputProdSearch');
      if (el) { el.focus(); el.setSelectionRange(prodSearch.length, prodSearch.length); }

  const pSort = $('#selectProdSort');

  const dSearch = $('#inputDestSearch');
  if (dSearch) {
    dSearch.addEventListener('input', (e) => {

      secCarteira();
      const el = $('#inputDestSearch');
      if (el) { el.focus(); el.setSelectionRange(destSearch.length, destSearch.length); }
    });
  }
}

  const nav = $('#tabs');
  if (!nav) return;
  nav.innerHTML = SECTIONS.map(s => `<button data-tab="${s.id}" role="tab" aria-selected="${s.id===activeTab}">${s.title}</button>`).join('');
  
  nav.querySelectorAll('button').forEach(btn => {
    btn.addEventListener('click', () => {
      activeTab = btn.getAttribute('data-tab');
      window.location.hash = activeTab;
      render();
    });
  });
}

function render(){
  if (!D) return;
  const hash = window.location.hash.replace('#','');
  if (hash && SECTIONS.some(s=>s.id===hash)) {
    activeTab = hash;
  }
  
  document.querySelectorAll('nav#tabs button').forEach(b => {
    b.setAttribute('aria-selected', b.getAttribute('data-tab') === activeTab);
  });

  SECTIONS.forEach(s => {
    const el = $('#s-' + s.id);
    if (el) {
      if (s.id === activeTab) {
        el.classList.add('on');
        try {
          s.render();
        } catch(err) {
          console.error('Erro ao renderizar seção ' + s.id, err);
          el.innerHTML = '<div class="card"><h3>Erro de Exibição</h3><p>Ocorreu um erro ao carregar esta aba. Verifique a estrutura dos dados.</p></div>';
        }
      } else {
        el.classList.remove('on');
      }
    }
  });
}

document.querySelectorAll('#basis button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('#basis button').forEach(b => b.setAttribute('aria-pressed', 'false'));
    btn.setAttribute('aria-pressed', 'true');
    basis = btn.getAttribute('data-b');
    render();
  });
});

function toggleTvMode() {
  const isTv = document.body.classList.toggle('tvmode');
  const btnTv = $('#tv');
  if (btnTv) btnTv.setAttribute('aria-pressed', isTv);

  if (isTv) {
    if (document.documentElement.requestFullscreen) {
      document.documentElement.requestFullscreen().catch(() => {});
    }
    startTvRotation();
  } else {
    if (document.exitFullscreen && document.fullscreenElement) {
      document.exitFullscreen().catch(() => {});
    }
    stopTvRotation();
  }
}

function startTvRotation() {
  stopTvRotation();
  tvTimer = setInterval(() => {
    const currentIndex = SECTIONS.findIndex(s => s.id === activeTab);
    const nextIndex = (currentIndex + 1) % SECTIONS.length;
    activeTab = SECTIONS[nextIndex].id;
    window.location.hash = activeTab;
    render();
  }, CONFIG.TV_SEGUNDOS * 1000);
}

function stopTvRotation() {
  if (tvTimer) {
    clearInterval(tvTimer);
    tvTimer = null;
  }
}

document.addEventListener('fullscreenchange', () => {
  if (!document.fullscreenElement && document.body.classList.contains('tvmode')) {
    document.body.classList.remove('tvmode');
    const btnTv = $('#tv');
    if (btnTv) btnTv.setAttribute('aria-pressed', 'false');
    stopTvRotation();
  }
});

const btnTv = $('#tv');
if (btnTv) {
  btnTv.addEventListener('click', toggleTvMode);
}

window.addEventListener('DOMContentLoaded', () => {
  renderNav();
  load();
});

window.addEventListener('hashchange', render);
setInterval(load, CONFIG.ATUALIZAR_MIN * 60 * 1000);
</script>
</body>
