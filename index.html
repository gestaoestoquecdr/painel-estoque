/* ---------- PRÉ-ALERTA (SOBRA E FALTA) ---------- */
const isMoney = v => /^R\$/i.test(String(v == null ? '' : v).trim());
const toBR = v => {
  const t = String(v || '').trim().split(' ')[0].split('T')[0];
  if (/^\d{4}-\d{2}-\d{2}$/.test(t)) { const [y,m,d] = t.split('-'); return `${d}/${m}/${y}`; }
  return /^\d{2}\/\d{2}\/\d{4}$/.test(t) ? t : '';
};
const stTxt = v => String(v == null ? '' : v).trim().toUpperCase();

function normPre(p){
  const novo = ('ocorrencia' in p) || ('carimboDataHora' in p);
  const antigoDesloc = !novo && isMoney(p.statusCd) && isMoney(p.statusLoja) && !(+p.valorTotal);
  let r;
  if (novo) {
    const qtd = parseNum(p.qtd), vu = parseNum(p.valorUnitario);
    let vt = parseNum(p.valorTotal);
    if (!vt && qtd && vu) vt = qtd * vu;
    const t = stTxt(p.ocorrencia);
    r = {
      data: toBR(p.carimboDataHora),
      dias: +p.diasSemRetorno || 0,
      loja: String(p.loja || '').trim(),
      pedido: String(p.pedido || '').trim(),
      dataEmissao: toBR(p.dataEmissao),
      nf: String(p.nf || '').trim(),
      codProd: String(p.codProd || '').trim(),
      prod: String(p.prod || '').trim(),
      qtd, un: String(p.um || '').trim(),
      tipo: (t === 'SOBRA' || t === 'FALTA') ? t : '',
      valorUnit: vu, valor: vt,
      origem: String(p.origem || '').trim(),
      statusCd: stTxt(p.statusCd), statusLoja: stTxt(p.statusLoja),
      obs: String(p.observacao || '').trim()
    };
  } else if (antigoDesloc) {
    r = {data:'', dias:0, loja:String(p.pedido || '').trim(), pedido:String(p.dataRegistro || '').trim(), dataEmissao:'', nf:String(p.nf || '').trim(),
      codProd:String(p.qtd || '').trim(), prod:String(p.um || '').trim(), qtd:parseNum(p.tipo), un:'', tipo:'', valorUnit:parseNum(p.statusCd), valor:parseNum(p.statusLoja),
      origem:'', statusCd:'', statusLoja:'', obs:String(p.prod || '').trim()};
  } else {
    const t = stTxt(p.tipo), rawLoja = String(p.loja || '').trim();
    r = {data:toBR(p.dataRegistro), dias:0, loja:/^\d+$/.test(rawLoja) ? getNomeLoja(rawLoja) : rawLoja, pedido:String(p.pedido || '').trim(), dataEmissao:'', nf:String(p.nf || '').trim(),
      codProd:String(p.codProd || '').trim(), prod:String(p.prod || '').trim(), qtd:parseNum(p.qtd), un:String(p.um || '').trim(), tipo:(t === 'SOBRA' || t === 'FALTA') ? t : '',
      valorUnit:0, valor:parseNum(p.valorTotal), origem:'', statusCd:stTxt(p.statusCd), statusLoja:stTxt(p.statusLoja), obs:''};
  }
  r.loja = r.loja || 'Sem loja';
  r.mes = r.data ? nfMes(r.data) : 'Sem data';
  const txt = `${r.nf} ${r.pedido} ${antigoDesloc ? r.obs : ''}`.toUpperCase();
  if (txt.includes('SEM NOTA')) r.situacao = 'Sem nota fiscal';
  else if (txt.includes('SEM PEDIDO')) r.situacao = 'Sem pedido';
  else if (!r.nf || r.nf === '*') r.situacao = 'NF não informada';
  else r.situacao = 'Com NF informada';
  return r;
}

function preTodas(){ return ((AdminD && AdminD.pre_alerta) || []).map(normPre); }
function preFiltradas(){
  const f = preFiltro;
  return preTodas().filter(r =>
    hasArr(f.loja, r.loja) &&
    hasArr(f.situacao, r.situacao) &&
    hasArr(f.tipo, r.tipo) &&
    hasArr(f.mes, r.mes) &&
    hasArr(f.stCd, r.statusCd) &&
    hasArr(f.stLoja, r.statusLoja)
  );
}

function secPreAlerta(){
  const el = $('#s-prealerta');
  if (!el) return;
  if (!AdminD) {
    el.innerHTML = `<h2>Pré-Alerta (Sobra e Falta)</h2><p class="sub">Carregando dados do administrativo.json...</p>`;
    return;
  }

  const todas = preTodas();
  const hasTipo = todas.some(r => r.tipo);
  const rows = preFiltradas();
  const tot = rows.reduce((s,r) => s + r.valor, 0);
  const unid = rows.reduce((s,r) => s + r.qtd, 0);
  const sobraVal = rows.filter(r => r.tipo === 'SOBRA').reduce((s,r) => s + r.valor, 0);
  const faltaVal = rows.filter(r => r.tipo === 'FALTA').reduce((s,r) => s + r.valor, 0);
  const semDoc = rows.filter(r => r.situacao === 'Sem nota fiscal' || r.situacao === 'Sem pedido');
  const semDocVal = semDoc.reduce((s,r) => s + r.valor, 0);
  const pend = rows.filter(r => (r.statusCd && r.statusCd !== 'FINALIZADO') || (r.statusLoja && r.statusLoja !== 'FINALIZADO'));
  const pendVal = pend.reduce((s,r) => s + r.valor, 0);
  const lojasSet = new Set(rows.map(r => r.loja));

  const agrup = (keyFn) => {
    const m = {};
    rows.forEach(r => { const k = keyFn(r); const o = (m[k] = m[k] || {n:0, qtd:0, valor:0, lojas:new Set()}); o.n++; o.qtd += r.qtd; o.valor += r.valor; o.lojas.add(r.loja); });
    return Object.entries(m);
  };
  const porLoja = agrup(r => r.loja).sort((a,b) => b[1].valor - a[1].valor);
  const porSit = agrup(r => r.situacao).sort((a,b) => b[1].valor - a[1].valor);
  const porMes = agrup(r => r.mes).sort((a,b) => mesOrdem(a[0]).localeCompare(mesOrdem(b[0])));
  const porSt = agrup(r => r.statusCd || 'SEM STATUS').sort((a,b) => b[1].valor - a[1].valor);
  const SIT_COR = {'Sem nota fiscal':'var(--crit)', 'Sem pedido':'var(--warn)', 'NF não informada':'var(--mute)', 'Com NF informada':'var(--ok)'};
  const stCor = k => k === 'FINALIZADO' ? 'var(--ok)' : (k === 'SEM STATUS' ? 'var(--mute)' : 'var(--warn)');

  const q = searchPre.trim().toLowerCase();
  const busca = q ? rows.filter(r => [r.loja, r.pedido, r.nf, r.codProd, r.prod, r.situacao, r.tipo, r.obs, r.origem, r.statusCd, r.statusLoja].some(x => String(x || '').toLowerCase().includes(q))) : rows;
  const ordem = {
    valor: (a,b) => b.valor - a.valor,
    qtd:   (a,b) => b.qtd - a.qtd,
    dias:  (a,b) => b.dias - a.dias || b.valor - a.valor,
    loja:  (a,b) => a.loja.localeCompare(b.loja) || b.valor - a.valor
  }[preOrdem] || (() => 0);
  const lista = busca.slice().sort(ordem);
  const mostradas = lista.slice(0, preLimite);
  const restam = lista.length - mostradas.length;
  const temStatus = rows.some(r => r.statusCd || r.statusLoja);
  const temExtra = rows.some(r => r.origem || r.obs || r.dias);
  const nCols = 9 + (hasTipo ? 1 : 0) + (temStatus ? 2 : 0) + (temExtra ? 3 : 0);

  const kpis = hasTipo ? `
      <div class="card kpi"><h3>Total Ocorrências de Sobra</h3><div class="v" style="color:var(--ok)">${brlShort(sobraVal)}</div><div class="s">Itens sobrando na recepção</div></div>
      <div class="card kpi"><h3>Total Ocorrências de Falta</h3><div class="v" style="color:var(--warn)">${brlShort(faltaVal)}</div><div class="s">Itens faltantes na recepção</div></div>
      <div class="card kpi hl"><h3>Total Geral de Ocorrências</h3><div class="v">${brlShort(tot)}</div><div class="s">${fmtN.format(rows.length)} registros em ${fmtN.format(lojasSet.size)} lojas</div></div>
      ${temStatus ? `<div class="card kpi"><h3>Ainda em Tratativa</h3><div class="v" style="color:var(--crit)">${brlShort(pendVal)}</div><div class="s">${fmtN.format(pend.length)} ocorrências não finalizadas</div></div>` : ''}`
    : `
      <div class="card kpi hl"><h3>Total Geral de Ocorrências</h3><div class="v">${brlShort(tot)}</div><div class="s">${fmtN.format(rows.length)} registros de divergência auditados</div></div>
      <div class="card kpi"><h3>Lojas com Ocorrência</h3><div class="v" style="color:var(--blue)">${fmtN.format(lojasSet.size)}</div><div class="s">${fmtN.format(unid)} unidades divergentes</div></div>
      <div class="card kpi"><h3>Sem Nota / Sem Pedido</h3><div class="v" style="color:var(--crit)">${brlShort(semDocVal)}</div><div class="s">${fmtN.format(semDoc.length)} ocorrências sem documento</div></div>`;

  const dica = '<span style="color:var(--mute);font-weight:500;font-size:12px">(clique para filtrar)</span>';

  el.innerHTML = `
    <h2>Pré-Alerta · Sobra e Falta</h2>
    <p class="sub">Setor Administrativo · Ocorrências de divergência na recepção das lojas.${esc(admAtualizadoTxt())}</p>

    <div class="grid kpis">${kpis}</div>

    ${!hasTipo && todas.length ? `
    <div class="alert-banner" style="margin-bottom:0">
      <div class="alert-banner-icon">ℹ️</div>
      <div class="alert-banner-content">
        <h4>Classificação Sobra/Falta indisponível na base atual</h4>
        <p>O administrativo.json não traz a coluna "ocorrencia" preenchida com SOBRA ou FALTA. Assim que ela vier, os cards e o filtro "Tipo" passam a funcionar sozinhos.</p>
      </div>
    </div>` : ''}

    <div class="grid two" style="margin-top:20px">
      <div class="card">
        <h3>Total Ocorrências por Mês ${dica}</h3>
        <div class="tw">
          <table>
            <thead><tr><th>Data</th><th class="r">Total R$</th><th class="r">Qtd Loja</th></tr></thead>
            <tbody>
              ${porMes.map(([k,o]) => `
                <tr class="clickable-row ${isSelectedArr(preFiltro.mes, k) ? 'active-row' : ''}" data-pre-mes="${esc(k)}">
                  <td><b>${esc(mesLabel(k))}</b></td><td class="r" style="font-weight:700">${brl(o.valor)}</td><td class="r">${fmtN.format(o.lojas.size)}</td>
                </tr>`).join('') || '<tr><td colspan="3">Sem ocorrências com os filtros aplicados.</td></tr>'}
              <tr class="tot"><td><b>Total Geral</b></td><td class="r" style="color:var(--accent)">${brl(tot)}</td><td class="r">${fmtN.format(lojasSet.size)}</td></tr>
            </tbody>
          </table>
        </div>
      </div>

      <div class="card">
        <h3>Status de Processamento das Ocorrências ${dica}</h3>
        <div class="tw">
          <table>
            <thead><tr><th>Status Ocorrência (CD)</th><th class="r">Ocorr.</th><th class="r">Valor Total R$</th></tr></thead>
            <tbody>
              ${porSt.map(([k,o]) => `
                <tr class="clickable-row ${isSelectedArr(preFiltro.stCd, k) ? 'active-row' : ''}" data-pre-st="${esc(k)}">
                  <td><b style="color:${stCor(k)}">${esc(k)}</b></td><td class="r">${fmtN.format(o.n)}</td><td class="r" style="color:${stCor(k)};font-weight:700">${brl(o.valor)}</td>
                </tr>`).join('') || '<tr><td colspan="3">Sem ocorrências com os filtros aplicados.</td></tr>'}
              <tr class="tot"><td><b>Total Geral Auditado</b></td><td class="r">${fmtN.format(rows.length)}</td><td class="r" style="color:var(--accent)">${brl(tot)}</td></tr>
            </tbody>
          </table>
        </div>

    </div>

    <div class="grid two" style="margin-top:20px">
      <div class="card">
        <h3>Ocorrências por Loja ${dica}</h3>
        <div class="tw">
          <table>
            <thead><tr><th>Loja</th><th class="r">Ocorr.</th><th class="r">Unid.</th><th class="r">Total R$</th></tr></thead>
            <tbody>
              ${porLoja.map(([k,o]) => `
                <tr class="clickable-row ${isSelectedArr(preFiltro.loja, k) ? 'active-row' : ''}" data-pre-loja="${esc(k)}">

/* ================= SETOR RECEBIMENTO ================= */
let RecebD = null;
let searchRecNotas = '';
let searchRecVerba = '';
let searchSemVerba = '';
let recFiltro = {mes:[], loja:[], tipoCarga:[], statusNota:[], tipoOp:[], fornecedor:[], pagaVerba:'todos'};
let recOrdem = 'valor';
let recLimite = 150;
let verbaOrdem = 'verba';
let verbaLimite = 150;
let semVerbaOrdem = 'valor';
let semVerbaLimite = 150;
let semVerbaExpanded = true;

async function loadRecebimentoData(){
  try {
    const timestamp = new Date().getTime();
    const res = await fetch(`${CONFIG.RECEBIMENTO_URL}?v=${timestamp}`);
    if (res.ok) RecebD = await res.json();
  } catch(e) {
    console.error("Erro ao carregar recebimento.json:", e);
  }
}

function recNotasTodas(){
  const raw = (RecebD && (RecebD.notas_recebimento || RecebD.notas || RecebD.data)) || [];
  return raw.map(n => {
    const dtRec = String(n.dataRecebimento || n['Data de Recebimento/Saída'] || n.dataEmissao || n['Data de Emissão'] || '').trim();
    const dtEmi = String(n.dataEmissao || n['Data de Emissão'] || '').trim();
    const mesRef = nfMes(dtRec || dtEmi);
    const lojaRaw = String(n.loja || n.Loja || '').trim();
    const lojaClean = lojaRaw.replace(/\.0$/, '');
    const lojaNome = lojaClean === '205' ? 'CD 205 - ROLDÃO' : (/^\d+$/.test(lojaClean) ? getNomeLoja(lojaClean) : (lojaClean || 'Sem Loja'));
    const valNf = parseNum(n.valorNf != null ? n.valorNf : n['Valor NF']);
    const valRec = parseNum(n.valorRecebido != null ? n.valorRecebido : n['Valor Recebido']) || valNf;
    let vPct = parseNum(n.verbaPct != null ? n.verbaPct : n['Verba logistica']);
    const vVal = n.verbaValor != null ? parseNum(n.verbaValor) : (valRec * (vPct / 100));
    const temVerba = (vVal > 0.005 || vPct > 0);
    const fornRaw = String(n.fornecedor || n['Fornecedor/Loja'] || n['Emitente/Destinatário'] || 'NÃO INFORMADO').trim();
    const statusNotaRaw = String(n.statusNota || n['Status da Nota Fiscal'] || '').trim() || 'Não informado';
    const statusNfeRaw = String(n.statusNfe || n['Status NF-e'] || '').trim();
    return {
      dataEmissao: dtEmi,
      dataRecebimento: dtRec,
      mes: mesRef,
      loja: lojaNome,
      tipoNota: String(n.tipoNota || n['Tipo de Nota Fiscal'] || '').trim(),
      tipoOperacao: String(n.tipoOperacao || n['Tipo de Operação'] || '').trim() || 'Não informado',
      cfop: String(n.cfop || n.CFOP || '').trim(),
      fornecedor: fornRaw,
      cnpj: String(n.cnpj || n.CNPJ || '').trim(),
      nf: String(n.nf || n.NF || '').replace(/\.0$/, '').trim(),
      serie: String(n.serie || n['Série'] || '').replace(/\.0$/, '').trim(),
      statusNfe: statusNfeRaw,
      statusNota: statusNotaRaw,
      valorNf: valNf,
      valorLiquido: parseNum(n.valorLiquido != null ? n.valorLiquido : n['Valor Liquido']),
      valorCompra: parseNum(n.valorCompra != null ? n.valorCompra : n['Valor NF Compra']),
      valorBonificada: parseNum(n.valorBonificada != null ? n.valorBonificada : n['Valor NF Bonificada']),
      usuario: String(n.usuario || n['Usuário'] || '').trim(),
      usuarioConfirmacao: String(n.usuarioConfirmacao || n['Usuário Confirmação'] || '').trim(),
      tipoCarga: String(n.tipoCarga || n['Tipo de Carga'] || 'FORNECEDOR').trim().toUpperCase(),
      valorRecebido: valRec,
      verbaPct: vPct,
      verbaValor: vVal,
      temVerba: temVerba,
      qtdFaturado: parseNum(n.qtdFaturado != null ? n.qtdFaturado : n['Qtd Faturado'])
    };
  });
}

function recNotasFiltradas(){
  return recNotasTodas().filter(n => {
    if (recFiltro.mes.length > 0 && !hasArr(recFiltro.mes, n.mes)) return false;
    if (recFiltro.loja.length > 0 && !hasArr(recFiltro.loja, n.loja)) return false;
    if (recFiltro.tipoCarga.length > 0 && !hasArr(recFiltro.tipoCarga, n.tipoCarga)) return false;
    if (recFiltro.statusNota.length > 0 && !hasArr(recFiltro.statusNota, n.statusNota)) return false;
    if (recFiltro.tipoOp.length > 0 && !hasArr(recFiltro.tipoOp, n.tipoOperacao)) return false;
    if (recFiltro.fornecedor.length > 0 && !hasArr(recFiltro.fornecedor, n.fornecedor)) return false;
    if (recFiltro.pagaVerba === 'sim' && !n.temVerba) return false;
    if (recFiltro.pagaVerba === 'nao' && n.temVerba) return false;
    return true;
  });
}

function recAtualizadoTxt(){
  const t = RecebD && RecebD.ultimaAtualizacao;
  if (!t) return '';
  const d = new Date(t);
  return isNaN(d) ? '' : ` Base atualizada em ${d.toLocaleString('pt-BR', {day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit'})}.`;
}

/* ---------- SUB-ABA 1: NOTAS DE RECEBIMENTO (DASHBOARD + TABELAS DINÂMICAS) ---------- */
function secRecebNotas(){
  const el = $('#s-recebnotas');
  if (!el) return;
  if (!RecebD) {
    el.innerHTML = `<h2>Notas de Recebimento</h2><p class="sub">Carregando dados do recebimento.json...</p>`;
    return;
  }

  const notas = recNotasFiltradas();
  const totValNf = notas.reduce((s,n) => s + n.valorNf, 0);
  const totValRec = notas.reduce((s,n) => s + n.valorRecebido, 0);
  const totVerba = notas.reduce((s,n) => s + n.verbaValor, 0);
  const totQtd = notas.reduce((s,n) => s + n.qtdFaturado, 0);

  const notasComVerba = notas.filter(n => n.temVerba);
  const notasSemVerba = notas.filter(n => !n.temVerba);
  const valComVerba = notasComVerba.reduce((s,n) => s + n.valorRecebido, 0);
  const valSemVerba = notasSemVerba.reduce((s,n) => s + n.valorRecebido, 0);

  const fornAllSet = new Set(notas.map(n => n.fornecedor).filter(Boolean));
  const fornPagamSet = new Set(notasComVerba.map(n => n.fornecedor).filter(Boolean));
  const fornNaoPagamList = Array.from(fornAllSet).filter(f => !fornPagamSet.has(f));
  const lojasSet = new Set(notas.map(n => n.loja).filter(Boolean));

  // Agrupamento por Mês
  const porMesMap = {};
  notas.forEach(n => {
    const k = n.mes || 'Sem data';
    porMesMap[k] = porMesMap[k] || {mes:k, nfs:0, valorNf:0, valorRec:0, verba:0, qtd:0};
    porMesMap[k].nfs++;
    porMesMap[k].valorNf += n.valorNf;
    porMesMap[k].valorRec += n.valorRecebido;
    porMesMap[k].verba += n.verbaValor;
    porMesMap[k].qtd += n.qtdFaturado;
  });
  const porMes = Object.values(porMesMap).sort((a,b) => mesOrdem(a.mes).localeCompare(mesOrdem(b.mes)));
  const maxMesRec = porMes.length ? Math.max(...porMes.map(m => m.valorRec)) * 1.18 : 1;

  // Agrupamento por Tipo de Operação
  const porOpMap = {};
  notas.forEach(n => {
    const k = n.tipoOperacao || 'Não informado';
    porOpMap[k] = porOpMap[k] || {op:k, nfs:0, valorRec:0, verba:0};
    porOpMap[k].nfs++;
    porOpMap[k].valorRec += n.valorRecebido;
    porOpMap[k].verba += n.verbaValor;
  });
  const porOp = Object.values(porOpMap).sort((a,b) => b.valorRec - a.valorRec);

  // Agrupamento por Tipo de Carga
  const porCargaMap = {};
  notas.forEach(n => {
    const k = n.tipoCarga || 'OUTROS';
    porCargaMap[k] = porCargaMap[k] || {tipo:k, nfs:0, valorRec:0, verba:0};
    porCargaMap[k].nfs++;
    porCargaMap[k].valorRec += n.valorRecebido;
    porCargaMap[k].verba += n.verbaValor;
  });
  const porCarga = Object.values(porCargaMap).sort((a,b) => b.valorRec - a.valorRec);

  // Agrupamento por Loja
  const porLojaMap = {};
  notas.forEach(n => {
    const k = n.loja;
    porLojaMap[k] = porLojaMap[k] || {loja:k, nfs:0, valorRec:0, verba:0, qtd:0};
    porLojaMap[k].nfs++;
    porLojaMap[k].valorRec += n.valorRecebido;
    porLojaMap[k].verba += n.verbaValor;
    porLojaMap[k].qtd += n.qtdFaturado;
  });
  const porLoja = Object.values(porLojaMap).sort((a,b) => b.valorRec - a.valorRec);

  // Donut: Volume Recebido Com Verba vs Sem Verba
  const donutVerbaItems = [
    { rawKey: 'sim', n: 'Com Verba Logística', v: valComVerba, c: '#35d49a', topProd: `${fmtN.format(notasComVerba.length)} NFs (${fmtN.format(fornPagamSet.size)} forn.)` },
    { rawKey: 'nao', n: 'Sem Verba Logística', v: valSemVerba, c: '#ff5d62', topProd: `${fmtN.format(notasSemVerba.length)} NFs (${fmtN.format(fornNaoPagamList.length)} forn.)` }
  ].filter(i => i.v > 0);
  const pctComVerbaVal = totValRec ? (valComVerba / totValRec) * 100 : 0;

  const q = searchRecNotas.trim().toLowerCase();
  const busca = q ? notas.filter(n =>
    n.nf.toLowerCase().includes(q) ||
    n.fornecedor.toLowerCase().includes(q) ||
    n.loja.toLowerCase().includes(q) ||
    n.cnpj.toLowerCase().includes(q) ||
    n.tipoCarga.toLowerCase().includes(q) ||
    n.tipoOperacao.toLowerCase().includes(q) ||
    n.usuario.toLowerCase().includes(q)
  ) : notas;

  const cmp = {
    valor: (a,b) => b.valorRecebido - a.valorRecebido,
    verba: (a,b) => b.verbaValor - a.verbaValor,
    data:  (a,b) => String(b.dataRecebimento).split('/').reverse().join('').localeCompare(String(a.dataRecebimento).split('/').reverse().join('')),
    nf:    (a,b) => String(a.nf).localeCompare(String(b.nf), undefined, {numeric:true})
  }[recOrdem] || (() => 0);

  const lista = busca.slice().sort(cmp);
  const mostradas = lista.slice(0, recLimite);
  const restam = lista.length - mostradas.length;
  const dica = '<span style="color:var(--mute);font-weight:500;font-size:12px">(clique para filtrar)</span>';

  el.innerHTML = `
    <h2>Notas de Recebimento · Dashboard Executivo</h2>
    <p class="sub">Setor Recebimento · Visão consolidada de entradas, cobertura de verba logística e fornecedores.${esc(recAtualizadoTxt())}</p>

    <div class="grid kpis">
      ${kpi('Valor Total Recebido', brlShort(totValRec), `${fmtN.format(notas.length)} NFs · Valor NF: ${brlShort(totValNf)}`, 'hl')}
      ${kpi('Verba Logística Apurada', `<span style="color:var(--ok)">${brlShort(totVerba)}</span>`, `Média ${fmtP(totValRec ? (totVerba / totValRec) * 100 : 0, 2)} sobre recebido`, 'hl')}
      ${kpi('Cobertura de Verba (R$)', `<span style="color:var(--blue)">${fmtP(pctComVerbaVal, 1)}</span>`, `${brlShort(valComVerba)} c/ verba · ${brlShort(valSemVerba)} s/ verba`)}
      ${kpi('Fornecedores (Pagam vs Não)', `${fmtN.format(fornPagamSet.size)} <span style="font-size:20px;color:var(--mute)">/ ${fmtN.format(fornAllSet.size)}</span>`, `<span style="color:var(--crit);font-weight:700">${fmtN.format(fornNaoPagamList.length)} sem verba</span> · ${fmtN.format(totQtd)} itens`)}
    </div>

    <!-- GRÁFICOS DO DASHBOARD -->
    <div class="grid two" style="margin-top:20px">
      <div class="card">
        <h3>📊 Evolução Mensal do Recebimento (R$) ${dica}</h3>
        ${porMes.length ? `
          <div class="bar-chart-container" style="height:260px;padding-top:52px">
            <div class="bar-chart-wrapper">
              ${porMes.map((m, idx) => {
                const pctH = (m.valorRec / maxMesRec) * 100;
                const isSel = isSelectedArr(recFiltro.mes, m.mes);
                let varTag = '';
                if (idx > 0 && porMes[idx - 1].valorRec > 0) {
                  const vp = ((m.valorRec - porMes[idx - 1].valorRec) / porMes[idx - 1].valorRec) * 100;
                  const clsV = vp >= 0 ? 'up' : 'down';
                  varTag = `<span class="bar-var-tag ${clsV}">${vp >= 0 ? '+' : ''}${fmtP(vp, 0)}</span>`;
                }
                const ttItems = [
                  { prod: `${mesLabel(m.mes)} · ${fmtN.format(m.nfs)} NFs`, sub: `Recebido: ${brl(m.valorRec)}` },
                  { prod: `Verba Apurada: ${brl(m.verba)}`, sub: `Clique na barra para filtrar este mês` }
                ];
                return `
                <div class="bar-chart-col" data-rec-mes="${esc(m.mes)}" style="cursor:pointer">
                  <div class="bar-chart-bar ${isSel ? 'is-proj' : ''}" style="height:${Math.max(pctH, 6)}%"
                       data-tooltip-title="${esc(mesLabel(m.mes))}"

                       data-tooltip-items="${JSON.stringify(ttItems).replace(/"/g, '&quot;')}">

      </div>

      <div class="card">

        <div class="donutwrap">

                </tr>`).join('') || '<tr><td colspan="5">Nenhum dado encontrado.</td></tr>'}
              <tr class="tot"><td><b>Total</b></td><td class="r">${fmtN.format(notas.length)}</td><td class="r" style="color:var(--accent)">${brl(totValRec)}</td><td class="r" style="color:var(--ok)">${brl(totVerba)}</td><td class="r">${fmtP(totValRec ? (totVerba / totValRec) * 100 : 0, 2)}</td></tr>
            </tbody>

                  <td><b>${esc(l.loja)}</b></td>

                  <td class="r" style="color:var(--ok);font-weight:700">${brl(l.verba)}</td>
                </tr>`).join('') || '<tr><td colspan="5">Nenhuma loja encontrada.</td></tr>'}

        </div>
        <div class="tw" style="margin-top:14px">
          <table>
            <thead><tr><th>Tipo de Carga</th><th class="r">NFs</th><th class="r">Valor Recebido</th><th class="r">% Part.</th></tr></thead>
            <tbody>
              ${porCarga.map(c => `
                <tr class="clickable-row ${isSelectedArr(recFiltro.tipoCarga, c.tipo) ? 'active-row' : ''}" data-rec-carga="${esc(c.tipo)}">
                  <td><b>${esc(c.tipo)}</b></td>
                  <td class="r">${fmtN.format(c.nfs)}</td>
                  <td class="r" style="font-weight:700">${brl(c.valorRec)}</td>

    <!-- LISTAGEM DE NOTAS -->
    <div class="card" style="margin-top:20px">
      <div class="card-header-action">
        <h3>📄 NOTAS FISCAIS DE RECEBIMENTO (${fmtN.format(lista.length)} NFs)</h3>
        <div class="prod-controls">
          <select id="selRecOrdem">
            <option value="valor" ${recOrdem === 'valor' ? 'selected' : ''}>Ordem: maior valor recebido</option>
            <option value="verba" ${recOrdem === 'verba' ? 'selected' : ''}>Ordem: maior verba R$</option>
            <option value="data" ${recOrdem === 'data' ? 'selected' : ''}>Ordem: recebimento mais recente</option>
            <option value="nf" ${recOrdem === 'nf' ? 'selected' : ''}>Ordem: nº da NF</option>
          </select>
          <input type="text" id="inputSearchRecNotas" placeholder="🔍 Buscar NF, fornecedor, loja, operação..." value="${esc(searchRecNotas)}" style="width:260px">
        </div>
      </div>
      <div class="tw">
        <table>
          <thead>
            <tr>
              <th>NF / Série</th>
              <th>Recebimento</th>
              <th>Loja</th>
              <th>Fornecedor</th>
              <th>Operação</th>
              <th>Verba?</th>
              <th class="r">Valor Recebido</th>
              <th class="r">% Verba</th>
              <th class="r">Verba R$</th>
            </tr>
          </thead>
          <tbody>
            ${mostradas.length ? mostradas.map(n => `
              <tr>
                <td><b style="color:var(--accent)">${esc(n.nf)}</b>${n.serie ? `<span style="color:var(--mute);font-size:12px"> / ${esc(n.serie)}</span>` : ''}</td>
                <td>${esc(n.dataRecebimento || n.dataEmissao)}</td>
                <td><b>${esc(n.loja)}</b></td>
                <td>${esc(n.fornecedor)}</td>
                <td>${esc(n.tipoOperacao)}</td>
                <td>${n.temVerba ? '<span class="badge-pill badge-verba-sim">SIM</span>' : '<span class="badge-pill badge-verba-nao">NÃO</span>'}</td>
                <td class="r" style="font-weight:700">${brl(n.valorRecebido)}</td>
                <td class="r">${fmtP(n.verbaPct, 2)}</td>
                <td class="r" style="color:${n.temVerba ? 'var(--ok)' : 'var(--mute)'};font-weight:700">${brl(n.verbaValor)}</td>
              </tr>`).join('') : '<tr><td colspan="9">Nenhuma nota encontrada.</td></tr>'}
          </tbody>
        </table>
      </div>
      ${restam > 0 ? `<div style="text-align:center;margin-top:12px"><button class="btn-more" id="btnMoreRecNotas">Mostrar mais 150 (restam ${fmtN.format(restam)})</button></div>` : ''}
    </div>
  `;

  const bindToggle = (attr, key) => document.querySelectorAll(`[${attr}]`).forEach(el => el.addEventListener('click', () => {
    toggleArr(recFiltro[key], el.getAttribute(attr));
    recLimite = 150;
    secRecebNotas();
  }));
  bindToggle('data-rec-mes', 'mes');
  bindToggle('data-rec-carga', 'tipoCarga');
  bindToggle('data-rec-op', 'tipoOp');
  bindToggle('data-rec-loja', 'loja');

  document.querySelectorAll('[data-rec-pagaverba]').forEach(el => el.addEventListener('click', () => {
    const v = el.getAttribute('data-rec-pagaverba');
    recFiltro.pagaVerba = (recFiltro.pagaVerba === v) ? 'todos' : v;
    recLimite = 150;
    secRecebNotas();
  }));

  const inS = $('#inputSearchRecNotas');
  if (inS) inS.addEventListener('input', e => {
    searchRecNotas = e.target.value; recLimite = 150;
    secRecebNotas();
    keepFocus('#inputSearchRecNotas', () => searchRecNotas);
  });
  const bm = $('#btnMoreRecNotas');
  if (bm) bm.addEventListener('click', () => { recLimite += 150; secRecebNotas(); });
  attachTooltipEvents();
}

/* ---------- SUB-ABA 2: VERBA LOGÍSTICA (DASHBOARD + PAGANTES + NÃO PAGANTES) ---------- */
function secRecebVerba(){
  const el = $('#s-recebverba');
  if (!el) return;
  if (!RecebD) {
    el.innerHTML = `<h2>Verba Logística</h2><p class="sub">Carregando dados do recebimento.json...</p>`;
    return;
  }

  const notas = recNotasFiltradas();
  const notasComVerba = notas.filter(n => n.temVerba);
  const notasSemVerba = notas.filter(n => !n.temVerba);
  const totValRec = notas.reduce((s,n) => s + n.valorRecebido, 0);
  const totBaseVerba = notasComVerba.reduce((s,n) => s + n.valorRecebido, 0);
  const totBaseSemVerba = notasSemVerba.reduce((s,n) => s + n.valorRecebido, 0);
  const totVerba = notas.reduce((s,n) => s + n.verbaValor, 0);
  const pctMedioGeral = totValRec ? (totVerba / totValRec) * 100 : 0;
  const pctMedioComVerba = totBaseVerba ? (totVerba / totBaseVerba) * 100 : 0;

  // Consolidar TODOS os fornecedores no filtro atual
  const porFornMap = {};
  notas.forEach(n => {
    const k = n.fornecedor;
    porFornMap[k] = porFornMap[k] || {
      fornecedor: k,
      cnpj: n.cnpj,
      nfs: 0,
      nfsComVerba: 0,
      nfsSemVerba: 0,
      qtd: 0,
      valorRec: 0,
      valorRecComVerba: 0,
      valorRecSemVerba: 0,
      verba: 0,
      ultimaData: ''
    };
    const o = porFornMap[k];
    o.nfs++;
    o.qtd += n.qtdFaturado;
    o.valorRec += n.valorRecebido;
    o.verba += n.verbaValor;
    if (n.temVerba) {
      o.nfsComVerba++;
      o.valorRecComVerba += n.valorRecebido;
    } else {
      o.nfsSemVerba++;
      o.valorRecSemVerba += n.valorRecebido;
    }
    if (!o.cnpj && n.cnpj) o.cnpj = n.cnpj;
    const dt = n.dataRecebimento || n.dataEmissao;
    if (dt && (!o.ultimaData || dt.split('/').reverse().join('') > o.ultimaData.split('/').reverse().join(''))) {
      o.ultimaData = dt;
    }
  });

  const todosFornecedores = Object.values(porFornMap);
  const fornPagam = todosFornecedores.filter(f => f.verba > 0 || f.nfsComVerba > 0).sort((a,b) => b.verba - a.verba);
  // Fornecedores que NÃO pagam verba logística (verba total = 0 no período/filtro)
  const fornNaoPagam = todosFornecedores.filter(f => f.verba <= 0 && f.nfsComVerba === 0);

  // Verba por Mês (para gráfico de barras do Dashboard)
  const porMesMap = {};
  notas.forEach(n => {
    const k = n.mes || 'Sem data';
    porMesMap[k] = porMesMap[k] || {mes:k, nfs:0, valorRec:0, verba:0};
    porMesMap[k].nfs++;
    porMesMap[k].valorRec += n.valorRecebido;
    porMesMap[k].verba += n.verbaValor;
  });
  const porMes = Object.values(porMesMap).sort((a,b) => mesOrdem(a.mes).localeCompare(mesOrdem(b.mes)));
  const maxMesVerba = porMes.length ? Math.max(...porMes.map(m => m.verba)) * 1.2 : 1;

  // Top 12 fornecedores pagantes para barras horizontais
  const topFornChart = fornPagam.slice(0, 12);
  const maxFornVerba = topFornChart.length ? Math.max(...topFornChart.map(f => f.verba)) : 1;

  // Busca & Ordenação da tabela de FORNECEDORES QUE NÃO PAGAM VERBA LOGÍSTICA
  const qSem = searchSemVerba.trim().toLowerCase();
  const buscaSem = qSem ? fornNaoPagam.filter(f =>
    f.fornecedor.toLowerCase().includes(qSem) ||
    f.cnpj.toLowerCase().includes(qSem)
  ) : fornNaoPagam;

  const cmpSem = {
    valor: (a,b) => b.valorRec - a.valorRec,
    nfs:   (a,b) => b.nfs - a.nfs,
    nome:  (a,b) => a.fornecedor.localeCompare(b.fornecedor)
  }[semVerbaOrdem] || (() => 0);

  const listaSemVerba = buscaSem.slice().sort(cmpSem);
  const mostradosSem = listaSemVerba.slice(0, semVerbaLimite);
  const restamSem = listaSemVerba.length - mostradosSem.length;
  const totValFornNaoPagam = fornNaoPagam.reduce((s,f) => s + f.valorRec, 0);

  // Busca & Ordenação do detalhamento de NFs com verba
  const q = searchRecVerba.trim().toLowerCase();
  const baseLista = notasComVerba.length ? notasComVerba : notas;
  const busca = q ? baseLista.filter(n =>
    n.fornecedor.toLowerCase().includes(q) ||
    n.loja.toLowerCase().includes(q) ||
    n.nf.toLowerCase().includes(q) ||
    n.cnpj.toLowerCase().includes(q)
  ) : baseLista;

  const cmp = {
    verba: (a,b) => b.verbaValor - a.verbaValor,
    pct:   (a,b) => b.verbaPct - a.verbaPct,
    valor: (a,b) => b.valorRecebido - a.valorRecebido
  }[verbaOrdem] || (() => 0);

  const lista = busca.slice().sort(cmp);
  const mostradas = lista.slice(0, verbaLimite);
  const restam = lista.length - mostradas.length;
  const dica = '<span style="color:var(--mute);font-weight:500;font-size:12px">(clique para filtrar)</span>';

  el.innerHTML = `
    <h2>Verba Logística · Dashboard & Fornecedores</h2>
    <p class="sub">Setor Recebimento · Apuração de verba logística, evolução mensal, ranking de pagantes e fornecedores sem verba.${esc(recAtualizadoTxt())}</p>

    <div class="grid kpis">
      ${kpi('Verba Logística Total', `<span style="color:var(--ok)">${brlShort(totVerba)}</span>`, `${brl(totVerba)} · Média geral ${fmtP(pctMedioGeral, 2)}`, 'hl')}
      ${kpi('% Verba (NFs Pagantes)', `<span style="color:var(--blue)">${fmtP(pctMedioComVerba, 2)}</span>`, `${fmtN.format(notasComVerba.length)} NFs (${brlShort(totBaseVerba)})`)}
      ${kpi('Fornecedores Pagantes', `<span style="color:var(--ok)">${fmtN.format(fornPagam.length)}</span>`, `De ${fmtN.format(todosFornecedores.length)} fornecedores ativos`)}
      ${kpi('Fornecedores SEM Verba', `<span style="color:var(--crit)">${fmtN.format(fornNaoPagam.length)}</span>`, `Volume: ${brlShort(totValFornNaoPagam)} (${fmtP(totValRec ? (totValFornNaoPagam / totValRec) * 100 : 0, 1)})`, 'hl')}
    </div>

    <!-- DASHBOARD VISUAL: EVOLUÇÃO MENSAL DA VERBA + TOP FORNECEDORES -->
    <div class="grid two" style="margin-top:20px">
      <div class="card">
        <h3>📈 Evolução Mensal da Verba Logística (R$) ${dica}</h3>
        ${porMes.length ? `
          <div class="bar-chart-container" style="height:285px;padding-top:55px">
            <div class="bar-chart-wrapper">
              ${porMes.map((m, idx) => {
                const pctH = (m.verba / maxMesVerba) * 100;
                const isSel = isSelectedArr(recFiltro.mes, m.mes);
                const pctEfetivo = m.valorRec ? (m.verba / m.valorRec) * 100 : 0;
                let varTag = `<span class="bar-var-tag up">${fmtP(pctEfetivo, 2)}</span>`;
                if (idx > 0 && porMes[idx - 1].verba > 0) {
                  const vp = ((m.verba - porMes[idx - 1].verba) / porMes[idx - 1].verba) * 100;
                  varTag = `<span class="bar-var-tag ${vp >= 0 ? 'up' : 'down'}">${vp >= 0 ? '+' : ''}${fmtP(vp, 0)}</span>`;
                }
                const ttItems = [
                  { prod: `${mesLabel(m.mes)}`, sub: `Verba: ${brl(m.verba)} (${fmtP(pctEfetivo, 2)})` },
                  { prod: `Recebido: ${brl(m.valorRec)}`, sub: `${fmtN.format(m.nfs)} NFs · Clique para filtrar` }
                ];
                return `
                <div class="bar-chart-col" data-verba-mes="${esc(m.mes)}" style="cursor:pointer">
                  <div class="bar-chart-bar ${isSel ? 'is-proj' : ''}" style="height:${Math.max(pctH, 6)}%;background:linear-gradient(180deg, #35d49a 0%, #166548 100%);border-color:rgba(53,212,154,0.5)"
                       data-tooltip-title="${esc(mesLabel(m.mes))}"
                       data-tooltip-color="var(--ok)"
                       data-tooltip-items="${JSON.stringify(ttItems).replace(/"/g, '&quot;')}">
                    <div class="bar-val-label" style="color:var(--ok)">
                      <span>${brlShort(m.verba).replace('R$ ', '')}</span>
                      ${varTag}
                    </div>
                  </div>
                  <div class="bar-date-label" style="${isSel ? 'color:var(--accent);font-weight:800' : ''}">${esc(m.mes)}</div>
                </div>`;
              }).join('')}
            </div>
          </div>
        ` : '<p style="color:var(--mute)">Sem dados mensais.</p>'}
      </div>

      <div class="card">
        <h3>🏆 Top 12 Fornecedores por Verba Arrecadada ${dica}</h3>
        <div class="dept-hbar-list">
          ${topFornChart.length ? topFornChart.map((f, idx) => {
            const barW = maxFornVerba ? (f.verba / maxFornVerba) * 100 : 0;
            const pctForn = f.valorRec ? (f.verba / f.valorRec) * 100 : 0;
            const isSel = isSelectedArr(recFiltro.fornecedor, f.fornecedor);
            const barCol = isSel ? 'var(--accent)' : (idx < 3 ? '#35d49a' : '#4285f4');
            return `
            <div class="dept-hbar-row ${isSel ? 'active-dept' : ''}" data-verba-forn="${esc(f.fornecedor)}" title="${esc(f.fornecedor)}: Verba ${brl(f.verba)} (${fmtP(pctForn, 2)}) sobre ${brl(f.valorRec)}">
              <div class="dept-hbar-name">${esc(f.fornecedor)}</div>
              <div class="dept-hbar-track">
                <div class="dept-hbar-fill" style="width:${Math.max(barW, 3)}%;background:${barCol}"></div>
              </div>
              <div class="dept-hbar-val">
                <span style="color:var(--ok)">${brlShort(f.verba).replace('R$ ', '')}</span>
                <span style="color:var(--mute);font-size:11px;margin-left:4px">(${fmtP(pctForn, 2)})</span>
              </div>
            </div>`;
          }).join('') : '<p style="color:var(--mute)">Nenhum fornecedor com verba no filtro atual.</p>'}
        </div>
      </div>
    </div>

    <!-- SEÇÃO DESTACADA: TODOS OS FORNECEDORES QUE NÃO PAGAM VERBA LOGÍSTICA -->
    <div class="card" style="margin-top:20px;border-left:4px solid var(--crit)">
      <div class="card-header-action">
        <h3>🚨 FORNECEDORES QUE NÃO PAGAM VERBA LOGÍSTICA (${fmtN.format(fornNaoPagam.length)} FORNECEDORES · ${brlShort(totValFornNaoPagam)})</h3>
        <button class="toggle-btn" id="btnToggleSemVerba">
          ${semVerbaExpanded ? '▲ Ocultar Lista' : '▼ Exibir Fornecedores (' + fornNaoPagam.length + ')'}
        </button>
      </div>

      <div class="collapsible-content ${semVerbaExpanded ? 'open' : ''}">
        <div class="prod-controls" style="margin-bottom:12px;justify-content:space-between">
          <span style="font-size:13px;color:var(--mute)">Fornecedores com <b>R$ 0,00</b> de verba logística no período filtrado. Clique em qualquer linha para filtrar o painel por ele.</span>
          <div class="prod-controls">
            <select id="selSemVerbaOrdem">
              <option value="valor" ${semVerbaOrdem === 'valor' ? 'selected' : ''}>Ordem: maior volume recebido (R$)</option>
              <option value="nfs" ${semVerbaOrdem === 'nfs' ? 'selected' : ''}>Ordem: maior qtd de NFs</option>
              <option value="nome" ${semVerbaOrdem === 'nome' ? 'selected' : ''}>Ordem: ordem alfabética (A-Z)</option>
            </select>
            <input type="text" id="inputSearchSemVerba" placeholder="🔍 Buscar fornecedor ou CNPJ sem verba..." value="${esc(searchSemVerba)}" style="width:270px">
          </div>
        </div>
        <div class="tw">
          <table>
            <thead>
              <tr>
                <th>#</th>
                <th>Fornecedor</th>
                <th>CNPJ</th>
                <th>Último Receb.</th>
                <th class="r">Qtd NFs</th>
                <th class="r">Qtd Faturada</th>
                <th class="r">Valor Recebido (R$)</th>
                <th class="r">% do Volume Total</th>
                <th class="r">Verba</th>
              </tr>
            </thead>
            <tbody>
              ${mostradosSem.length ? mostradosSem.map((f, idx) => {
                const isSel = isSelectedArr(recFiltro.fornecedor, f.fornecedor);
                const pctVol = totValRec ? (f.valorRec / totValRec) * 100 : 0;
                return `
                <tr class="clickable-row ${isSel ? 'active-row' : ''}" data-verba-forn="${esc(f.fornecedor)}">
                  <td style="color:var(--mute);font-weight:700">${idx + 1}</td>
                  <td><b>${esc(f.fornecedor)}</b></td>
                  <td style="color:var(--mute);font-size:13px">${esc(f.cnpj || '-')}</td>
                  <td>${esc(f.ultimaData || '-')}</td>
                  <td class="r">${fmtN.format(f.nfs)}</td>
                  <td class="r">${fmtN.format(f.qtd)}</td>
                  <td class="r" style="font-weight:700">${brl(f.valorRec)}</td>
                  <td class="r">${fmtP(pctVol, 2)}</td>
                  <td class="r"><span class="badge-pill badge-verba-nao">R$ 0,00 (0%)</span></td>
                </tr>`;
              }).join('') : '<tr><td colspan="9">Nenhum fornecedor sem verba encontrado no filtro atual.</td></tr>'}
              ${fornNaoPagam.length ? `
                <tr class="tot">
                  <td colspan="4"><b>Total Fornecedores Sem Verba (${fmtN.format(fornNaoPagam.length)})</b></td>
                  <td class="r">${fmtN.format(fornNaoPagam.reduce((s,f) => s + f.nfs, 0))}</td>
                  <td class="r">${fmtN.format(fornNaoPagam.reduce((s,f) => s + f.qtd, 0))}</td>
                  <td class="r" style="color:var(--crit)">${brl(totValFornNaoPagam)}</td>
                  <td class="r">${fmtP(totValRec ? (totValFornNaoPagam / totValRec) * 100 : 0, 2)}</td>
                  <td class="r" style="color:var(--crit)">R$ 0,00</td>
                </tr>` : ''}
            </tbody>
          </table>
        </div>
        ${restamSem > 0 ? `<div style="text-align:center;margin-top:12px"><button class="btn-more" id="btnMoreSemVerba">Mostrar mais 150 fornecedores (restam ${fmtN.format(restamSem)})</button></div>` : ''}
      </div>
    </div>

          <select id="selVerbaOrdem">
            <option value="verba" ${verbaOrdem === 'verba' ? 'selected' : ''}>Ordem: maior verba R$</option>
            <option value="pct" ${verbaOrdem === 'pct' ? 'selected' : ''}>Ordem: maior % verba</option>
            <option value="valor" ${verbaOrdem === 'valor' ? 'selected' : ''}>Ordem: maior valor recebido</option>
          </select>
          <input type="text" id="inputSearchRecVerba" placeholder="🔍 Buscar fornecedor, NF, loja..." value="${esc(searchRecVerba)}" style="width:260px">
        </div>
      </div>
      <div class="tw">
        <table>
          <thead>

              <th>NF</th>
              <th>Recebimento</th>
              <th>Loja</th>
              <th>Fornecedor</th>
              <th>Tipo Carga</th>
              <th class="r">Valor Recebido</th>
              <th class="r">% Verba</th>
              <th class="r">Verba Apurada (R$)</th>
            </tr>

/* ================= SETORES, ABAS E BARRA DE FILTROS ================= */
const SETORES = {
  gestao:      {title:'Gestão de Estoque', icon:'📦', tabs:['geral','shelf','aging','ocup','carteira']},
  admin:       {title:'Administrativo',    icon:'🗂️', tabs:['transito','prealerta']},
  recebimento: {title:'Recebimento',       icon:'📥', tabs:['recebnotas','recebverba']}
};

const SECTIONS = [
  {id:'geral',      setor:'gestao',      title:'Visão Geral',                    render:() => secGeral()},
  {id:'shelf',      setor:'gestao',      title:'Shelf Life',                     render:() => secShelf()},
  {id:'aging',      setor:'gestao',      title:'Aging',                          render:() => secAging()},
  {id:'ocup',       setor:'gestao',      title:'Ocupação',                       render:() => secOcup()},
  {id:'carteira',   setor:'gestao',      title:'Carteira',                       render:() => secCarteira()},
  {id:'transito',   setor:'admin',       title:'🚚 Notas em Trânsito',           render:() => secTransito()},
  {id:'prealerta',  setor:'admin',       title:'⚠️ Pré-Alerta (Sobra e Falta)',  render:() => secPreAlerta()},
  {id:'recebnotas', setor:'recebimento', title:'📄 Notas de Recebimento',        render:() => secRecebNotas()},
  {id:'recebverba', setor:'recebimento', title:'💰 Verba Logística',             render:() => secRecebVerba()}
];

let activeTab = 'geral';
const lastTab = {gestao:'geral', admin:'transito', recebimento:'recebnotas'};
const setorDe = id => (SECTIONS.find(s => s.id === id) || {setor:'gestao'}).setor;

let filterOcupGalpao = [];
const SHELF_ORDER = ['0 a 5 dias','06 a 15 dias','16 a 30 dias','31 a 60 dias','61 a 90 dias','Acima de 90 dias','Sem data de Validade'];
const AGING_ORDER = ['0 a 15 dias','16 a 30 dias','30 a 60 dias','Acima de 60 dias'];

function setActiveTab(id){
  activeTab = id;
  try { history.replaceState(null, '', '#' + id); } catch(e) { window.location.hash = id; }
  render();
}

function renderNav(){
  const setor = setorDe(activeTab);
  const box = $('#setores');
  if (box) {
    box.innerHTML = Object.entries(SETORES).map(([k,s]) =>
      `<button data-setor="${k}" aria-pressed="${k === setor}" title="${s.title}"><span class="si">${s.icon}</span><span class="st">${s.title}</span></button>`).join('');
    box.querySelectorAll('button').forEach(btn => btn.addEventListener('click', () => {
      const k = btn.getAttribute('data-setor');
      if (k !== setorDe(activeTab)) setActiveTab(lastTab[k] || SETORES[k].tabs[0]);
    }));
  }
  const nav = $('#tabs');
  if (!nav) return;
  nav.innerHTML = SECTIONS.filter(s => s.setor === setor).map(s =>
    `<button data-tab="${s.id}" role="tab" aria-selected="${s.id === activeTab}">${s.title}</button>`).join('');
  nav.querySelectorAll('button').forEach(btn => btn.addEventListener('click', () => setActiveTab(btn.getAttribute('data-tab'))));
}

function render(){
  let hash = window.location.hash.replace('#','');
  if (hash === 'admin') hash = 'transito';
  if (hash && SECTIONS.some(s => s.id === hash)) activeTab = hash;
  const setor = setorDe(activeTab);
  lastTab[setor] = activeTab;
  document.body.setAttribute('data-setor', setor);
  renderNav();
  if (!D && setor !== 'admin' && setor !== 'recebimento') return;

  SECTIONS.forEach(s => {
    const el = $('#s-' + s.id);
    if (!el) return;
    if (s.id === activeTab) {
      el.classList.add('on');
      try {
        s.render();
      } catch(err) {
        console.error('Erro ao renderizar seção ' + s.id, err);
        el.innerHTML = '<div class="card"><h3>Erro de Exibição</h3><p>Ocorreu um erro ao carregar esta aba.</p></div>';
      }
    } else {
      el.classList.remove('on');
    }
  });
  renderFilterBar();
}

/* ---------- barra de filtros com suporte a seleção múltipla ---------- */
const optF = (v, l, g) => ({v:String(v), l, g});
let openDropdownIdx = null;
let dropdownSearchTerm = '';

function fbDefs(tab){
  if (tab === 'geral' && D) {
    const rows = D.rows;
    const baseA = filterArea.length === 0 ? rows : rows.filter(r => hasArr(filterArea, r.area));
    const ruas = Array.from(new Set(baseA.map(r => r.rua).filter(r => r > 0))).sort((a,b) => a - b);
    const locais = Array.from(new Set(rows.map(r => r.est).filter(Boolean)));
    const status = Array.from(new Set(rows.map(r => r.status).filter(Boolean))).sort();
    return [
      {label:'Galpão', multi:true, allLabel:'Todos', values:filterArea, options:[optF('1','Galpão 1'), optF('7','Galpão 2')], change:vals => { filterArea = vals; filterRua = []; }},
      {label:'Rua', multi:true, allLabel:'Todas', values:filterRua, options:ruas.map(r => optF(r, 'Rua ' + r)), change:vals => { filterRua = vals; }},
      {label:'Local de estoque', multi:true, allLabel:'Todos', values:filterLocalEst, options:locais.map(l => optF(l, nice(l))), change:vals => { filterLocalEst = vals; }},
      {label:'Status', multi:true, allLabel:'Todos', values:filterStatusEst, options:status.map(s => optF(s, s)), change:vals => { filterStatusEst = vals; }}
    ];
  }
  if (tab === 'shelf' || tab === 'aging') {
    const isShelf = tab === 'shelf';
    return [{
      label:isShelf ? 'Validade' : 'Aging',
      multi:true,
      allLabel:'Todas',
      values:isShelf ? filterShelfFaixa : filterAgingFaixa,
      options:[
        ...['ok','warn','crit','none'].filter(k => isShelf || k !== 'none').map(k => optF(k, CLS[k].n, 'Classe')),
        ...(isShelf ? SHELF_ORDER : AGING_ORDER).map(f => optF(f, f, 'Faixa'))
      ],
      change:vals => { if (isShelf) filterShelfFaixa = vals; else filterAgingFaixa = vals; }
    }];
  }
  if (tab === 'ocup') {
    return [{label:'Galpão', multi:true, allLabel:'Todos', values:filterOcupGalpao, options:[optF('g1','Galpão 1'), optF('g2','Galpão 2')], change:vals => { filterOcupGalpao = vals; }}];
  }
  if (tab === 'carteira' && D) {
    const C = D.cart || [];
    const uniq = f => Array.from(new Set(C.map(f))).filter(Boolean);
    return [
      {label:'Data de geração', multi:true, allLabel:'Todas', values:dateReservaFilter, options:uniq(r => r.gerReserva).sort((a,b) => a.localeCompare(b)).map(d => optF(d, 'Data ' + d)), change:vals => { dateReservaFilter = vals; }},
      {label:'Tipo de separação', multi:true, allLabel:'Todos', values:sepFilter, options:uniq(r => r.tipoSep).map(t => optF(t, t)), change:vals => { sepFilter = vals; }},
      {label:'Destino', multi:true, allLabel:'Todos', values:targetDestFilter, options:uniq(r => r.dest).sort((a,b) => String(a).localeCompare(String(b), undefined, {numeric:true})).map(d => optF(d, d)), change:vals => { targetDestFilter = vals; }},
      {label:'Departamento', multi:true, allLabel:'Todos', values:deptFilter, options:uniq(r => r.dept).sort().map(d => optF(d, d)), change:vals => { deptFilter = vals; }},
      {label:'Itens', multi:false, value:statusFilter, def:'pendente', options:[optF('pendente','Pendentes'), optF('separado','Separados'), optF('todos','Todos')], set:v => { statusFilter = v; }}
    ];
  }
  if (tab === 'transito' && AdminD) {
    const notas = admNotasTodas();
    const meses = Array.from(new Set(notas.map(n => nfMes(n.dataEmissao)))).sort((a,b) => mesOrdem(a).localeCompare(mesOrdem(b)));
    const lojas = Array.from(new Set(notas.flatMap(n => [sCod(n.origem), sCod(n.destino)]).filter(c => c && c !== CD_COD)))
      .sort((a,b) => a.localeCompare(b, undefined, {numeric:true}));
    return [
      {label:'Sentido', multi:true, allLabel:'Todos', values:admFiltro.sentido, options:Object.entries(SENT_LABEL).map(([k,l]) => optF(k, l)), change:vals => { admFiltro.sentido = vals; admLimite = 150; }},
      {label:'Mês de emissão', multi:true, allLabel:'Todos', values:admFiltro.mes, options:meses.map(m => optF(m, mesLabel(m))), change:vals => { admFiltro.mes = vals; admLimite = 150; }},
      {label:'Tempo em trânsito', multi:true, allLabel:'Todos', values:admFiltro.faixa, options:Object.entries(FAIXA_DIAS_LABEL).map(([k,l]) => optF(k, l)), change:vals => { admFiltro.faixa = vals; admLimite = 150; }},
      {label:'Loja', multi:true, allLabel:'Todas', values:admFiltro.loja, options:lojas.map(c => optF(c, getNomeLoja(c))), change:vals => { admFiltro.loja = vals; admLimite = 150; }}
    ];
  }
  if (tab === 'prealerta' && AdminD) {
    const todas = preTodas();
    const uq = f => Array.from(new Set(todas.map(f))).filter(Boolean);
    const reset = () => { preLimite = 150; };
    const defs = [
      {label:'Loja', multi:true, allLabel:'Todas', values:preFiltro.loja, options:uq(r => r.loja).sort((a,b) => a.localeCompare(b)).map(l => optF(l, l)), change:vals => { preFiltro.loja = vals; reset(); }},
      {label:'Mês', multi:true, allLabel:'Todos', values:preFiltro.mes, options:uq(r => r.mes).sort((a,b) => mesOrdem(a).localeCompare(mesOrdem(b))).map(m => optF(m, mesLabel(m))), change:vals => { preFiltro.mes = vals; reset(); }}
    ];
    if (todas.some(r => r.tipo)) defs.push({label:'Tipo', multi:true, allLabel:'Todos', values:preFiltro.tipo, options:[optF('SOBRA','Sobra'), optF('FALTA','Falta')], change:vals => { preFiltro.tipo = vals; reset(); }});
    if (todas.some(r => r.statusCd)) defs.push({label:'Status CD', multi:true, allLabel:'Todos', values:preFiltro.stCd, options:uq(r => r.statusCd).sort().map(s => optF(s, s)), change:vals => { preFiltro.stCd = vals; reset(); }});
    if (todas.some(r => r.statusLoja)) defs.push({label:'Status Loja', multi:true, allLabel:'Todos', values:preFiltro.stLoja, options:uq(r => r.statusLoja).sort().map(s => optF(s, s)), change:vals => { preFiltro.stLoja = vals; reset(); }});
    defs.push({label:'Documento', multi:true, allLabel:'Todos', values:preFiltro.situacao, options:uq(r => r.situacao).sort().map(s => optF(s, s)), change:vals => { preFiltro.situacao = vals; reset(); }});
    return defs;
  }
  if ((tab === 'recebnotas' || tab === 'recebverba') && RecebD) {
    const notas = recNotasTodas();
    const uq = f => Array.from(new Set(notas.map(f))).filter(Boolean);
    const reset = () => { recLimite = 150; verbaLimite = 150; semVerbaLimite = 150; };
    return [
      {label:'Mês', multi:true, allLabel:'Todos', values:recFiltro.mes, options:uq(r => r.mes).sort((a,b) => mesOrdem(a).localeCompare(mesOrdem(b))).map(m => optF(m, mesLabel(m))), change:vals => { recFiltro.mes = vals; reset(); }},
      {label:'Loja', multi:true, allLabel:'Todas', values:recFiltro.loja, options:uq(r => r.loja).sort((a,b) => a.localeCompare(b, undefined, {numeric:true})).map(l => optF(l, l)), change:vals => { recFiltro.loja = vals; reset(); }},
      {label:'Fornecedor', multi:true, allLabel:'Todos', values:recFiltro.fornecedor, options:uq(r => r.fornecedor).sort().map(f => optF(f, f)), change:vals => { recFiltro.fornecedor = vals; reset(); }},
      {label:'Tipo de Operação', multi:true, allLabel:'Todos', values:recFiltro.tipoOp, options:uq(r => r.tipoOperacao).sort().map(o => optF(o, o)), change:vals => { recFiltro.tipoOp = vals; reset(); }},
      {label:'Tipo de Carga', multi:true, allLabel:'Todos', values:recFiltro.tipoCarga, options:uq(r => r.tipoCarga).sort().map(t => optF(t, t)), change:vals => { recFiltro.tipoCarga = vals; reset(); }},
      {label:'Paga Verba?', multi:false, value:recFiltro.pagaVerba, def:'todos', options:[optF('todos','Todos'), optF('sim','Sim (Com Verba)'), optF('nao','Não (Sem Verba)')], set:v => { recFiltro.pagaVerba = v; reset(); }}
    ];
  }
  return [];
}

function renderFilterBar(){
  const el = $('#filterbar');
  if (!el) return;
  const defs = fbDefs(activeTab);
  if (!defs.length) { el.innerHTML = ''; el.classList.remove('on'); return; }

  const same = (a, b) => String(a).toLowerCase() === String(b).toLowerCase();

  // Coletar chips ativos (cada item marcado vira um chip individual)
  const chips = [];
  defs.forEach((d, i) => {
    if (d.multi) {
      (d.values || []).forEach(v => {
        const opt = d.options.find(o => same(o.v, v));
        chips.push({ defIdx: i, val: v, label: d.label, text: opt ? opt.l : v });
      });
    } else {
      const defV = d.def || 'todos';
      if (!same(d.value, defV)) {
        const opt = d.options.find(o => same(o.v, d.value));
        chips.push({ defIdx: i, val: d.value, label: d.label, text: opt ? opt.l : d.value });
      }
    }
  });

  const renderControl = (d, i) => {
    if (!d.multi) {
      const defV = d.def || 'todos';
      let html = '';
      d.options.forEach(o => {
        html += `<option value="${esc(o.v)}" ${same(o.v, d.value) ? 'selected' : ''}>${esc(o.l)}</option>`;
      });
      return `<div class="gf ${same(d.value, defV) ? '' : 'on'}"><span class="gf-lbl">${esc(d.label)}</span><select data-gf="${i}">${html}</select></div>`;
    }

    const vals = d.values || [];
    const isOn = vals.length > 0;
    const isOpen = openDropdownIdx === i;
    let btnTxt = d.allLabel || 'Todos';
    if (vals.length === 1) {
      const found = d.options.find(o => same(o.v, vals[0]));
      btnTxt = found ? found.l : vals[0];
    } else if (vals.length > 1) {
      btnTxt = `${vals.length} selecionados`;
    }

    const q = isOpen ? dropdownSearchTerm.toLowerCase().trim() : '';
    const filteredOpts = q ? d.options.filter(o => o.l.toLowerCase().includes(q) || o.v.toLowerCase().includes(q)) : d.options;

    return `
    <div class="gf ${isOn ? 'on' : ''}" data-ms-idx="${i}">
      <span class="gf-lbl">${esc(d.label)}</span>
      <div class="ms-wrap ${isOpen ? 'open' : ''}">
        <button type="button" class="ms-btn" data-ms-toggle="${i}" title="${esc(btnTxt)}">
          <span class="ms-btn-txt">${esc(btnTxt)}</span>
          ${vals.length > 0 ? `<span class="ms-badge">${vals.length}</span>` : ''}
          <span class="ms-arrow">${isOpen ? '▲' : '▼'}</span>
        </button>
        <div class="ms-menu" data-ms-menu="${i}">
          <input type="text" class="ms-search" data-ms-search="${i}" placeholder="🔍 Filtrar ${esc(d.label.toLowerCase())}..." value="${isOpen ? esc(dropdownSearchTerm) : ''}" />
          <div class="ms-actions">
            <span>${vals.length} de ${d.options.length}</span>
            <div class="ms-actions-btns">
              <button type="button" data-ms-all="${i}">Marcar todos</button>
              <button type="button" data-ms-none="${i}">Limpar</button>
            </div>
          </div>
          <div class="ms-list">
            ${filteredOpts.length ? filteredOpts.map(o => {
              const checked = vals.some(x => same(x, o.v));
              return `<label class="ms-item ${checked ? 'checked' : ''}">
                <input type="checkbox" data-ms-chk="${i}" value="${esc(o.v)}" ${checked ? 'checked' : ''} />
                <span>${esc(o.l)}</span>
              </label>`;
            }).join('') : '<div style="padding:8px;color:var(--mute);font-size:12px">Nenhuma opção encontrada.</div>'}
          </div>
        </div>
      </div>
    </div>`;
  };

  el.classList.add('on');
  el.innerHTML = `
    <div class="gf-row">
      <span class="gf-title">🔎 Filtros</span>
      ${defs.map(renderControl).join('')}
      <button class="gf-clear" id="gfClear" ${chips.length ? '' : 'disabled'}>✕ Limpar filtros</button>
    </div>
    ${chips.length ? `<div class="gf-chips">${chips.map((c, ci) => `<button class="chip" data-chip-idx="${ci}" title="Remover filtro">${esc(c.label)}: <b>${esc(c.text)}</b> ✕</button>`).join('')}</div>` : ''}`;

  // Eventos selects simples
  el.querySelectorAll('select[data-gf]').forEach(s => s.addEventListener('change', e => {
    defs[+s.getAttribute('data-gf')].set(e.target.value);
    render();
  }));

  // Abrir/fechar dropdown multiselect
  el.querySelectorAll('[data-ms-toggle]').forEach(btn => btn.addEventListener('click', e => {
    e.stopPropagation();
    const idx = +btn.getAttribute('data-ms-toggle');
    if (openDropdownIdx === idx) {
      openDropdownIdx = null;
      dropdownSearchTerm = '';
    } else {
      openDropdownIdx = idx;
      dropdownSearchTerm = '';
    }
    renderFilterBar();
    if (openDropdownIdx !== null) {
      const inp = el.querySelector(`[data-ms-search="${openDropdownIdx}"]`);
      if (inp) inp.focus();
    }
  }));

  // Impedir que cliques dentro do menu fechem o dropdown
  el.querySelectorAll('[data-ms-menu]').forEach(menu => menu.addEventListener('click', e => {
    e.stopPropagation();
  }));

  // Busca dentro do dropdown
  el.querySelectorAll('[data-ms-search]').forEach(inp => inp.addEventListener('input', e => {
    dropdownSearchTerm = e.target.value;
    renderFilterBar();
    const nextInp = $('#filterbar').querySelector(`[data-ms-search="${openDropdownIdx}"]`);
    if (nextInp) {
      nextInp.focus();
      nextInp.setSelectionRange(dropdownSearchTerm.length, dropdownSearchTerm.length);
    }
  }));

  // Marcar / desmarcar checkbox individual
  el.querySelectorAll('[data-ms-chk]').forEach(chk => chk.addEventListener('change', e => {
    const idx = +chk.getAttribute('data-ms-chk');
    const val = chk.value;
    const d = defs[idx];
    const nextVals = [...(d.values || [])];
    const pos = nextVals.findIndex(x => same(x, val));
    if (e.target.checked && pos === -1) nextVals.push(val);
    else if (!e.target.checked && pos !== -1) nextVals.splice(pos, 1);
    d.change(nextVals);
    render();
    if (openDropdownIdx !== null) {
      const nextInp = $('#filterbar').querySelector(`[data-ms-search="${openDropdownIdx}"]`);
      if (nextInp) nextInp.focus();
    }
  }));

  // Marcar todos (respeitando a busca atual se houver)
  el.querySelectorAll('[data-ms-all]').forEach(btn => btn.addEventListener('click', () => {
    const idx = +btn.getAttribute('data-ms-all');
    const d = defs[idx];
    const q = dropdownSearchTerm.toLowerCase().trim();
    const visibleOpts = q ? d.options.filter(o => o.l.toLowerCase().includes(q) || o.v.toLowerCase().includes(q)) : d.options;
    const nextVals = [...(d.values || [])];
    visibleOpts.forEach(o => {
      if (!nextVals.some(x => same(x, o.v))) nextVals.push(o.v);
    });
    d.change(nextVals);
    render();
  }));

  // Limpar apenas aquele dropdown
  el.querySelectorAll('[data-ms-none]').forEach(btn => btn.addEventListener('click', () => {
    const idx = +btn.getAttribute('data-ms-none');
    defs[idx].change([]);
    render();
  }));

  // Remover chip individual
  el.querySelectorAll('[data-chip-idx]').forEach(btn => btn.addEventListener('click', () => {
    const c = chips[+btn.getAttribute('data-chip-idx')];
    const d = defs[c.defIdx];
    if (d.multi) {
      d.change((d.values || []).filter(x => !same(x, c.val)));
    } else {
      d.set(d.def || 'todos');
    }
    render();
  }));

  // Limpar todos os filtros da aba
  const clr = $('#gfClear');
  if (clr) clr.addEventListener('click', () => {
    openDropdownIdx = null;
    dropdownSearchTerm = '';
    defs.forEach(d => {
      if (d.multi) d.change([]);
      else d.set(d.def || 'todos');
    });
    render();
  });
}

// Fechar dropdown ao clicar fora
document.addEventListener('click', () => {
  if (openDropdownIdx !== null) {
    openDropdownIdx = null;
    dropdownSearchTerm = '';
    renderFilterBar();
  }
});

/* qualquer clique interno (gráficos, linhas) que re-renderiza uma seção também atualiza a barra */
['secGeral','secShelf','secAging','secOcup','secCarteira','secTransito','secPreAlerta','secRecebNotas','secRecebVerba'].forEach(n => {
  const orig = window[n];
  window[n] = function(){ const r = orig.apply(this, arguments); renderFilterBar(); return r; };
});


/* barra lateral recolhível: lembra a escolha; sem escolha, recolhe só em tela estreita */
(function(){
  let manual = null;
  try { const v = localStorage.getItem('sideCollapsed'); if (v !== null) manual = v === '1'; } catch(e) {}
  const aplica = () => document.body.classList.toggle('side-collapsed', manual !== null ? manual : window.innerWidth < 820);
  aplica();
  window.addEventListener('resize', aplica);
  document.addEventListener('click', e => {
    if (!e.target.closest('#sideToggle')) return;
    manual = !document.body.classList.contains('side-collapsed');
    try { localStorage.setItem('sideCollapsed', manual ? '1' : '0'); } catch(err) {}
    aplica();
  });
})();

document.querySelectorAll('#basis button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('#basis button').forEach(b => b.setAttribute('aria-pressed', 'false'));
    btn.setAttribute('aria-pressed', 'true');
    basis = btn.getAttribute('data-b');
    render();
  });
});

function toggleTvMode() {
  const isTv = document.body.classList.toggle('tvmode');
  const btnTv = $('#tv');
  if (btnTv) btnTv.setAttribute('aria-pressed', isTv);

  if (isTv) {
    if (document.documentElement.requestFullscreen) {
      document.documentElement.requestFullscreen().catch(() => {});
    }
    startTvRotation();
  } else {
    if (document.exitFullscreen && document.fullscreenElement) {
      document.exitFullscreen().catch(() => {});
    }
    stopTvRotation();
  }
}

function startTvRotation() {
  stopTvRotation();
  tvTimer = setInterval(() => {
    const lista = SECTIONS.filter(s => s.setor === setorDe(activeTab));
    const currentIndex = lista.findIndex(s => s.id === activeTab);
    setActiveTab(lista[(currentIndex + 1) % lista.length].id);
  }, CONFIG.TV_SEGUNDOS * 1000);
}

function stopTvRotation() {
  if (tvTimer) {
    clearInterval(tvTimer);
    tvTimer = null;
  }
}

document.addEventListener('fullscreenchange', () => {
  if (!document.fullscreenElement && document.body.classList.contains('tvmode')) {
    document.body.classList.remove('tvmode');
    const btnTv = $('#tv');
    if (btnTv) btnTv.setAttribute('aria-pressed', 'false');
    stopTvRotation();
  }
});

const btnTv = $('#tv');
if (btnTv) {
  btnTv.addEventListener('click', toggleTvMode);
}

window.addEventListener('DOMContentLoaded', () => {
  renderNav();
  load();
});

window.addEventListener('hashchange', render);
setInterval(load, CONFIG.ATUALIZAR_MIN * 60 * 1000);
</script>
