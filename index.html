<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel de Estoque CD</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Semi+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: barra superior com abas, uma seção por vez (modo TV gira as abas). Visual escuro azul-marinho com amarelo de destaque. */
:root{
  color-scheme:dark;
  --bg:#071022; --panel:#0c1a38; --panel2:#10224a; --line:#1b2f5e;
  --text:#eaf0ff; --mute:#8da1cc; --accent:#ffc400;
  --blue:#4285f4; --navy:#3a5db0; --cream:#fce8b2;
  --ok:#35d49a; --warn:#ffb020; --crit:#ff5d62; --none:#5b6b8f;
  --f-body:'Barlow',system-ui,sans-serif; --f-num:'Barlow Semi Condensed','Barlow',system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font-family:var(--f-body);font-size:15px;line-height:1.35;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 28px}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}

header{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;flex-wrap:wrap;align-items:center;gap:12px 24px;padding:14px 0;border-bottom:1px solid var(--line)}
.brand{display:flex;flex-direction:column;line-height:1.1}
.brand b{font-family:var(--f-num);font-size:22px;letter-spacing:.02em}
.brand small{color:var(--mute);font-size:12px;letter-spacing:.14em;text-transform:uppercase}
nav{display:flex;gap:6px;flex-wrap:wrap}
nav button{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:8px 16px;font-weight:600}
nav button[aria-selected="true"]{background:var(--accent);color:#1a1400;border-color:var(--accent)}
.tools{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.seg button{background:var(--panel);border:0;padding:7px 12px;font-size:13px;font-weight:600;color:var(--mute)}
.seg button[aria-pressed="true"]{background:var(--panel2);color:var(--accent)}
.tv{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:7px 12px;font-size:13px;font-weight:600}
.tv[aria-pressed="true"]{background:var(--accent);color:#1a1400}
#src{font-size:12px;color:var(--mute);width:100%;display:flex;gap:8px;align-items:center}
#src i{width:8px;height:8px;border-radius:50%;background:var(--warn);display:inline-block}
#src.live i{background:var(--ok)}
#bar{height:3px;background:var(--accent);width:0;position:fixed;left:0;top:0;z-index:9}

section{display:none;padding-top:20px}
section.on{display:block}
h2{font-family:var(--f-num);font-size:26px;margin:0 0 4px;letter-spacing:.01em}
.sub{color:var(--mute);margin:0 0 16px}
.grid{display:grid;gap:14px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.two{grid-template-columns:minmax(0,1fr) minmax(0,1.3fr)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:16px;min-width:0}
.card h3{margin:0 0 12px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);font-weight:600}
.kpi .v{font-family:var(--f-num);font-size:34px;font-weight:700;line-height:1.05}
.kpi .s{color:var(--mute);font-size:13px;margin-top:6px}
.kpi.hl{border-top:3px solid var(--accent)}
.good{color:var(--ok)} .warnc{color:var(--warn)} .critc{color:var(--crit)}

.donutwrap{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.donut{width:210px;height:210px;flex:none}
.donut text{fill:var(--text);font-family:var(--f-num)}
.legend{display:flex;flex-direction:column;gap:8px;min-width:200px;flex:1}
.legend div{display:flex;align-items:center;gap:8px;font-size:14px}
.legend i{width:11px;height:11px;border-radius:2px;flex:none}
.legend span:last-child{margin-left:auto;font-family:var(--f-num);font-weight:600;white-space:nowrap}

.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);font-weight:600;white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid #12244b;white-space:nowrap}
th.r,td.r{text-align:right;font-family:var(--f-num)}
tr.tot td{font-weight:700;border-top:1px solid var(--line);border-bottom:0}
td .dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:8px}
.bar{display:block;height:6px;background:#162a58;border-radius:3px;min-width:70px;margin-top:5px}
.bar b{display:block;height:100%;border-radius:3px}

/* Ocupação */
.occ{grid-template-columns:repeat(4,minmax(0,1fr)) minmax(0,1.5fr) minmax(0,1.3fr);align-items:stretch}
.mini{display:flex;flex-direction:column;gap:10px;min-width:0}
.mini .b{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 6px;text-align:center}
.mini .b small{display:block;color:var(--mute);font-size:13px}
.mini .b strong{font-family:var(--f-num);font-size:28px;line-height:1.1}
.mini.g1 .b{border-left:3px solid var(--blue);border-right:3px solid var(--blue)}
.mini.g2 .b{border-left:3px solid var(--navy);border-right:3px solid var(--navy)}
.pcts{display:flex;flex-direction:column;gap:12px;justify-content:center;min-width:0}
.pcts .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pcts .b{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px;text-align:center;min-width:0}
.pcts .b small{display:block;color:var(--mute);font-size:13px}
.pcts .b strong{font-family:var(--f-num);font-size:clamp(18px,1.7vw,26px)}
.pcts .big strong{font-size:clamp(34px,4vw,54px);color:var(--accent)}
.rua{display:flex;gap:10px;align-items:flex-end;height:210px;padding-top:6px}
.rua .c{flex:1;min-width:0;display:flex;flex-direction:column;align-items:stretch;height:100%}
.rua .stk{flex:1;display:flex;flex-direction:column;border-radius:3px;overflow:hidden;min-height:0}
.rua .lv{display:flex;align-items:center;justify-content:center;font-family:var(--f-num);font-size:13px;font-weight:600;overflow:hidden;min-height:0}
.rua .oc{background:var(--cream);color:#2b2205}
.rua .name{text-align:center;font-family:var(--f-num);font-size:18px;font-weight:600;margin-top:6px}
.lg{display:flex;gap:16px;font-size:13px;color:var(--mute);margin-bottom:8px;justify-content:center}
.lg i{display:inline-block;width:12px;height:12px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.foot{color:var(--mute);font-size:12px;margin-top:18px}

body.tvmode header nav,body.tvmode .seg{display:none}
body.tvmode .card{padding:22px}
body.tvmode h2{font-size:34px}
body.tvmode .kpi .v{font-size:46px}

@media (max-width:1100px){.occ{grid-template-columns:repeat(2,minmax(0,1fr))}.pcts,.donutcard{grid-column:1/-1}}
@media (max-width:820px){.two{grid-template-columns:minmax(0,1fr)}}
@media (prefers-reduced-motion:no-preference){#bar{transition:width .3s linear}}
</style>
</head>
<body>
<div id="bar"></div>
<header>
  <div class="brand"><b>Painel de Estoque</b><small>Centro de Distribuição</small></div>
  <nav id="tabs" role="tablist" aria-label="Seções"></nav>
  <div class="tools">
    <div class="seg" id="basis" role="group" aria-label="Medida">
      <button data-b="custo" aria-pressed="true">R$</button>
      <button data-b="qtd" aria-pressed="false">Qtd. endereçada</button>
    </div>
    <button class="tv" id="tv" aria-pressed="false">Modo TV</button>
  </div>
  <div id="src"><i></i><span id="srctxt">Carregando…</span></div>
</header>

<section id="s-geral"></section>
<section id="s-shelf"></section>
<section id="s-aging"></section>
<section id="s-ocup"></section>

<script>
/* ============ CONFIGURAÇÃO ============ */
const CONFIG = {
  DATA_URL: "./dados.json",
  ESTOQUE_FISICO: "ESTOQUE REVENDA",
  AREAS: { galpao1: "1", galpao2: "7", blocados: "5" },
  ATUALIZAR_MIN: 5,
  TV_SEGUNDOS: 20
};
</script>
<script>
const $ = s => document.querySelector(s);
const fmtN = new Intl.NumberFormat('pt-BR',{maximumFractionDigits:0});
const fmtP = (v,d=1)=> (isFinite(v)?v:0).toLocaleString('pt-BR',{minimumFractionDigits:d,maximumFractionDigits:d})+'%';
const brl = v => 'R$ '+new Intl.NumberFormat('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2}).format(v);
function brlShort(v){
  if(Math.abs(v)>=1e6) return 'R$ '+(v/1e6).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2})+' mi';
  if(Math.abs(v)>=1e3) return 'R$ '+(v/1e3).toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1})+' mil';
  return brl(v);
}
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const nice = s => String(s).replace(/^ESTOQUE\s+/i,'').toLowerCase().replace(/(^|\s)\S/g,c=>c.toUpperCase());

let D = null;
let basis = 'custo';
const val = r => basis==='custo' ? r.custo : r.qtd;
const fmtV = v => basis==='custo' ? brlShort(v) : fmtN.format(v);

/* ---------- Classificação ---------- */
const SHELF_CLASS = {'0 a 5 dias':'crit','06 a 15 dias':'crit','16 a 30 dias':'warn','31 a 60 dias':'warn','61 a 90 dias':'ok','Acima de 90 dias':'ok','Sem data de Validade':'none'};
const AGING_CLASS = {'0 a 15 dias':'ok','16 a 30 dias':'ok','30 a 60 dias':'warn','Acima de 60 dias':'crit'};
const CLS = {ok:{n:'Saudável',c:'var(--ok)'},warn:{n:'Atenção',c:'var(--warn)'},crit:{n:'Crítico',c:'var(--crit)'},none:{n:'Sem validade',c:'var(--none)'}};
const normF = s => String(s||'').replace(/\s+/g,' ').trim();

/* ---------- Carregamento a partir do dados.json ---------- */
async function fromJsonFile(){
  const res = await fetch(CONFIG.DATA_URL + '?t=' + Date.now(), { cache: 'no-store' });
  if (!res.ok) throw new Error('Não foi possível carregar o arquivo dados.json (HTTP ' + res.status + ').');
  const data = await res.json();
  
  const rawRows = data.dados1926 || [];
  const rawAddr = data.dados1682 || data.enderecos || data.ocupacao || [];
  
  const rows = rawRows.map(o => ({
    est: String(o["Local de Estoque"] || o["local de estoque"] || '').trim(),
    status: normF(o["Status"] || o["status"]),
    shelf: normF(o["Desc Shelf"] || o["desc shelf"]),
    aging: normF(o["Faixa Anging "] || o["Faixa Anging"] || o["faixa anging"]),
    qtd: +(o["Qtd. Endereçada"] || o["qtd. enderecada"] || 0),
    custo: +(o["Custo Bruto Total"] || o["custo bruto total"] || 0),
    prod: String(o["Produto"] || o["produto"] || '').slice(0,50),
    end: String(o["Endereço Logístico"] || o["endereco logistico"] || o["Endereço"] || o["endereco"] || '')
  }));

  const addr = rawAddr.map(o => {
    const status = normF(o["Status"] || o["status"] || 'Ativo');
    const ocup = normF(o["Endereço Ocupado"] || o["endereco ocupado"] || o["Ocupado"] || o["ocupado"]);
    return {
      end: String(o["Endereço Logístico"] || o["endereco logistico"] || o["Endereço"] || o["endereco"] || ''),
      occ: ocup === 'Ocupado' || ocup === 'Sim' || ocup === '1' || o["occ"] === true,
      ativo: status === 'Ativo' || status === ''
    };
  }).filter(a => a.ativo);

  let timeStr = 'JSON';
  if (data.ultimaAtualizacao) {
    const dt = new Date(data.ultimaAtualizacao);
    timeStr = dt.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
  }

  return { rows, addr, live: true, when: 'Atualizado às ' + timeStr };
}

function aviso(msg){
  $('#srctxt').textContent = msg;
  document.querySelectorAll('section').forEach(s=>{ s.innerHTML = '<div class="card"><h3>Sem dados</h3><p>'+esc(msg)+'</p></div>'; });
}

async function load(){
  try {
    const d = await fromJsonFile();
    D = d;
    $('#src').className = 'live';
    $('#srctxt').textContent = d.when;
    render();
  } catch(err) {
    console.error('Erro ao carregar dados:', err);
    aviso('Erro ao carregar dados do repositório: ' + err.message);
  }
}

/* ---------- Componentes ---------- */
function donut(items,center,sub){
  const tot = items.reduce((s,i)=>s+i.v,0)||1, R=70, C=2*Math.PI*R; let off=0, segs='';
  items.forEach(i=>{ const L=C*i.v/tot; if(L>0) segs+=`<circle r="${R}" cx="100" cy="100" fill="none" stroke="${i.c}" stroke-width="30" stroke-dasharray="${L} ${C-L}" stroke-dashoffset="${-off}" transform="rotate(-90 100 100)"><title>${esc(i.n)}: ${fmtV(i.v)} (${fmtP(i.v/tot*100)})</title></circle>`; off+=L; });
  return `<svg class="donut" viewBox="0 0 200 200" role="img" aria-label="${esc(sub||'Gráfico de rosca')}"><circle r="${R}" cx="100" cy="100" fill="none" stroke="#12244b" stroke-width="30"/>${segs}
    <text x="100" y="${sub?98:106}" text-anchor="middle" font-size="${String(center).length>5?24:30}" font-weight="700">${center}</text>${sub?`<text x="100" y="122" text-anchor="middle" font-size="13" style="fill:var(--mute)">${sub}</text>`:''}</svg>`;
}
function legend(items){
  const tot = items.reduce((s,i)=>s+i.v,0)||1;
  return `<div class="legend">${items.map(i=>`<div><i style="background:${i.c}"></i><span>${esc(i.n)}</span><span>${fmtV(i.v)} · ${fmtP(i.v/tot*100)}</span></div>`).join('')}</div>`;
}
const kpi = (l,v,s,cls='') => `<div class="card kpi ${cls}"><h3>${l}</h3><div class="v">${v}</div><div class="s">${s||''}</div></div>`;

/* ---------- Seções ---------- */
const ESTCOL = ['#ffc400','#4285f4','#35d49a','#c084fc','#ff7a9c'];
function secGeral(){
  const R = D.rows, by = {};
  R.forEach(r=>{(by[r.est]=by[r.est]||{custo:0,qtd:0,n:0}); by[r.est].custo+=r.custo; by[r.est].qtd+=r.qtd; by[r.est].n++;});
  const ests = Object.entries(by).sort((a,b)=>b[1].custo-a[1].custo);
  const totC = R.reduce((s,r)=>s+r.custo,0), totQ = R.reduce((s,r)=>s+r.qtd,0);
  const items = ests.map(([n,o],i)=>({n:nice(n),v:o.custo,c:ESTCOL[i%ESTCOL.length]}));
  const rev = R.filter(r=>r.est.trim()===CONFIG.ESTOQUE_FISICO);
  const st = {}; rev.forEach(r=>{(st[r.status]=st[r.status]||{custo:0,qtd:0,n:0}); st[r.status].custo+=r.custo; st[r.status].qtd+=r.qtd; st[r.status].n++;});
  const stRows = Object.entries(st).sort((a,b)=>b[1].custo-a[1].custo);
  const rc = rev.reduce((s,r)=>s+r.custo,0), rq = rev.reduce((s,r)=>s+r.qtd,0);
  const occ = occData();
  $('#s-geral').innerHTML = `<h2>Visão geral</h2><p class="sub">Estoque endereçado nos locais de estoque, com o valor a custo bruto.</p>
  <div class="grid kpis">
    ${kpi('Custo bruto total',brlShort(totC),brl(totC),'hl')}
    ${kpi('Qtd. endereçada total',fmtN.format(totQ),fmtN.format(R.length)+' linhas de palete')}
    ${kpi('Estoque revenda',brlShort(rc),fmtN.format(rq)+' endereçados · '+fmtP(rc/totC*100)+' do valor')}
    ${kpi('Ocupação do CD',fmtP(occ.pct,2),fmtN.format(occ.ocup)+' de '+fmtN.format(occ.total)+' endereços')}
  </div>
  <div class="grid two" style="margin-top:14px">
    <div class="card"><h3>Valor por local de estoque (R$)</h3>
      <div class="donutwrap">${donut(items,brlShort(totC).replace('R$ ',''),'custo bruto')}${legend(items)}</div></div>
    <div class="card"><h3>Status do estoque revenda</h3><div class="tw"><table>
      <tr><th>Status</th><th class="r">Linhas</th><th class="r">Qtd. endereçada</th><th class="r">Custo bruto</th><th class="r">% do valor</th></tr>
      ${stRows.map(([n,o])=>`<tr><td>${esc(n)}</td><td class="r">${fmtN.format(o.n)}</td><td class="r">${fmtN.format(o.qtd)}</td><td class="r">${brl(o.custo)}</td><td class="r">${fmtP(o.custo/rc*100)}</td></tr>`).join('')}
      <tr class="tot"><td>Total</td><td class="r">${fmtN.format(rev.length)}</td><td class="r">${fmtN.format(rq)}</td><td class="r">${brl(rc)}</td><td class="r">100,0%</td></tr></table></div></div>
  </div>
  <div class="card" style="margin-top:14px"><h3>Valor e quantidade por local de estoque</h3><div class="tw"><table>
    <tr><th>Local</th><th class="r">Linhas</th><th class="r">Qtd. endereçada</th><th class="r">Custo bruto</th><th>Participação</th></tr>
    ${ests.map(([n,o],i)=>`<tr><td><span class="dot" style="background:${ESTCOL[i%5]}"></span>${esc(nice(n))}</td><td class="r">${fmtN.format(o.n)}</td><td class="r">${fmtN.format(o.qtd)}</td><td class="r">${brl(o.custo)}</td><td><span class="num">${fmtP(o.custo/totC*100)}</span><span class="bar"><b style="width:${o.custo/totC*100}%;background:${ESTCOL[i%5]}"></b></span></td></tr>`).join('')}
  </table></div></div>`;
}

function faixaSection(id,title,sub,field,order,cmap,topCls,topTitle){
  const rev = D.rows.filter(r=>r.est.trim()===CONFIG.ESTOQUE_FISICO);
  const g = {}; order.forEach(f=>g[f]={custo:0,qtd:0,n:0});
  rev.forEach(r=>{const f=r[field]; (g[f]=g[f]||{custo:0,qtd:0,n:0}); g[f].custo+=r.custo; g[f].qtd+=r.qtd; g[f].n++;});
  const cls = {ok:0,warn:0,crit:0,none:0}; rev.forEach(r=>cls[cmap[r[field]]||'none']+=val(r));
  const tot = Object.values(cls).reduce((a,b)=>a+b,0)||1, comVal = tot-cls.none||1;
  const items = ['ok','warn','crit','none'].filter(k=>cls[k]>0).map(k=>({n:CLS[k].n,v:cls[k],c:CLS[k].c}));
  const pctOk = cls.ok/comVal*100, totB = Object.values(g).reduce((s,o)=>s+(basis==='custo'?o.custo:o.qtd),0)||1;
  const top = rev.filter(r=>topCls.includes(r[field])).sort((a,b)=>b.custo-a.custo).slice(0,10);
  const critV = cls.crit, critN = rev.filter(r=>cmap[r[field]]==='crit').length;
  $(id).innerHTML = `<h2>${title}</h2><p class="sub">${sub}</p>
  <div class="grid kpis">
    ${kpi('Estoque revenda',fmtV(rev.reduce((s,r)=>s+val(r),0)),fmtN.format(rev.length)+' linhas de palete')}
    ${kpi('Saudável',`<span class="good">${fmtP(pctOk)}</span>`,fmtV(cls.ok)+(cls.none?' · sem validade fora da conta':''))}
    ${kpi('Em atenção',`<span class="warnc">${fmtP(cls.warn/comVal*100)}</span>`,fmtV(cls.warn))}
    ${kpi('Crítico',`<span class="critc">${fmtP(cls.crit/comVal*100)}</span>`,fmtV(critV)+' · '+fmtN.format(critN)+' linhas')}
  </div>
  <div class="grid two" style="margin-top:14px">
    <div class="card"><h3>Saúde do estoque revenda</h3><div class="donutwrap">${donut(items,fmtP(pctOk,0),'saudável')}${legend(items)}</div></div>
    <div class="card"><h3>Por faixa</h3><div class="tw"><table>
      <tr><th>Faixa</th><th class="r">Linhas</th><th class="r">Qtd. endereçada</th><th class="r">Custo bruto</th><th>Participação</th></tr>
      ${order.map(f=>{const o=g[f],c=CLS[cmap[f]||'none'].c,v=basis==='custo'?o.custo:o.qtd;return `<tr><td><span class="dot" style="background:${c}"></span>${esc(f)}</td><td class="r">${fmtN.format(o.n)}</td><td class="r">${fmtN.format(o.qtd)}</td><td class="r">${brl(o.custo)}</td><td><span class="num">${fmtP(v/totB*100)}</span><span class="bar"><b style="width:${v/totB*100}%;background:${c}"></b></span></td></tr>`}).join('')}
    </table></div></div>
  </div>
  <div class="card" style="margin-top:14px"><h3>${topTitle}</h3><div class="tw"><table>
    <tr><th>Produto</th><th>Endereço</th><th>Status</th><th>Faixa</th><th class="r">Qtd.</th><th class="r">Custo bruto</th></tr>
    ${top.length?top.map(r=>`<tr><td>${esc(r.prod)}</td><td>${esc(r.end)}</td><td>${esc(r.status)}</td><td>${esc(r[field])}</td><td class="r">${fmtN.format(r.qtd)}</td><td class="r">${brl(r.custo)}</td></tr>`).join(''):'<tr><td colspan="6">Nenhum item nesta faixa.</td></tr>'}
  </table></div></div>`;
}

function occData(){
  const A = CONFIG.AREAS, by = {};
  D.addr.forEach(a=>{
    const p = a.end.split('.'); 
    // Aceita formatos como 01.01.1.05.10 (3º elemento área) ou 1.05.10 (1º elemento área)
    const ar = p.length >= 3 ? p[2] : p[0]; 
    const rua = p.length >= 4 ? +p[3] : +p[1] || 0; 
    const k = ar; 
    (by[k] = by[k] || {total:0, ocup:0, ruas:{}}); 
    by[k].total++; 
    if(a.occ) by[k].ocup++; 
    if(rua > 0){
      const r = (by[k].ruas[rua] = by[k].ruas[rua] || {t:0, o:0}); 
      r.t++; 
      if(a.occ) r.o++;
    }
  });
  const g1 = by[A.galpao1] || {total:0, ocup:0, ruas:{}}, g2 = by[A.galpao2] || {total:0, ocup:0, ruas:{}}, bl = by[A.blocados] || {total:0, ocup:0};
  const total = g1.total + g2.total, ocup = g1.ocup + g2.ocup;
  return {g1, g2, bl, total, ocup, pct: total ? ocup/total*100 : 0};
}

function ruaBars(g,livreCor){
  const ruas = Object.entries(g.ruas).filter(([,r])=>r.t>=5).sort((a,b)=>+a[0]-+b[0]);
  if(!ruas.length) return '<p style="color:var(--mute)">Nenhuma rua mapeada para esta área.</p>';
  return `<div class="lg"><span><i style="background:${livreCor}"></i>Livre</span><span><i style="background:var(--cream)"></i>Ocupado</span></div>
  <div class="rua">${ruas.map(([n,r])=>{const o=r.o/r.t*100,l=100-o;return `<div class="c"><div class="stk" title="Rua ${n}: ${fmtN.format(r.o)} ocupados de ${fmtN.format(r.t)}">
    <div class="lv" style="flex:${l};background:${livreCor};color:#fff">${l>=8?fmtP(l,1):''}</div>
    <div class="lv oc" style="flex:${Math.max(o,2)}">${o>=8?fmtP(o,1):''}</div></div><div class="name">${n}</div></div>`}).join('')}</div>`;
}

function secOcup(){
  const O = occData(), v = o=>o.total-o.ocup;
  const box = (cls,t,o)=>`<div class="mini ${cls}"><div class="b"><small>${t}</small><strong>${fmtN.format(o.total)}</strong></div><div class="b"><small>Ocupados</small><strong>${fmtN.format(o.ocup)}</strong></div><div class="b"><small>Vazios</small><strong>${fmtN.format(v(o))}</strong></div></div>`;
  const all = {total:O.total,ocup:O.ocup};
  const donutItems=[{n:'Livre',v:O.total-O.ocup,c:'var(--blue)'},{n:'Ocupado',v:O.ocup,c:'var(--cream)'}];
  const prev=basis; basis='qtd';
  const dn = donut(donutItems,fmtP(O.pct,2),'ocupação CD'); basis=prev;
  $('#s-ocup').innerHTML = `<h2>Ocupação · Porta-palete e blocado</h2><p class="sub">Endereços ativos. Galpão 1 é a área ${esc(CONFIG.AREAS.galpao1)} e Galpão 2 é a área ${esc(CONFIG.AREAS.galpao2)}.</p>
  <div class="grid occ">
    ${box('g1','Galpão 1',O.g1)}${box('g2','Galpão 2',O.g2)}${box('','Endereços',all)}${box('','Blocados',O.bl)}
    <div class="card donutcard"><h3>% de ocupação CD</h3><div class="donutwrap" style="justify-content:center">${dn}</div></div>
    <div class="pcts"><div class="row"><div class="b"><small>% Galpão 1</small><strong>${fmtP(O.g1.total?O.g1.ocup/O.g1.total*100:0,2)}</strong></div><div class="b"><small>% Galpão 2</small><strong>${fmtP(O.g2.total?O.g2.ocup/O.g2.total*100:0,2)}</strong></div></div>
      <div class="b big"><small>% Ocupação total CD</small><strong>${fmtP(O.pct,2)}</strong></div></div>
  </div>
  <div class="card" style="margin-top:14px"><h3>% de ocupação por rua · Galpão 1</h3>${ruaBars(O.g1,'var(--blue)')}</div>
  <div class="card" style="margin-top:14px"><h3>% de ocupação por rua · Galpão 2</h3>${ruaBars(O.g2,'var(--navy)')}</div>
  <p class="foot">Ruas com menos de 5 endereços não aparecem nos gráficos, mas contam nos totais.</p>`;
}

function render(){
  if(!D) return;
  secGeral();
  faixaSection('#s-shelf','Shelf life · Estoque revenda','Validade dos produtos. Saudável é acima de 60 dias, atenção de 16 a 60 e crítico até 15 dias.','shelf',D_SF(),SHELF_CLASS,['0 a 5 dias','06 a 15 dias'],'Produtos mais críticos (validade até 15 dias)');
  faixaSection('#s-aging','Aging · Estoque revenda','Tempo parado, pela faixa de aging. Saudável é até 30 dias, atenção de 30 a 60 e crítico acima de 60.','aging',D_AF(),AGING_CLASS,['Acima de 60 dias'],'Itens mais antigos (aging acima de 60 dias)');
  secOcup();
}
const D_SF = ()=>['0 a 5 dias','06 a 15 dias','16 a 30 dias','31 a 60 dias','61 a 90 dias','Acima de 90 dias','Sem data de Validade'];
const D_AF = ()=>['0 a 15 dias','16 a 30 dias','30 a 60 dias','Acima de 60 dias'];

/* ---------- Abas, Medida e Modo TV ---------- */
const TABS = [['s-geral','Visão geral'],['s-shelf','Shelf life'],['s-aging','Aging'],['s-ocup','Ocupação']];
let cur = 0;
function show(i){
  cur = i;
  TABS.forEach(([id],k)=>{ $('#'+id).classList.toggle('on',k===i); });
  document.querySelectorAll('#tabs button').forEach((b,k)=>b.setAttribute('aria-selected',k===i));
  try{ history.replaceState(null,'','#'+TABS[i][0].slice(2)); }catch(e){}
}
$('#tabs').innerHTML = TABS.map(([id,n],i)=>`<button role="tab" aria-selected="false" data-i="${i}">${n}</button>`).join('');
$('#tabs').addEventListener('click',e=>{const b=e.target.closest('button'); if(b) show(+b.dataset.i);});
$('#basis').addEventListener('click',e=>{const b=e.target.closest('button'); if(!b) return; basis=b.dataset.b; document.querySelectorAll('#basis button').forEach(x=>x.setAttribute('aria-pressed',x===b)); render();});
let tvTimer=null, tvStart=0;
function tvTick(){
  const el=(Date.now()-tvStart)/1000;
  $('#bar').style.width=Math.min(100,el/CONFIG.TV_SEGUNDOS*100)+'%';
  if(el>=CONFIG.TV_SEGUNDOS){ tvStart=Date.now(); show((cur+1)%TABS.length); }
}
$('#tv').addEventListener('click',()=>{
  const on = $('#tv').getAttribute('aria-pressed')!=='true';
  $('#tv').setAttribute('aria-pressed',on); document.body.classList.toggle('tvmode',on);
  clearInterval(tvTimer); $('#bar').style.width='0';
  if(on){ tvStart=Date.now(); tvTimer=setInterval(tvTick,250); try{document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen().catch(()=>{});}catch(e){} }
  else { try{document.fullscreenElement&&document.exitFullscreen();}catch(e){} }
});
const h = (location.hash||'').slice(1); const hi = TABS.findIndex(([id])=>id.slice(2)===h);
show(hi>=0?hi:0);
load();
setInterval(load,CONFIG.ATUALIZAR_MIN*60000);
</script>
</body>
</html>
