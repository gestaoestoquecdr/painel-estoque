name: Executar Robô WMS Bluesoft

on:
  schedule:
    # Executa a cada 1 hora (no minuto 0 de cada hora)
    - cron: '0 * * * *'
  workflow_dispatch: # Permite execução manual na aba Actions

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          pip install selenium google-api-python-client google-auth-httplib2 google-auth-oauthlib

      - name: Executar Robô Python
        env:
          WMS_USER: ${{ secrets.WMS_USER }}
          WMS_PASS: ${{ secrets.WMS_PASS }}
          GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
        run: python main.py
